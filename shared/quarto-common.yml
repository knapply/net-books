# Settings every book shares. A book's _quarto.yml pulls this in with
#   metadata-files: [../../shared/quarto-common.yml]
# File paths (bibliography, css, print.tex) are NOT set here: the generator
# writes them into each book's _quarto.yml, relative to the book.

lang: en
link-citations: true
number-sections: true
highlight-style: github

# Placeholders are plain code blocks (no engine needed). When a chapter gets real,
# runnable code, switch its blocks to executable chunks and set eval: true.
execute:
  eval: false
  echo: true
  warning: false
  freeze: auto

# The one-language-choice-for-the-whole-site behaviour comes from giving every
# tabset the same group, group="language" (see shared/templates/chapter.qmd).

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-link: false
    smooth-scroll: true

  # Print route: Quarto -> LaTeX -> PDF. Trim size, margins, fonts and the
  # three-language listing live in shared/tex/print.tex.
  pdf:
    documentclass: scrbook
    classoption: [oneside=false, openright, twoside]
    pdf-engine: xelatex
    geometry:
      - paperwidth=7.5in
      - paperheight=9.25in
      - inner=0.9in
      - outer=0.7in
      - top=0.8in
      - bottom=0.9in
    toc: true
    toc-depth: 2
    lof: false
    lot: false
    colorlinks: false
    links-as-notes: true
    keep-tex: true

  epub:
    toc: true
    toc-depth: 2
    # Set epub-cover-image in each book's _quarto.yml once a cover exists.
