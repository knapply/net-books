<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Friend lists read: separate searches versus one shared pass</title>
<desc>Two bars comparing how many friend-list entries are read by eight separate searches and by one shared pass.</desc>
<defs></defs>
<rect width="760" height="300" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Friend-list entries read, eight searches on the ten-person network</text>
<text x="188.0" y="96.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">eight separate searches</text>
<rect x="200" y="70" width="500.0" height="40" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="708.0" y="96.0" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">288</text>
<text x="188.0" y="166.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">one shared pass</text>
<rect x="200" y="140" width="187.5" height="40" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="395.5" y="166.0" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">108</text>
<text x="380.0" y="240.0" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">Shared pass, entries read at each step: 33, 35, 36, 3, 1</text>
<text x="380.0" y="268.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">A person&#x27;s list is read once per step in which any of the eight searches is passing through.</text>
</svg>
