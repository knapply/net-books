<text x="48.0" y="127.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ben</text>
<text x="158.0" y="127.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
