<rect x="40" y="340" width="830" height="29" rx="0" fill="#E69F0022" stroke="#d1d5db" stroke-width="1"/>
<text x="48.0" y="359.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Jo</text>
<text x="158.0" y="359.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">4</text>
<text x="308.0" y="359.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ivo</text>
<text x="438.0" y="359.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ana &gt; Fay &gt; Hana &gt; Ivo &gt; Jo</text>
<text x="450.0" y="32.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Everything below comes for free from one search</text>
<text x="450.0" y="395.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Jo is 4 steps away, and following &#x27;found by&#x27; backwards gives the route. Nothing else had to be computed.</text>
