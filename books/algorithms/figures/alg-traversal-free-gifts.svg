<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>What breadth-first search leaves behind</title>
<desc>A table with one row per person: the step they were found on, who found them, and the route back to Ana.</desc>
<defs></defs>
<rect width="900" height="420" fill="#ffffff"/>
<rect x="40" y="50" width="830" height="29" rx="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="48.0" y="69.7" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Person</text>
<text x="158.0" y="69.7" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Steps from Ana</text>
<text x="308.0" y="69.7" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Found by</text>
<text x="438.0" y="69.7" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Route from Ana</text>
