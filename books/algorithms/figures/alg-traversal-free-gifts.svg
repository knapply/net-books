<text x="308.0" y="272.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ben</text>
<text x="438.0" y="272.7" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ana &gt; Ben &gt; Gus</text>
