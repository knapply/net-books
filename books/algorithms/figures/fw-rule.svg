<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>The Floyd-Warshall question: is the detour shorter?</title>
<desc>Three stops, Ana, Cleo and Ben, with a direct ride of 9 minutes and a detour through Cleo of 2 plus 3 minutes.</desc>
<defs></defs>
<rect width="820" height="330" fill="#ffffff"/>
<line x1="175.0" y1="190.0" x2="645.0" y2="190.0" stroke="#9ca3af" stroke-width="3.5"/>
<text x="410.0" y="238.0" font-size="15" text-anchor="middle" font-weight="600" fill="#6b7280">direct ride: 9 minutes</text>
<line x1="173.0" y1="180.3" x2="387.0" y2="89.7" stroke="#E69F00" stroke-width="3.5"/>
<line x1="433.0" y1="89.7" x2="647.0" y2="180.3" stroke="#E69F00" stroke-width="3.5"/>
<text x="250.0" y="110.0" font-size="15" text-anchor="middle" font-weight="600" fill="#E69F00">2 minutes</text>
<text x="570.0" y="110.0" font-size="15" text-anchor="middle" font-weight="600" fill="#E69F00">3 minutes</text>
<circle cx="150" cy="190" r="24" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="150.0" y="194.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<circle cx="410" cy="80" r="24" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="410.0" y="84.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Cleo</text>
<circle cx="670" cy="190" r="24" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="670.0" y="194.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<text x="410.0" y="40.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">Allow Cleo as a stopover</text>
<text x="410.0" y="282.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">2 + 3 = 5 is less than 9, so Ana to Ben becomes 5.</text>
<text x="410.0" y="308.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7280">The rule: new d(i, j) = the smaller of d(i, j) and d(i, k) + d(k, j).</text>
</svg>
