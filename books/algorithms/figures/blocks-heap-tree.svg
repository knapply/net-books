<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A heap</title>
<desc>A heap drawn as a tree and stored as a list.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">A heap: a tree on paper, a plain list in memory. The smallest is always on top.</text>
<line x1="233.3" y1="80.9" x2="171.7" y2="121.1" stroke="#6b7280" stroke-width="1.8"/>
<line x1="266.7" y1="80.9" x2="328.3" y2="121.1" stroke="#6b7280" stroke-width="1.8"/>
<line x1="142.8" y1="147.9" x2="119.7" y2="178.1" stroke="#6b7280" stroke-width="1.8"/>
<line x1="167.2" y1="147.9" x2="190.3" y2="178.1" stroke="#6b7280" stroke-width="1.8"/>
<line x1="332.8" y1="147.9" x2="309.7" y2="178.1" stroke="#6b7280" stroke-width="1.8"/>
<line x1="357.2" y1="147.9" x2="380.3" y2="178.1" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="250.0" cy="70" r="19" fill="#fdf1d6" stroke="#E69F00" stroke-width="2"/>
<text x="250.0" y="75.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="250.0" y="103.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="155.0" cy="132" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="155.0" y="137.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">5</text>
<text x="155.0" y="165.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="345.0" cy="132" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="345.0" y="137.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="345.0" y="165.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="107.5" cy="194" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="107.5" y="199.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">9</text>
<text x="107.5" y="227.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="202.5" cy="194" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="202.5" y="199.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">6</text>
<text x="202.5" y="227.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<circle cx="297.5" cy="194" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="297.5" y="199.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<text x="297.5" y="227.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Fay</text>
<circle cx="392.5" cy="194" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="392.5" y="199.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">8</text>
<text x="392.5" y="227.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Gus</text>
<text x="520.0" y="80.0" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">The same heap as a list:</text>
<rect x="520" y="96" width="44" height="34" rx="0" fill="#fdf1d6" stroke="#1f2937" stroke-width="1.6"/>
<text x="542.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">2</text>
<text x="542.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">0</text>
<rect x="564" y="96" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="586.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">5</text>
<text x="586.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1</text>
<rect x="608" y="96" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="630.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">3</text>
<text x="630.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">2</text>
<rect x="652" y="96" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="674.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">9</text>
<text x="674.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">3</text>
<rect x="696" y="96" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="718.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">6</text>
<text x="718.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">4</text>
<rect x="740" y="96" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="762.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">4</text>
<text x="762.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">5</text>
<rect x="784" y="96" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="806.0" y="118.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">8</text>
<text x="806.0" y="144.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">6</text>
<text x="512.0" y="144.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280" font-style="italic">slot</text>
<text x="520.0" y="170.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">The rule: every parent is no bigger than its children.</text>
<text x="520.0" y="196.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Where is the family? Just arithmetic on the slot number i:</text>
<text x="534.0" y="220.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>children of slot i: slots 2i+1 and 2i+2</text>
<text x="534.0" y="242.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>parent of slot i: slot (i-1) // 2</text>
<text x="520.0" y="262.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">(// means divide, then drop the remainder.)</text>
<text x="520.0" y="290.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Example: slot 1 (Ben, 5) has children in slots 3 and 4: 9 and 6.</text>
</svg>
