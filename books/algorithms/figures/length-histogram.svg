<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Most routes are the long ones</title>
<desc>A bar for each route length on a four by four grid of people, counting every route that never repeats a person.</desc>
<defs></defs>
<rect width="860" height="400" fill="#ffffff"/>
<rect x="108.75" y="193.33333333333331" width="87.5" height="116.66666666666667" rx="0" fill="#0072B266" stroke="#0072B2" stroke-width="1.3"/>
<text x="152.5" y="185.3" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">20</text>
<text x="152.5" y="332.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">6 steps</text>
<rect x="233.75" y="100.0" width="87.5" height="210.0" rx="0" fill="#9ca3af66" stroke="#9ca3af" stroke-width="1.3"/>
<text x="277.5" y="92.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">36</text>
<text x="277.5" y="332.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">8 steps</text>
<rect x="358.75" y="30.0" width="87.5" height="280.0" rx="0" fill="#9ca3af66" stroke="#9ca3af" stroke-width="1.3"/>
<text x="402.5" y="22.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">48</text>
<text x="402.5" y="332.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">10 steps</text>
<rect x="483.75000000000006" y="30.0" width="87.5" height="280.0" rx="0" fill="#9ca3af66" stroke="#9ca3af" stroke-width="1.3"/>
<text x="527.5" y="22.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">48</text>
<text x="527.5" y="332.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">12 steps</text>
<rect x="608.75" y="123.33333333333334" width="87.5" height="186.66666666666666" rx="0" fill="#9ca3af66" stroke="#9ca3af" stroke-width="1.3"/>
<text x="652.5" y="115.3" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">32</text>
<text x="652.5" y="332.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">14 steps</text>
<text x="440.0" y="362.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">All 184 routes between opposite corners, grouped by length</text>
<text x="440.0" y="386.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Only the first bar (blue) holds shortest routes. Capping by length keeps the cheap end.</text>
</svg>
