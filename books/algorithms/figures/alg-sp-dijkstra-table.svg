<text x="28.0" y="120.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<text x="83.0" y="120.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Cleo at 2</text>
<text x="203.0" y="120.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Dev 9 to 7</text>
