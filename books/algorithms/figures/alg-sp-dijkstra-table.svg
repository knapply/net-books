<text x="533.0" y="270.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Hana 13</text>
<rect x="20" y="280" width="940" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="300.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">8</text>
<text x="83.0" y="300.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Hana at 13</text>
