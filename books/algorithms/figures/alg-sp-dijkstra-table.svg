<text x="83.0" y="60.4" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Settled</text>
<text x="203.0" y="60.4" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Guesses that improved</text>
<text x="533.0" y="60.4" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Still waiting (best guess so far)</text>
<rect x="20" y="70" width="940" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="90.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<text x="83.0" y="90.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Ana at 0</text>
<text x="203.0" y="90.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Ben ? to 6, Cleo ? to 2, Dev ? to 9, Fay ? to 8</text>
<text x="533.0" y="90.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Cleo 2, Ben 6, Fay 8, Dev 9</text>
