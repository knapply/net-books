<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Dijkstra&#x27;s algorithm by hand, from Ana</title>
<desc>A table with one row per person settled: who, their minutes from Ana, what changed, and who is still waiting.</desc>
<defs></defs>
<rect width="960" height="400" fill="#ffffff"/>
<rect x="20" y="40" width="940" height="30" rx="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
