<text x="203.0" y="150.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Eli ? to 12, Gus ? to 16</text>
<text x="533.0" y="150.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Dev 7, Fay 8, Eli 12, Gus 16</text>
<rect x="20" y="160" width="940" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
