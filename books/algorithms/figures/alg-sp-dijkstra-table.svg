<text x="533.0" y="180.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Fay 8, Eli 9, Gus 14</text>
<rect x="20" y="190" width="940" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="210.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">5</text>
<text x="83.0" y="210.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Fay at 8</text>
<text x="203.0" y="210.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Hana ? to 13</text>
