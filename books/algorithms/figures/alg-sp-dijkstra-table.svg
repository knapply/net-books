<text x="533.0" y="300.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Ivo 17</text>
<rect x="20" y="310" width="940" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="330.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">9</text>
<text x="83.0" y="330.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Ivo at 17</text>
<text x="203.0" y="330.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Jo ? to 20</text>
<text x="533.0" y="330.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Jo 20</text>
<rect x="20" y="340" width="940" height="30" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="360.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">10</text>
<text x="83.0" y="360.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Jo at 20</text>
<text x="203.0" y="360.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">nothing changes</text>
<text x="533.0" y="360.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">(empty)</text>
<text x="480.0" y="26.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">A &#x27;?&#x27; means no guess yet (no route found so far)</text>
<text x="480.0" y="394.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Each person&#x27;s final minutes are the numbers in the Settled column.</text>
</svg>
