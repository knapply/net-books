<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Counting steps by hand</title>
<desc>Is Ana tied to Dev, in an edge list and in an adjacency list.</desc>
<defs><marker id="arrow-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Is Ana tied to Dev? Count the steps.</text>
<text x="30.0" y="66.0" font-size="14" text-anchor="start" font-weight="700" fill="#0072B2">Edge list: look at every row</text>
<rect x="70" y="80" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<rect x="140" y="80" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="105.0" y="100.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="175.0" y="100.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="44" cy="94" r="12" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="44.0" y="98.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="232.0" y="100.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">not (0, 3)</text>
<rect x="70" y="114" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<rect x="140" y="114" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="105.0" y="134.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="175.0" y="134.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<circle cx="44" cy="128" r="12" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="44.0" y="132.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="232.0" y="134.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">not (0, 3)</text>
<rect x="70" y="148" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<rect x="140" y="148" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="105.0" y="168.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="175.0" y="168.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<circle cx="44" cy="162" r="12" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="44.0" y="166.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="232.0" y="168.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">not (0, 3)</text>
<rect x="70" y="182" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<rect x="140" y="182" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="105.0" y="202.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="175.0" y="202.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<circle cx="44" cy="196" r="12" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="44.0" y="200.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<text x="232.0" y="202.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">not (0, 3)</text>
<rect x="70" y="216" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<rect x="140" y="216" width="70" height="28" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="105.0" y="236.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="175.0" y="236.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<circle cx="44" cy="230" r="12" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="44.0" y="234.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">5</text>
<text x="232.0" y="236.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">not (0, 3)</text>
<text x="70.0" y="266.0" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">5 rows looked at, then we can say no.</text>
<text x="70.0" y="286.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Ten times the ties would mean 50 looks.</text>
<text x="500.0" y="66.0" font-size="14" text-anchor="start" font-weight="700" fill="#009E73">Adjacency list: go straight to Ana</text>
<circle cx="530" cy="110" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="530.0" y="114.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="560.0" y="115.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Ana</text>
<line x1="601.0" y1="110.0" x2="646.0" y2="110.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<rect x="654" y="94" width="64" height="32" rx="4" fill="#d8f0e8" stroke="#009E73" stroke-width="1.6"/>
<text x="686.0" y="115.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="500" cy="170" r="12" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="500.0" y="174.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="522.0" y="175.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">jump to Ana&#x27;s list</text>
<circle cx="500" cy="205" r="12" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="500.0" y="209.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="522.0" y="210.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">look at its one entry: Ben, not Dev</text>
<text x="500.0" y="266.0" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">2 steps, then we can say no.</text>
<text x="500.0" y="286.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Ten times the ties: still about 2 steps for Ana.</text>
</svg>
