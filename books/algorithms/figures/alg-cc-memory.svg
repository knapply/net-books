<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Where the memory goes</title>
<desc>Horizontal bars in megabytes for the half-million-person Chung-Lu run: measured peak, and the arithmetic sizes of its parts.</desc>
<defs></defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="380.0" y="28.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Chung-Lu, n = 500,000, m = 1.95M: megabytes</text>
<text x="288.0" y="74.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">peak memory, measured</text>
<text x="288.0" y="90.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">measured</text>
<rect x="300" y="56" width="365.030303030303" height="28" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="671.0" y="75.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">317 MB</text>
<text x="288.0" y="126.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">search state, 2 threads (upper bound)</text>
<text x="288.0" y="142.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280" font-style="italic">arithmetic</text>
<rect x="300" y="108" width="221.0909090909091" height="28" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0" stroke-dasharray="5 3"/>
<text x="527.1" y="127.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">192 MB</text>
<text x="288.0" y="178.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">friend lists, plain 4 bytes</text>
<text x="288.0" y="194.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280" font-style="italic">arithmetic</text>
<rect x="300" y="160" width="17.963636363636365" height="28" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0" stroke-dasharray="5 3"/>
<text x="324.0" y="179.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">16 MB</text>
<text x="288.0" y="230.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">friend lists, gap-coded</text>
<text x="288.0" y="246.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280" font-style="italic">arithmetic</text>
<rect x="300" y="212" width="9.88" height="28" rx="0" fill="#56B4E9" stroke="#56B4E9" stroke-width="0" stroke-dasharray="5 3"/>
<text x="315.9" y="231.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">5 to 9 MB</text>
<text x="380.0" y="284.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">Search state: 3 arrays x 64 bytes per person (512 bits), per thread, for all n people;</text>
<text x="380.0" y="302.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">the shrunk graph has fewer people, so the real figure is lower. Friend lists: 2m entries.</text>
</svg>
