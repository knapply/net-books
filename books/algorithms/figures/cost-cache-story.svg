<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A cache analogy</title>
<desc>Desk, shelf and archive.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Why memory has levels: the desk, the shelf and the archive</text>
<rect x="60" y="60" width="230" height="190" rx="10" fill="#d8f0e8" stroke="#009E73" stroke-width="2"/>
<text x="175.0" y="90.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Your desk</text>
<text x="175.0" y="112.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">= the processor&#x27;s cache</text>
<rect x="340" y="60" width="230" height="190" rx="10" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="455.0" y="90.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">The shelf across the room</text>
<text x="455.0" y="112.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">= main memory</text>
<rect x="620" y="60" width="230" height="190" rx="10" fill="#fbe3d6" stroke="#D55E00" stroke-width="2"/>
<text x="735.0" y="90.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">The archive across town</text>
<text x="735.0" y="112.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">= a solid-state drive</text>
<rect x="100" y="150" width="150" height="14" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<rect x="115" y="125" width="30" height="25" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.4"/>
<rect x="160" y="130" width="24" height="20" rx="0" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.4"/>
<text x="175.0" y="190.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">a few notes, at arm&#x27;s reach</text>
<rect x="370" y="128" width="170" height="12" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
<rect x="374" y="122" width="20" height="8" rx="0" fill="#56B4E9" stroke="#0072B2" stroke-width="1"/>
<rect x="402" y="122" width="20" height="8" rx="0" fill="#eef6fb" stroke="#0072B2" stroke-width="1"/>
<rect x="430" y="122" width="20" height="8" rx="0" fill="#fdf1d6" stroke="#0072B2" stroke-width="1"/>
<rect x="458" y="122" width="20" height="8" rx="0" fill="#56B4E9" stroke="#0072B2" stroke-width="1"/>
<rect x="486" y="122" width="20" height="8" rx="0" fill="#eef6fb" stroke="#0072B2" stroke-width="1"/>
<rect x="514" y="122" width="20" height="8" rx="0" fill="#fdf1d6" stroke="#0072B2" stroke-width="1"/>
<rect x="370" y="146" width="170" height="12" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
<rect x="374" y="140" width="20" height="8" rx="0" fill="#56B4E9" stroke="#0072B2" stroke-width="1"/>
<rect x="402" y="140" width="20" height="8" rx="0" fill="#eef6fb" stroke="#0072B2" stroke-width="1"/>
<rect x="430" y="140" width="20" height="8" rx="0" fill="#fdf1d6" stroke="#0072B2" stroke-width="1"/>
<rect x="458" y="140" width="20" height="8" rx="0" fill="#56B4E9" stroke="#0072B2" stroke-width="1"/>
<rect x="486" y="140" width="20" height="8" rx="0" fill="#eef6fb" stroke="#0072B2" stroke-width="1"/>
<rect x="514" y="140" width="20" height="8" rx="0" fill="#fdf1d6" stroke="#0072B2" stroke-width="1"/>
<rect x="370" y="164" width="170" height="12" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
<rect x="374" y="158" width="20" height="8" rx="0" fill="#56B4E9" stroke="#0072B2" stroke-width="1"/>
<rect x="402" y="158" width="20" height="8" rx="0" fill="#eef6fb" stroke="#0072B2" stroke-width="1"/>
<rect x="430" y="158" width="20" height="8" rx="0" fill="#fdf1d6" stroke="#0072B2" stroke-width="1"/>
<rect x="458" y="158" width="20" height="8" rx="0" fill="#56B4E9" stroke="#0072B2" stroke-width="1"/>
<rect x="486" y="158" width="20" height="8" rx="0" fill="#eef6fb" stroke="#0072B2" stroke-width="1"/>
<rect x="514" y="158" width="20" height="8" rx="0" fill="#fdf1d6" stroke="#0072B2" stroke-width="1"/>
<text x="455.0" y="198.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">many binders, a short walk</text>
<rect x="650" y="125" width="36" height="56" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="668.0" y="158.0" font-size="14" text-anchor="middle" font-weight="700" fill="#6b7280">A</text>
<rect x="692" y="125" width="36" height="56" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="710.0" y="158.0" font-size="14" text-anchor="middle" font-weight="700" fill="#6b7280">B</text>
<rect x="734" y="125" width="36" height="56" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="752.0" y="158.0" font-size="14" text-anchor="middle" font-weight="700" fill="#6b7280">C</text>
<rect x="776" y="125" width="36" height="56" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="794.0" y="158.0" font-size="14" text-anchor="middle" font-weight="700" fill="#6b7280">D</text>
<text x="735.0" y="198.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">a whole building, a car ride</text>
<text x="175.0" y="228.0" font-size="14" text-anchor="middle" font-weight="700" fill="#009E73">about 1 second</text>
<text x="175.0" y="244.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">(really 1 ns)</text>
<text x="455.0" y="228.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0072B2">about a minute and a half</text>
<text x="455.0" y="244.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">(really 80 ns)</text>
<text x="735.0" y="228.0" font-size="14" text-anchor="middle" font-weight="700" fill="#D55E00">more than a day</text>
<text x="735.0" y="244.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">(really 100 microseconds)</text>
<text x="30.0" y="280.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Stretch one nanosecond to one second and these are the waits for one fetch. The numbers are rough, typical ones.</text>
<text x="30.0" y="304.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">A fast program works like a good clerk: grab a whole armful at once, and use it all before going back.</text>
</svg>
