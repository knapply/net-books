<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>How long it really takes</title>
<desc>Time for each growth rate at a billion steps a second.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">How long, at a billion steps a second?</text>
<text x="270.0" y="74.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1,000 people</text>
<text x="510.0" y="74.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1,000,000 people</text>
<text x="750.0" y="74.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1,000,000,000 people</text>
<text x="138.0" y="119.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">n</text>
<rect x="156" y="94" width="228" height="38" rx="6" fill="#d8f0e8" stroke="#009E73" stroke-width="1.6"/>
<text x="270.0" y="119.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1.0 microseconds</text>
<rect x="396" y="94" width="228" height="38" rx="6" fill="#d8f0e8" stroke="#009E73" stroke-width="1.6"/>
<text x="510.0" y="119.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1.0 milliseconds</text>
<rect x="636" y="94" width="228" height="38" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="750.0" y="119.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1.0 seconds</text>
<text x="138.0" y="165.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">n log n</text>
<rect x="156" y="140" width="228" height="38" rx="6" fill="#d8f0e8" stroke="#009E73" stroke-width="1.6"/>
<text x="270.0" y="165.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">10 microseconds</text>
<rect x="396" y="140" width="228" height="38" rx="6" fill="#d8f0e8" stroke="#009E73" stroke-width="1.6"/>
<text x="510.0" y="165.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">20 milliseconds</text>
<rect x="636" y="140" width="228" height="38" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="750.0" y="165.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">30 seconds</text>
<text x="138.0" y="211.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">n squared</text>
<rect x="156" y="186" width="228" height="38" rx="6" fill="#d8f0e8" stroke="#009E73" stroke-width="1.6"/>
<text x="270.0" y="211.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1.0 milliseconds</text>
<rect x="396" y="186" width="228" height="38" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="510.0" y="211.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">17 minutes</text>
<rect x="636" y="186" width="228" height="38" rx="6" fill="#fbe3d6" stroke="#D55E00" stroke-width="1.6"/>
<text x="750.0" y="211.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">32 years</text>
<text x="138.0" y="257.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">n cubed</text>
<rect x="156" y="232" width="228" height="38" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="270.0" y="257.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1.0 seconds</text>
<rect x="396" y="232" width="228" height="38" rx="6" fill="#fbe3d6" stroke="#D55E00" stroke-width="1.6"/>
<text x="510.0" y="257.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">32 years</text>
<rect x="636" y="232" width="228" height="38" rx="6" fill="#fbe3d6" stroke="#D55E00" stroke-width="1.6"/>
<text x="750.0" y="257.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">older than the universe</text>
<text x="30.0" y="298.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2 to the n is off the table: at just 100 people it needs about 40 trillion years.</text>
<text x="30.0" y="320.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">Green: instant. Blue: a coffee break. Orange: the project deadline. Red: a career or longer.</text>
</svg>
