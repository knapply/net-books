<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>How a check works</title>
<desc>A diagram: the same input goes to your routine and to a trusted reference, and the two answers are compared within a tolerance.</desc>
<defs><marker id="arrow-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="920" height="330" fill="#ffffff"/>
<rect x="30" y="125" width="150" height="80" rx="12" fill="#0072B218" stroke="#0072B2" stroke-width="2"/>
<text x="105.0" y="159.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Same input</text>
<text x="105.0" y="181.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">a small network</text>
<rect x="300" y="50" width="190" height="80" rx="12" fill="#E69F0018" stroke="#E69F00" stroke-width="2"/>
<text x="395.0" y="84.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Your routine</text>
<text x="395.0" y="106.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">the thing being tested</text>
<rect x="300" y="200" width="190" height="80" rx="12" fill="#CC79A718" stroke="#CC79A7" stroke-width="2"/>
<text x="395.0" y="234.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Reference</text>
<text x="395.0" y="256.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">a tool you trust, or a hand answer</text>
<line x1="180.9" y1="149.6" x2="294.4" y2="93.8" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-6b7280)"/>
<line x1="180.9" y1="180.4" x2="294.4" y2="236.2" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-6b7280)"/>
<rect x="610" y="125" width="150" height="80" rx="12" fill="#009E7318" stroke="#009E73" stroke-width="2"/>
<text x="685.0" y="159.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Compare</text>
<text x="685.0" y="181.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">within a tolerance</text>
<line x1="490.9" y1="92.4" x2="604.4" y2="148.2" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-6b7280)"/>
<line x1="490.9" y1="237.6" x2="604.4" y2="181.8" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-6b7280)"/>
<line x1="761.0" y1="165.0" x2="796.0" y2="165.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-6b7280)"/>
<text x="860.0" y="150.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#009E73">agree:</text>
<text x="860.0" y="168.0" font-size="13" text-anchor="middle" font-weight="400" fill="#009E73">carry on</text>
<text x="860.0" y="205.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#D55E00">differ:</text>
<text x="860.0" y="223.0" font-size="13" text-anchor="middle" font-weight="400" fill="#D55E00">find out why</text>
<text x="460.0" y="312.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">A difference is a question, not a verdict. Either side, or the input, or the convention, can be the one that is off.</text>
</svg>
