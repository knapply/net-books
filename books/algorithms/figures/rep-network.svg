<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Five people, five ties</title>
<desc>The five-person network with ids and names.</desc>
<defs></defs>
<rect width="900" height="270" fill="#ffffff"/>
<text x="30.0" y="34.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Five people and the ties between them</text>
<line x1="81.0" y1="150.5" x2="148.2" y2="150.5" stroke="#1f2937" stroke-width="2"/>
<line x1="186.1" y1="137.9" x2="244.4" y2="94.1" stroke="#1f2937" stroke-width="2"/>
<line x1="186.1" y1="163.1" x2="244.4" y2="206.9" stroke="#1f2937" stroke-width="2"/>
<line x1="261.2" y1="102.5" x2="261.2" y2="198.5" stroke="#1f2937" stroke-width="2"/>
<line x1="282.2" y1="219.5" x2="349.5" y2="219.5" stroke="#1f2937" stroke-width="2"/>
<circle cx="60.0" cy="150.5" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="60.0" y="155.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="60.0" y="186.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="169.25" cy="150.5" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="169.2" y="155.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="169.2" y="186.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="261.25" cy="81.5" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="261.2" y="86.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="261.2" y="53.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="261.25" cy="219.5" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="261.2" y="224.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="261.2" y="255.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="370.5" cy="219.5" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
