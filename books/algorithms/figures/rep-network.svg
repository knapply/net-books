<text x="370.5" y="255.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<text x="450.0" y="70.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Computers count from zero:</text>
<circle cx="470" cy="112" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="470.0" y="116.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="470.0" y="150.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="552" cy="112" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="552.0" y="116.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="552.0" y="150.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="634" cy="112" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="634.0" y="116.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="634.0" y="150.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="716" cy="112" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="716.0" y="116.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="716.0" y="150.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="798" cy="112" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="798.0" y="116.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<text x="798.0" y="150.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<text x="450.0" y="190.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">The number inside each dot is the person&#x27;s id. The name is a label.</text>
<text x="450.0" y="210.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Ties: Ana-Ben, Ben-Cleo, Ben-Dev, Cleo-Dev, Dev-Eli.</text>
