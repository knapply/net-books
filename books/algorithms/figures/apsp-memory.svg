<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>The table itself is the problem at scale</title>
<desc>Horizontal bars on a log scale: memory for a full distance table at four network sizes.</desc>
<defs></defs>
<rect width="860" height="330" fill="#ffffff"/>
<text x="188.0" y="54.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">1,000 people</text>
<rect x="200" y="36" width="48.164799306237" height="28" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="1.2"/>
<text x="256.2" y="55.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">4 megabytes: a photo</text>
<text x="188.0" y="116.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">10,000 people</text>
<rect x="200" y="98" width="208.164799306237" height="28" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="1.2"/>
<text x="416.2" y="117.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">400 megabytes: a laptop copes</text>
<text x="188.0" y="178.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">100,000 people</text>
<rect x="200" y="160" width="368.164799306237" height="28" rx="0" fill="#D55E0055" stroke="#D55E00" stroke-width="1.2"/>
<text x="576.2" y="179.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">40 gigabytes: a big server</text>
<text x="188.0" y="240.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">1,000,000 people</text>
<rect x="200" y="222" width="528.164799306237" height="28" rx="0" fill="#D55E0055" stroke="#D55E00" stroke-width="1.2"/>
<text x="736.2" y="241.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">4 terabytes: a data center</text>
<text x="200.0" y="300.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10^6 bytes</text>
<text x="360.0" y="300.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10^8 bytes</text>
<text x="520.0" y="300.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10^10 bytes</text>
<text x="680.0" y="300.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10^12 bytes</text>
</svg>
