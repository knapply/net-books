<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A typical random generator misses the odd corners</title>
<desc>Bars showing how many of 4,000 random tiny networks contain each awkward feature, for plain random generation and for generation that deliberately adds odd features.</desc>
<defs></defs>
<rect width="920" height="420" fill="#ffffff"/>
<text x="460.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Share of 4,000 tiny networks containing each feature</text>
<text x="318.0" y="82.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">no ties at all</text>
<rect x="330" y="60" width="137.93" height="17" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.2"/>
<text x="475.9" y="73.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">26.5%</text>
<rect x="330" y="80" width="103.09" height="17" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.2"/>
<text x="441.1" y="93.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">19.8%</text>
<text x="318.0" y="132.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">someone with no friends</text>
<rect x="330" y="110" width="252.07" height="17" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.2"/>
<text x="590.1" y="123.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">48.5%</text>
<rect x="330" y="130" width="479.96" height="17" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.2"/>
<text x="818.0" y="143.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">92.3%</text>
<text x="318.0" y="182.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">two or more islands</text>
<rect x="330" y="160" width="193.7" height="17" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.2"/>
<text x="531.7" y="173.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">37.2%</text>
<rect x="330" y="180" width="412.75" height="17" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.2"/>
<text x="750.8" y="193.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">79.4%</text>
<text x="318.0" y="232.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">a person tied to themselves</text>
<rect x="330" y="210" width="1" height="17" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.2"/>
<text x="338.0" y="223.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">0.0%</text>
<rect x="330" y="230" width="235.43" height="17" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.2"/>
<text x="573.4" y="243.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">45.3%</text>
<text x="318.0" y="282.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">the same tie listed twice</text>
<rect x="330" y="260" width="1" height="17" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.2"/>
<text x="338.0" y="273.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">0.0%</text>
<rect x="330" y="280" width="145.73" height="17" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.2"/>
<text x="483.7" y="293.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">28.0%</text>
<text x="318.0" y="332.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">all of those at once</text>
<rect x="330" y="310" width="1" height="17" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.2"/>
<text x="338.0" y="323.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">0.0%</text>
<rect x="330" y="330" width="70.59" height="17" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.2"/>
<text x="408.6" y="343.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">13.6%</text>
<rect x="330" y="372" width="14" height="12" rx="0" fill="#0072B277" stroke="#0072B2" stroke-width="1.5"/>
<text x="350.0" y="383.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">typical random generator</text>
<rect x="560" y="372" width="14" height="12" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.5"/>
<text x="580.0" y="383.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">random plus deliberate odd features</text>
<text x="460.0" y="410.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">A fuzzer is only as good as the corners it can reach. Say what odd inputs it should add.</text>
</svg>
