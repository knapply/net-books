<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Places where careful tools differ</title>
<desc>A table of six common conventions with the two answers each tool might give.</desc>
<defs></defs>
<rect width="960" height="420" fill="#ffffff"/>
<rect x="20" y="44" width="940" height="46" rx="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="75.3" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Question</text>
<text x="298.0" y="75.3" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">One tool says</text>
<text x="528.0" y="75.3" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Another says</text>
<text x="758.0" y="75.3" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Why they can differ</text>
<rect x="20" y="90" width="940" height="46" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="121.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">A person tied to themselves</text>
<text x="298.0" y="121.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">degree counts it once: 1</text>
<text x="528.0" y="121.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">counts it twice: 2</text>
<text x="758.0" y="121.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">a loop has two ends</text>
<rect x="20" y="136" width="940" height="46" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="167.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Closeness with an unreachable person</text>
<text x="298.0" y="167.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">ignore them</text>
<text x="528.0" y="167.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">score 0, or add 1/distance</text>
<text x="758.0" y="167.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">no distance exists</text>
<rect x="20" y="182" width="940" height="46" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="213.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Clustering of someone with 1 friend</text>
<text x="298.0" y="213.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">0</text>
<text x="528.0" y="213.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">not defined (empty)</text>
<text x="758.0" y="213.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">no pair of friends to test</text>
<rect x="20" y="228" width="940" height="46" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="259.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Betweenness of the middle of 5 in a row</text>
<text x="298.0" y="259.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">raw count: 4</text>
<text x="528.0" y="259.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">scaled to 0 to 1: 0.67</text>
<text x="758.0" y="259.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">same routes, different units</text>
<rect x="20" y="274" width="940" height="46" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="305.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Which shortest route to list</text>
<text x="298.0" y="305.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">first in alphabetical order</text>
<text x="528.0" y="305.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">first in the order typed</text>
<text x="758.0" y="305.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">ties need a rule</text>
<rect x="20" y="320" width="940" height="46" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="351.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Two ties between the same pair</text>
<text x="298.0" y="351.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">count as one</text>
<text x="528.0" y="351.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">count as two</text>
<text x="758.0" y="351.3" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">multigraph or not</text>
<text x="480.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Six places where two correct tools can print different numbers</text>
<text x="480.0" y="396.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Before comparing two tools, line up the conventions. After, any difference left is worth chasing.</text>
</svg>
