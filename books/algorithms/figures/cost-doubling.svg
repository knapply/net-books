<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Doubling the network</title>
<desc>How much longer the job takes when the input doubles.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Double the network. How much longer does the job take?</text>
<text x="258.0" y="94.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">one pass over everything</text>
<rect x="270" y="74" width="122.3529411764706" height="30" rx="0" fill="#009E7333" stroke="#009E73" stroke-width="1.8"/>
<text x="402.4" y="95.0" font-size="13" text-anchor="start" font-weight="700" fill="#009E73">about 2.0 times</text>
<text x="258.0" y="140.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">sorting (n log n)</text>
<rect x="270" y="120" width="134.63024296041337" height="30" rx="0" fill="#0072B233" stroke="#0072B2" stroke-width="1.8"/>
<text x="414.6" y="141.0" font-size="13" text-anchor="start" font-weight="700" fill="#0072B2">about 2.2 times</text>
<text x="258.0" y="186.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">every pair (n squared)</text>
<rect x="270" y="166" width="244.7058823529412" height="30" rx="0" fill="#E69F0033" stroke="#E69F00" stroke-width="1.8"/>
<text x="524.7" y="187.0" font-size="13" text-anchor="start" font-weight="700" fill="#E69F00">about 4.0 times</text>
<text x="258.0" y="232.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">every triple (n cubed)</text>
<rect x="270" y="212" width="489.4117647058824" height="30" rx="0" fill="#CC79A733" stroke="#CC79A7" stroke-width="1.8"/>
<text x="769.4" y="233.0" font-size="13" text-anchor="start" font-weight="700" fill="#CC79A7">about 8.0 times</text>
<text x="258.0" y="278.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">try every subset (2 to the n)</text>
<rect x="270" y="258" width="520" height="30" rx="0" fill="#D55E0033" stroke="#D55E00" stroke-width="1.8"/>
<text x="530.0" y="279.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">squared: 2 to the 2,000 instead of 2 to the 1,000</text>
<text x="798.0" y="279.0" font-size="18" text-anchor="start" font-weight="700" fill="#D55E00">&gt;</text>
<text x="270.0" y="318.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">Computed for a network of 1,000 people growing to 2,000.</text>
</svg>
