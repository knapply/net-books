<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Same question, four answers</title>
<desc>A network of two islands, and four closeness scores for Ben and Eli under four conventions.</desc>
<defs></defs>
<rect width="920" height="470" fill="#ffffff"/>
<line x1="79.0" y1="83.7" x2="131.0" y2="66.3" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="169.0" y1="66.3" x2="221.0" y2="83.7" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="259.0" y1="83.7" x2="311.0" y2="66.3" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="100.0" y1="220.0" x2="180.0" y2="220.0" stroke="#9ca3af" stroke-width="1.8"/>
<circle cx="60" cy="90" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="60.0" y="94.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<text x="60.0" y="123.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="150" cy="60" r="19" fill="#E69F0088" stroke="#1f2937" stroke-width="2"/>
<text x="150.0" y="64.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<text x="150.0" y="93.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="240" cy="90" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="240.0" y="94.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="240.0" y="123.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="330" cy="60" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="330.0" y="64.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">D</text>
<text x="330.0" y="93.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="80" cy="220" r="19" fill="#E69F0088" stroke="#1f2937" stroke-width="2"/>
<text x="80.0" y="224.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">E</text>
<text x="80.0" y="253.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<circle cx="200" cy="220" r="19" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="224.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">F</text>
<text x="200.0" y="253.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Fay</text>
<text x="195.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">How central are Ben and Eli?</text>
<text x="195.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Ben can reach 3 of the 5 others (distances 1, 1, 2).</text>
<text x="195.0" y="320.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Eli can reach only 1 of the 5 (distance 1).</text>
<line x1="470" y1="320" x2="900" y2="320" stroke="#1f2937" stroke-width="1.5"/>
<line x1="470" y1="320.0" x2="900" y2="320.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="462.0" y="324.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">0.0</text>
<line x1="470" y1="195.0" x2="900" y2="195.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="462.0" y="199.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">0.5</text>
<line x1="470" y1="70.0" x2="900" y2="70.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="462.0" y="74.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">1.0</text>
<rect x="485.05" y="132.5" width="34.4" height="187.5" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.3"/>
<text x="502.2" y="127.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.75</text>
<rect x="523.75" y="70.0" width="34.4" height="250.0" rx="0" fill="#CC79A777" stroke="#CC79A7" stroke-width="1.3"/>
<text x="541.0" y="65.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">1.00</text>
<text x="523.8" y="340.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">Divide by the</text>
<text x="523.8" y="356.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">people reached</text>
<rect x="592.55" y="207.5" width="34.4" height="112.5" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.3"/>
<text x="609.8" y="202.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.45</text>
<rect x="631.25" y="270.0" width="34.4" height="50.0" rx="0" fill="#CC79A777" stroke="#CC79A7" stroke-width="1.3"/>
<text x="648.5" y="265.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.20</text>
<text x="631.2" y="340.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">...and scale by the</text>
<text x="631.2" y="356.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">share reached</text>
<rect x="700.05" y="320.0" width="34.4" height="0.0" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.3"/>
<text x="717.2" y="315.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.00</text>
<rect x="738.75" y="320.0" width="34.4" height="0.0" rx="0" fill="#CC79A777" stroke="#CC79A7" stroke-width="1.3"/>
<text x="756.0" y="315.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.00</text>
<text x="738.8" y="340.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">Unreached means</text>
<text x="738.8" y="356.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">infinite: zero</text>
<rect x="807.55" y="195.0" width="34.4" height="125.0" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.3"/>
<text x="824.8" y="190.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.50</text>
<rect x="846.25" y="270.0" width="34.4" height="50.0" rx="0" fill="#CC79A777" stroke="#CC79A7" stroke-width="1.3"/>
<text x="863.5" y="265.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2937">0.20</text>
<text x="846.2" y="340.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">Add up 1 over</text>
<text x="846.2" y="356.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">each distance</text>
<rect x="510" y="36" width="14" height="12" rx="0" fill="#E69F0077" stroke="#E69F00" stroke-width="1.5"/>
<text x="530.0" y="47.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Ben</text>
<rect x="590" y="36" width="14" height="12" rx="0" fill="#CC79A777" stroke="#CC79A7" stroke-width="1.5"/>
<text x="610.0" y="47.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Eli</text>
<text x="460.0" y="424.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1f2937">First convention: Eli (1.00) looks more central than Ben (0.75). The other three: Ben is ahead.</text>
<text x="460.0" y="448.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Nothing is buggy. Each tool made an honest choice about people it cannot reach.</text>
</svg>
