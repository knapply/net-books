<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A leaf is its parent, one step farther</title>
<desc>Two rows of level counts, for Ivo and for Jo, with arrows showing Jo&#x27;s row is Ivo&#x27;s shifted right by one.</desc>
<defs><marker id="arrow-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">People at each distance: Ivo, and Jo who hangs off Ivo</text>
<text x="248.0" y="70.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">distance 1</text>
<text x="324.0" y="70.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">distance 2</text>
<text x="400.0" y="70.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">distance 3</text>
<text x="476.0" y="70.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">distance 4</text>
<text x="196.0" y="120.0" font-size="13" text-anchor="end" font-weight="700" fill="#1f2937">Ivo (parent)</text>
<rect x="210" y="86" width="68" height="52" rx="6" fill="#0072B222" stroke="#0072B2" stroke-width="1.5"/>
<text x="244.0" y="119.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">2</text>
<rect x="286" y="86" width="68" height="52" rx="6" fill="#0072B222" stroke="#0072B2" stroke-width="1.5"/>
<text x="320.0" y="119.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">2</text>
<rect x="362" y="86" width="68" height="52" rx="6" fill="#0072B222" stroke="#0072B2" stroke-width="1.5"/>
<text x="396.0" y="119.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">5</text>
<rect x="438" y="86" width="68" height="52" rx="6" fill="#0072B222" stroke="#0072B2" stroke-width="1.5"/>
<text x="472.0" y="119.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">0</text>
<text x="196.0" y="230.0" font-size="13" text-anchor="end" font-weight="700" fill="#1f2937">Jo (leaf)</text>
<rect x="210" y="196" width="68" height="52" rx="6" fill="#E69F0022" stroke="#E69F00" stroke-width="1.5"/>
<text x="244.0" y="229.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">1</text>
<rect x="286" y="196" width="68" height="52" rx="6" fill="#E69F0022" stroke="#E69F00" stroke-width="1.5"/>
<text x="320.0" y="229.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">1</text>
<rect x="362" y="196" width="68" height="52" rx="6" fill="#E69F0022" stroke="#E69F00" stroke-width="1.5"/>
<text x="396.0" y="229.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">2</text>
<rect x="438" y="196" width="68" height="52" rx="6" fill="#E69F0022" stroke="#E69F00" stroke-width="1.5"/>
<text x="472.0" y="229.0" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">5</text>
<line x1="244.8" y1="142.5" x2="316.7" y2="189.8" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-6b7280)"/>
<line x1="320.8" y1="142.5" x2="392.7" y2="189.8" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-6b7280)"/>
<line x1="396.8" y1="142.5" x2="468.7" y2="189.8" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-6b7280)"/>
<text x="560.0" y="110.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Jo&#x27;s row from Ivo&#x27;s:</text>
<text x="560.0" y="130.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">distance 1: 1 (Ivo himself)</text>
<text x="560.0" y="150.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">distance 2: 2 - 1 = 1</text>
<text x="560.0" y="170.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">  (Ivo&#x27;s friends, minus Jo)</text>
<text x="560.0" y="190.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">distance d + 1: Ivo&#x27;s distance d</text>
<text x="380.0" y="300.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Sum of distances, Ivo: 21.  Jo: 29, with no search from Jo at all.</text>
<text x="380.0" y="330.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Every leaf is folded away the same way, and its parent counts it at one level deeper.</text>
</svg>
