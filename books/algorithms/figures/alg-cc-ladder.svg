<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Chung-Lu, 50,000 people, step by step</title>
<desc>Horizontal bars of seconds on a log scale for five versions of the computation on one graph.</desc>
<defs></defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="380.0" y="28.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Seconds for every person&#x27;s exact closeness: Chung-Lu, n = 50,000, m = 192,000</text>
<line x1="289.8" y1="48" x2="289.8" y2="282" stroke="#d1d5db"/>
<text x="289.8" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">0.5 s</text>
<line x1="342.2" y1="48" x2="342.2" y2="282" stroke="#d1d5db"/>
<text x="342.2" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 s</text>
<line x1="394.5" y1="48" x2="394.5" y2="282" stroke="#d1d5db"/>
<text x="394.5" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">2 s</text>
<line x1="463.7" y1="48" x2="463.7" y2="282" stroke="#d1d5db"/>
<text x="463.7" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">5 s</text>
<line x1="516.1" y1="48" x2="516.1" y2="282" stroke="#d1d5db"/>
<text x="516.1" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10 s</text>
<line x1="568.4" y1="48" x2="568.4" y2="282" stroke="#d1d5db"/>
<text x="568.4" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">20 s</text>
<line x1="637.6" y1="48" x2="637.6" y2="282" stroke="#d1d5db"/>
<text x="637.6" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">50 s</text>
<line x1="690.0" y1="48" x2="690.0" y2="282" stroke="#d1d5db"/>
<text x="690.0" y="298.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">100 s</text>
<text x="278.0" y="76.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">A: one search per person</text>
<rect x="290" y="56" width="349.58562871509844" height="28" rx="0" fill="#9ca3af" stroke="#9ca3af" stroke-width="0"/>
<text x="645.6" y="75.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">51.3 s</text>
<text x="278.0" y="122.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">B: same, on the shrunk graph</text>
<rect x="290" y="102" width="324.49527281278574" height="28" rx="0" fill="#56B4E9" stroke="#56B4E9" stroke-width="0"/>
<text x="620.5" y="121.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">36.8 s</text>
<text x="278.0" y="168.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">C, counting each bit one by one</text>
<rect x="290" y="148" width="152.00543786569028" height="28" rx="0" fill="#CC79A7" stroke="#CC79A7" stroke-width="0"/>
<text x="448.0" y="167.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">3.75 s</text>
<text x="278.0" y="214.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">C: 512 per pass, bit-plane counters</text>
<rect x="290" y="194" width="99.04572942920282" height="28" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="395.0" y="213.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">1.86 s</text>
<text x="278.0" y="260.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">D: shrunk graph + shared pass</text>
<rect x="290" y="240" width="41.65552219454236" height="28" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0"/>
<text x="337.7" y="259.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">0.87 s</text>
<text x="380.0" y="320.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">Lab: 512 lanes, 2 threads, 2-core AVX-512 workspace. The 3.75 s bar is C before the bit-plane counters.</text>
</svg>
