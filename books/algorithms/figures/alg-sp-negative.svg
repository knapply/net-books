<text x="300.0" y="372.0" font-size="14" text-anchor="middle" font-weight="700" fill="#E69F00">Settling rule (Dijkstra): s 0, a 2, b 5, c 5, d 6</text>
<text x="300.0" y="400.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0072B2">Correct answer (Bellman-Ford): s 0, a 1, b 5, c 4, d 5</text>
<text x="740.0" y="372.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">a is settled at 2, but</text>
<text x="740.0" y="392.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">s, b, a costs 1.</text>
