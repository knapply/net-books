<rect width="900" height="430" fill="#ffffff"/>
<line x1="130.9" y1="190.5" x2="306.3" y2="110.8" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-9ca3af)"/>
<rect x="204.0" y="139.0" width="32" height="22" rx="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="220.0" y="155.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">2</text>
