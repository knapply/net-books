<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A negative tie breaks the settling rule</title>
<desc>A five-person directed network with one negative tie, and the distances two rules give for it.</desc>
