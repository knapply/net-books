<rect x="429.0" y="239.0" width="32" height="22" rx="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="445.0" y="255.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">6</text>
<line x1="583.0" y1="200.0" x2="754.0" y2="200.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-9ca3af)"/>
<rect x="654.0" y="189.0" width="32" height="22" rx="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="670.0" y="205.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1</text>
<circle cx="110" cy="200" r="22" fill="#E69F0088" stroke="#1f2937" stroke-width="2"/>
<text x="110.0" y="205.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">s</text>
<circle cx="330" cy="100" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="330.0" y="105.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">a</text>
<circle cx="330" cy="300" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="330.0" y="305.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">b</text>
<circle cx="560" cy="200" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="560.0" y="205.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">c</text>
<circle cx="780" cy="200" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
