<text x="220.0" y="255.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">5</text>
<line x1="330.0" y1="277.0" x2="330.0" y2="126.0" stroke="#D55E00" stroke-width="3" marker-end="url(#arrow-D55E00)"/>
<rect x="314.0" y="189.0" width="32" height="22" rx="11" fill="#ffffff" stroke="#D55E00" stroke-width="1.4"/>
<text x="330.0" y="205.0" font-size="13" text-anchor="middle" font-weight="700" fill="#D55E00">-4</text>
<line x1="351.1" y1="109.2" x2="536.2" y2="189.6" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-9ca3af)"/>
<rect x="429.0" y="139.0" width="32" height="22" rx="11" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="445.0" y="155.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">3</text>
