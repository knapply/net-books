<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Counting shortest routes with one search</title>
<desc>A three by four grid of people. Each dot shows how many shortest routes lead to it from the top left.</desc>
<defs></defs>
<rect width="780" height="380" fill="#ffffff"/>
<line x1="113.0" y1="80.0" x2="177.0" y2="80.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="90.0" y1="103.0" x2="90.0" y2="147.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="223.0" y1="80.0" x2="287.0" y2="80.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="200.0" y1="103.0" x2="200.0" y2="147.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="333.0" y1="80.0" x2="397.0" y2="80.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="310.0" y1="103.0" x2="310.0" y2="147.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="420.0" y1="103.0" x2="420.0" y2="147.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="113.0" y1="170.0" x2="177.0" y2="170.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="90.0" y1="193.0" x2="90.0" y2="237.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="223.0" y1="170.0" x2="287.0" y2="170.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="200.0" y1="193.0" x2="200.0" y2="237.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="333.0" y1="170.0" x2="397.0" y2="170.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="310.0" y1="193.0" x2="310.0" y2="237.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="420.0" y1="193.0" x2="420.0" y2="237.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="113.0" y1="260.0" x2="177.0" y2="260.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="223.0" y1="260.0" x2="287.0" y2="260.0" stroke="#9ca3af" stroke-width="2"/>
<line x1="333.0" y1="260.0" x2="397.0" y2="260.0" stroke="#9ca3af" stroke-width="2"/>
<circle cx="90" cy="80" r="22" fill="#eef6fb" stroke="#E69F00" stroke-width="2"/>
<text x="90.0" y="85.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="200" cy="80" r="22" fill="#d9ecf7" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="85.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="310" cy="80" r="22" fill="#bfe0f3" stroke="#0072B2" stroke-width="2"/>
<text x="310.0" y="85.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="420" cy="80" r="22" fill="#9fd0ec" stroke="#0072B2" stroke-width="2"/>
<text x="420.0" y="85.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="90" cy="170" r="22" fill="#d9ecf7" stroke="#0072B2" stroke-width="2"/>
<text x="90.0" y="175.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="200" cy="170" r="22" fill="#bfe0f3" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="175.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<circle cx="310" cy="170" r="22" fill="#9fd0ec" stroke="#0072B2" stroke-width="2"/>
<text x="310.0" y="175.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<circle cx="420" cy="170" r="22" fill="#7fc0e6" stroke="#0072B2" stroke-width="2"/>
<text x="420.0" y="175.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<circle cx="90" cy="260" r="22" fill="#bfe0f3" stroke="#0072B2" stroke-width="2"/>
<text x="90.0" y="265.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<circle cx="200" cy="260" r="22" fill="#9fd0ec" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="265.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<circle cx="310" cy="260" r="22" fill="#7fc0e6" stroke="#0072B2" stroke-width="2"/>
<text x="310.0" y="265.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">6</text>
<circle cx="420" cy="260" r="22" fill="#f6c28a" stroke="#0072B2" stroke-width="2"/>
<text x="420.0" y="265.4" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">10</text>
<text x="90.0" y="52.0" font-size="12" text-anchor="middle" font-weight="700" fill="#E69F00">start</text>
<text x="570.0" y="80.0" font-size="13" text-anchor="start" font-weight="400" fill="#E69F00">0 steps:  1</text>
<text x="570.0" y="114.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step:  1, 1</text>
<text x="570.0" y="148.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2 steps:  1, 2, 1</text>
<text x="570.0" y="182.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">3 steps:  1, 3, 3</text>
<text x="570.0" y="216.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">4 steps:  4, 6</text>
<text x="570.0" y="250.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">5 steps:  10</text>
<text x="560.0" y="56.0" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Routes counted, level by level</text>
<text x="560.0" y="290.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">Each number is the sum of its</text>
<text x="560.0" y="310.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">neighbors&#x27; numbers one step</text>
<text x="560.0" y="330.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">closer to the start.</text>
<text x="560.0" y="346.0" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Bottom right: 10 shortest routes.</text>
</svg>
