<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Which shortest-path method when</title>
<desc>A table comparing Dijkstra, Bellman-Ford, A star and bidirectional search.</desc>
<defs></defs>
<rect width="960" height="420" fill="#ffffff"/>
<rect x="20" y="40" width="940" height="44" rx="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="69.9" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2937">Method</text>
<text x="178.0" y="69.9" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2937">Ties may cost</text>
<text x="368.0" y="69.9" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2937">Negative ok?</text>
<text x="488.0" y="69.9" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2937">Answers</text>
<text x="718.0" y="69.9" font-size="13.5" text-anchor="start" font-weight="700" fill="#1f2937">Wins when</text>
<rect x="20" y="84" width="940" height="44" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="113.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">Breadth-first</text>
<text x="178.0" y="113.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">all ties equal</text>
<text x="368.0" y="113.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">no</text>
<text x="488.0" y="113.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">distances from one start</text>
<text x="718.0" y="113.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">the plain case</text>
<rect x="20" y="128" width="940" height="44" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="157.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">Dijkstra</text>
<text x="178.0" y="157.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">costs zero or more</text>
<text x="368.0" y="157.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">no</text>
<text x="488.0" y="157.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">distances from one start</text>
<text x="718.0" y="157.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">different costs, no negatives</text>
<rect x="20" y="172" width="940" height="44" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="201.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">Bellman-Ford</text>
<text x="178.0" y="201.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">any costs</text>
<text x="368.0" y="201.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">yes</text>
<text x="488.0" y="201.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">distances from one start</text>
<text x="718.0" y="201.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">negative costs, or checking for traps</text>
<rect x="20" y="216" width="940" height="44" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="245.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">A*</text>
<text x="178.0" y="245.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">costs plus a guess</text>
<text x="368.0" y="245.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">no</text>
<text x="488.0" y="245.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">one route, start to goal</text>
<text x="718.0" y="245.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">you can guess distance to go</text>
<rect x="20" y="260" width="940" height="44" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="28.0" y="289.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">Bidirectional</text>
<text x="178.0" y="289.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">costs zero or more</text>
<text x="368.0" y="289.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">no</text>
<text x="488.0" y="289.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">one route, start to goal</text>
<text x="718.0" y="289.9" font-size="13.5" text-anchor="start" font-weight="400" fill="#1f2937">you know both ends, network is big</text>
<text x="480.0" y="32.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1f2937">Pick by what the ties cost and what you need to know</text>
<text x="480.0" y="330.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Rule of thumb: start with breadth-first (equal ties) or Dijkstra (costs). Reach for the others only for the reason in the last column.</text>
<text x="480.0" y="356.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Dijkstra&#x27;s cost is about (n + m) times a small logarithm; Bellman-Ford&#x27;s is about n times m in the worst case.</text>
</svg>
