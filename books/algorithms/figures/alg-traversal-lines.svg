<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Two ways of waiting: a queue and a stack</title>
<desc>On the left a line of people at a cafe, served from the front; on the right a stack of plates, taken from the top.</desc>
<defs><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="225.0" y="34.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">A queue: first in, first out</text>
<text x="675.0" y="34.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">A stack: last in, first out</text>
<circle cx="90" cy="150" r="22" fill="#E69F0066" stroke="#0072B2" stroke-width="2"/>
<text x="90.0" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="154" cy="150" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="154.0" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="218" cy="150" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="218.0" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="282" cy="150" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="282.0" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="346" cy="150" r="22" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="346.0" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<text x="90.0" y="112.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">front</text>
<text x="346.0" y="112.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">back</text>
<line x1="69.0" y1="235.0" x2="44.0" y2="235.0" stroke="#D55E00" stroke-width="3" marker-end="url(#arrow-D55E00)"/>
<text x="56.0" y="258.0" font-size="12" text-anchor="middle" font-weight="400" fill="#D55E00">served here</text>
<line x1="395.0" y1="235.0" x2="370.0" y2="235.0" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-0072B2)"/>
<text x="400.0" y="258.0" font-size="12" text-anchor="start" font-weight="400" fill="#0072B2">new people join here</text>
<text x="225.0" y="304.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">The person who has waited longest goes next.</text>
<rect x="595" y="250" width="160" height="32" rx="5" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="675.0" y="271.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<rect x="595" y="212" width="160" height="32" rx="5" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="675.0" y="233.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<rect x="595" y="174" width="160" height="32" rx="5" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="675.0" y="195.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Cleo</text>
<rect x="595" y="136" width="160" height="32" rx="5" fill="#E69F0066" stroke="#0072B2" stroke-width="1.8"/>
<text x="675.0" y="157.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<line x1="675.0" y1="63.0" x2="675.0" y2="92.0" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-0072B2)"/>
<text x="775.0" y="82.0" font-size="12" text-anchor="start" font-weight="400" fill="#0072B2">new plate goes on top</text>
<line x1="812.0" y1="124.0" x2="812.0" y2="99.0" stroke="#D55E00" stroke-width="3" marker-end="url(#arrow-D55E00)"/>
<text x="775.0" y="140.0" font-size="12" text-anchor="start" font-weight="400" fill="#D55E00">taken from the top</text>
<text x="675.0" y="304.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">The person who arrived last goes next.</text>
</svg>
