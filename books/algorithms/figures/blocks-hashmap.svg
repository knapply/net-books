<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A hash map</title>
<desc>Names to buckets by a scrambling rule.</desc>
<defs></defs>
<rect width="900" height="420" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Hash map: a scrambling rule sends each name to a bucket, so we do not search</text>
<text x="40.0" y="64.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">The rule here: add up each letter&#x27;s place in the alphabet (a = 1, b = 2, ...), keep the remainder after dividing by 7.</text>
<rect x="40" y="90" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="110.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<text x="142.0" y="110.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">16 mod 7 = 2</text>
<line x1="250" y1="105" x2="400" y2="193" stroke="#6b7280" stroke-width="1.6"/>
<rect x="40" y="134" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="154.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<text x="142.0" y="154.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">21 mod 7 = 0</text>
<line x1="250" y1="149" x2="400" y2="105" stroke="#E69F00" stroke-width="1.6"/>
<rect x="40" y="178" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="198.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Cleo</text>
<text x="142.0" y="198.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">35 mod 7 = 0</text>
<line x1="250" y1="193" x2="400" y2="105" stroke="#E69F00" stroke-width="1.6"/>
<rect x="40" y="222" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="242.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<text x="142.0" y="242.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">31 mod 7 = 3</text>
<line x1="250" y1="237" x2="400" y2="237" stroke="#6b7280" stroke-width="1.6"/>
<rect x="40" y="266" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="286.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<text x="142.0" y="286.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">26 mod 7 = 5</text>
<line x1="250" y1="281" x2="400" y2="325" stroke="#E69F00" stroke-width="1.6"/>
<rect x="40" y="310" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="330.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Fay</text>
<text x="142.0" y="330.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">32 mod 7 = 4</text>
<line x1="250" y1="325" x2="400" y2="281" stroke="#6b7280" stroke-width="1.6"/>
<rect x="40" y="354" width="90" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="85.0" y="374.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Gus</text>
<text x="142.0" y="374.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">47 mod 7 = 5</text>
<line x1="250" y1="369" x2="400" y2="325" stroke="#E69F00" stroke-width="1.6"/>
<rect x="400" y="90" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="110.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 0</text>
<rect x="490" y="90" width="70" height="30" rx="4" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="525.0" y="110.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<rect x="568" y="90" width="70" height="30" rx="4" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="603.0" y="110.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Cleo</text>
<rect x="400" y="134" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="154.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 1</text>
<rect x="400" y="178" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="198.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 2</text>
<rect x="490" y="178" width="70" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="525.0" y="198.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<rect x="400" y="222" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="242.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 3</text>
<rect x="490" y="222" width="70" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="525.0" y="242.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<rect x="400" y="266" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="286.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 4</text>
<rect x="490" y="266" width="70" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="525.0" y="286.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Fay</text>
<rect x="400" y="310" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="330.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 5</text>
<rect x="490" y="310" width="70" height="30" rx="4" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="525.0" y="330.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<rect x="568" y="310" width="70" height="30" rx="4" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.6"/>
<text x="603.0" y="330.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Gus</text>
<rect x="400" y="354" width="70" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.6"/>
<text x="435.0" y="374.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">bucket 6</text>
<text x="680.0" y="150.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Look up Dev: do the sum (31),</text>
<text x="680.0" y="170.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">go to bucket 3, read what is there.</text>
<text x="680.0" y="214.0" font-size="13" text-anchor="start" font-weight="700" fill="#E69F00">Ben and Cleo share bucket 0: a</text>
<text x="680.0" y="234.0" font-size="13" text-anchor="start" font-weight="700" fill="#E69F00">collision. We check just those two.</text>
<text x="680.0" y="278.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">A good rule spreads names evenly,</text>
<text x="680.0" y="298.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">so buckets stay short.</text>
</svg>
