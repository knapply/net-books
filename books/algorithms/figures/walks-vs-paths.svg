<text x="220.0" y="275.9" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">2</text>
<text x="220.0" y="328.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">3</text>
<rect x="251.0" y="281.90386707136173" width="42.0" height="28.09613292863827" rx="0" fill="#E69F0066" stroke="#E69F00" stroke-width="1.2"/>
