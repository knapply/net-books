<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Walks multiply, routes do not</title>
<desc>Number of walks of each length from Ana to Eli in a five-person network, on a log scale, with the number of routes that never repeat a person.</desc>
