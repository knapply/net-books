<line x1="90" y1="253.8" x2="610" y2="253.8" stroke="#0072B2" stroke-width="2.4" stroke-dasharray="7 4"/>
<text x="622.0" y="258.8" font-size="12.5" text-anchor="start" font-weight="700" fill="#0072B2">4 routes that never repeat anyone</text>
<text x="622.0" y="70.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#E69F00">Walks may double back</text>
<text x="622.0" y="90.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">and revisit people, so their</text>
<text x="622.0" y="108.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">number keeps growing.</text>
