<rect x="355.0" y="188.57053373802842" width="42.0" height="121.42946626197158" rx="0" fill="#E69F0066" stroke="#E69F00" stroke-width="1.2"/>
<text x="376.0" y="182.6" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">20</text>
