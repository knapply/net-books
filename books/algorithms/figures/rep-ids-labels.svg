<text x="775.0" y="264.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">id</text>
<text x="450.0" y="292.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">To print results, go back the other way: position 3 means badge 3180, Dev.</text>
</svg>
