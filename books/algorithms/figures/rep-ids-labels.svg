<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Badge numbers become positions</title>
<desc>A lookup table from messy ids to 0 to 4.</desc>
<defs><marker id="arrow-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="30.0" y="34.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Real data has messy ids. We swap them for 0, 1, 2... once, at the door.</text>
<text x="120.0" y="80.0" font-size="13" text-anchor="middle" font-weight="600" fill="#6b7280">In the file</text>
<text x="450.0" y="80.0" font-size="13" text-anchor="middle" font-weight="600" fill="#6b7280">Lookup table (a hash map)</text>
<text x="780.0" y="80.0" font-size="13" text-anchor="middle" font-weight="600" fill="#6b7280">In the engine</text>
<rect x="40" y="100" width="160" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="120.0" y="120.0" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">badge 4017 (Ana)</text>
<rect x="360" y="100" width="180" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.4"/>
<text x="450.0" y="120.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">4017  -&gt;  0</text>
<line x1="205.0" y1="115.0" x2="352.0" y2="115.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<line x1="545.0" y1="115.0" x2="716.0" y2="115.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<circle cx="745" cy="115" r="13" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="745.0" y="119.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="775.0" y="120.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">id</text>
<rect x="40" y="136" width="160" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<text x="120.0" y="156.0" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">badge 52 (Ben)</text>
<rect x="360" y="136" width="180" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.4"/>
<text x="450.0" y="156.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">52  -&gt;  1</text>
