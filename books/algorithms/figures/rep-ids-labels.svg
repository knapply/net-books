<text x="120.0" y="264.0" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">badge 77 (Eli)</text>
<rect x="360" y="244" width="180" height="30" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.4"/>
