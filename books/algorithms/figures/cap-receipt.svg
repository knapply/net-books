<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>An honest answer when you stop early</title>
<desc>Two cards: what a capped route listing should report, and what it should not.</desc>
<defs></defs>
<rect width="860" height="380" fill="#ffffff"/>
<rect x="30" y="30" width="380" height="300" rx="10" fill="#009E7310" stroke="#009E73" stroke-width="2"/>
<text x="220.0" y="62.0" font-size="16" text-anchor="middle" font-weight="700" fill="#009E73">Honest receipt</text>
<text x="54.0" y="100.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Question:  every route, corner to corner,</text>
<text x="54.0" y="121.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>           6 by 6 grid of people</text>
<text x="54.0" y="142.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Limit I set:  10,000 routes</text>
<text x="54.0" y="163.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Routes listed:  10,000</text>
<text x="54.0" y="184.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Stopped by the limit?  YES</text>
<text x="54.0" y="205.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'></text>
<text x="54.0" y="226.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>So the true number is</text>
<text x="54.0" y="247.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>AT LEAST 10,000.</text>
<text x="54.0" y="268.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Everything listed is a real route.</text>
<rect x="450" y="30" width="380" height="300" rx="10" fill="#D55E0010" stroke="#D55E00" stroke-width="2" stroke-dasharray="8 5"/>
<text x="640.0" y="62.0" font-size="16" text-anchor="middle" font-weight="700" fill="#D55E00">Dishonest receipt</text>
<text x="474.0" y="100.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Question:  every route, corner to corner,</text>
<text x="474.0" y="121.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>           6 by 6 grid of people</text>
<text x="474.0" y="142.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Routes found:  10,000</text>
<text x="474.0" y="163.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'></text>
<text x="474.0" y="184.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>(Silent about the limit.)</text>
<text x="474.0" y="205.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'></text>
<text x="474.0" y="226.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>Reader assumes the answer is</text>
<text x="474.0" y="247.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>exactly 10,000.</text>
<text x="474.0" y="268.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>It is 1,262,816.</text>
<text x="430.0" y="362.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">The limit saved time, but only the first receipt says so.</text>
</svg>
