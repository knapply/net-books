<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Two equally short routes share the credit</title>
<desc>Ana and Eli joined by two routes of two steps, one through Ben and one through Dev; each middle person gets half.</desc>
<defs></defs>
<rect width="720" height="300" fill="#ffffff"/>
<line x1="163.5" y1="141.5" x2="336.5" y2="78.5" stroke="#E69F00" stroke-width="3"/>
<line x1="163.5" y1="158.5" x2="336.5" y2="221.5" stroke="#E69F00" stroke-width="3"/>
<line x1="383.5" y1="78.5" x2="556.5" y2="141.5" stroke="#E69F00" stroke-width="3"/>
<line x1="383.5" y1="221.5" x2="556.5" y2="158.5" stroke="#E69F00" stroke-width="3"/>
<line x1="360.0" y1="95.0" x2="360.0" y2="205.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="140" cy="150" r="24" fill="#fff4dc" stroke="#E69F00" stroke-width="2"/>
<text x="140.0" y="154.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<circle cx="360" cy="70" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="360.0" y="74.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<circle cx="360" cy="230" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="360.0" y="234.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<circle cx="580" cy="150" r="24" fill="#fff4dc" stroke="#E69F00" stroke-width="2"/>
<text x="580.0" y="154.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<text x="360.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Ana to Eli: two shortest routes, each two steps</text>
<text x="440.0" y="110.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">1 of 2 routes: +1/2</text>
<text x="440.0" y="200.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">1 of 2 routes: +1/2</text>
<text x="360.0" y="285.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">The dashed Ben to Dev tie is not on any shortest route from Ana to Eli.</text>
</svg>
