<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Queue and stack</title>
<desc>A cafe line and a stack of plates.</desc>
<defs><marker id="arrow-009E73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="arrow-E69F00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Queue: first in, first out.   Stack: last in, first out.</text>
<text x="60.0" y="70.0" font-size="14" text-anchor="start" font-weight="700" fill="#0072B2">Queue (the cafe line)</text>
<circle cx="90" cy="130" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="90.0" y="134.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="90.0" y="172.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="170" cy="130" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="170.0" y="134.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="170.0" y="172.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="250" cy="130" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="250.0" y="134.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">2</text>
<text x="250.0" y="172.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="330" cy="130" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="330.0" y="134.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="330.0" y="172.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="410" cy="130" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="410.0" y="134.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<text x="410.0" y="172.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<text x="60.0" y="130.0" font-size="1" text-anchor="middle" font-weight="400" fill="#1f2937"></text>
<line x1="69.0" y1="130.0" x2="28.0" y2="130.0" stroke="#009E73" stroke-width="2.6" marker-end="url(#arrow-009E73)"/>
<text x="40.0" y="200.0" font-size="12" text-anchor="start" font-weight="700" fill="#009E73">OUT: Ana, the longest waiter</text>
<line x1="519.0" y1="130.0" x2="444.0" y2="130.0" stroke="#E69F00" stroke-width="2.6" marker-end="url(#arrow-E69F00)"/>
<text x="380.0" y="200.0" font-size="12" text-anchor="start" font-weight="700" fill="#E69F00">IN: Eli joined last</text>
<text x="60.0" y="250.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Used for: breadth-first search (visit people in the order they were found).</text>
<text x="620.0" y="70.0" font-size="14" text-anchor="start" font-weight="700" fill="#CC79A7">Stack (plates)</text>
<rect x="650" y="240" width="120" height="22" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="710.0" y="256.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">0  Ana</text>
<rect x="650" y="212" width="120" height="22" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="710.0" y="228.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">1  Ben</text>
<rect x="650" y="184" width="120" height="22" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="710.0" y="200.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">2  Cleo</text>
<rect x="650" y="156" width="120" height="22" rx="6" fill="#eef6fb" stroke="#0072B2" stroke-width="1.8"/>
<text x="710.0" y="172.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">3  Dev</text>
<rect x="650" y="128" width="120" height="22" rx="6" fill="#f6e3ee" stroke="#CC79A7" stroke-width="1.8"/>
<text x="710.0" y="144.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">4  Eli</text>
<line x1="799.2" y1="80.6" x2="777.2" y2="97.6" stroke="#E69F00" stroke-width="2.6" marker-end="url(#arrow-E69F00)"/>
<text x="800.0" y="70.0" font-size="12" text-anchor="middle" font-weight="700" fill="#CC79A7">IN and OUT</text>
<text x="620.0" y="275.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Eli is on top, so Eli comes off first.</text>
<text x="620.0" y="295.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Used for: depth-first search, undo.</text>
</svg>
