<text x="225.0" y="194.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">No change in the last round: done.</text>
<text x="675.0" y="280.0" font-size="13" text-anchor="middle" font-weight="400" fill="#D55E00">b keeps getting cheaper (a to c to b to a is a loop worth -1).</text>
<text x="450.0" y="385.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">&#x27;-&#x27; means no route found yet. With n people, a network with no negative loop settles within n - 1 rounds.</text>
<text x="450.0" y="405.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">If round n still improves something, there is a negative loop.</text>
