<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Why Dijkstra&#x27;s algorithm works</title>
<desc>Three nested regions: settled people, the waiting frontier and the rest of the network.</desc>
<defs></defs>
<rect width="900" height="420" fill="#ffffff"/>
<circle cx="300" cy="215" r="185" fill="#d1d5db55" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="300" cy="215" r="130" fill="#56B4E933" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="300" cy="215" r="82" fill="#0072B233" stroke="#0072B2" stroke-width="2"/>
<circle cx="310.15950765196425" cy="283.9174822657911" r="9" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<circle cx="337.6518335506479" cy="253.2868692650154" r="9" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<circle cx="321.7973261944897" cy="227.92517457422696" r="9" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<circle cx="322.9823086490757" cy="214.87415796384457" r="9" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<circle cx="275.83029467759184" cy="185.07541037465091" r="9" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<circle cx="261.0625730709131" cy="226.8095540251434" r="9" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<circle cx="341.511637494588" cy="324.2979890498135" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="383.75449031117074" cy="267.8321188460486" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="399.21515461825277" cy="227.52828277294748" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="200.4199146473646" cy="280.2652245939861" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="230.82829795135143" cy="280.71690502238476" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="293.6103434948424" cy="336.58028336892363" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="402.0284753165515" cy="257.7043890646121" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="219.83963056875012" cy="292.9693004179353" r="9" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<circle cx="212.69358835388826" cy="355.6031192261996" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="135.92843380033645" cy="217.49439940802938" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="431.6930710162827" cy="121.04685476990807" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="390.40865574331394" cy="327.32388819258665" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="449.58918707136536" cy="162.25827688425792" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="360.17486783039925" cy="378.4399251256083" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="153.3250327247095" cy="135.60629845798283" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="300" cy="215" r="14" fill="#E69F00" stroke="#1f2937" stroke-width="2"/>
<text x="300.0" y="219.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">0</text>
<text x="300.0" y="36.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">the whole network</text>
<circle cx="540" cy="90" r="10" fill="#0072B299" stroke="#0072B2" stroke-width="2"/>
<text x="562.0" y="95.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Settled</text>
<text x="562.0" y="118.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Their minutes are final. Every one of them is</text>
<text x="562.0" y="136.8" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">closer to the start than anyone outside the</text>
<text x="562.0" y="155.7" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">blue ring.</text>
<circle cx="540" cy="202" r="10" fill="#E69F0099" stroke="#E69F00" stroke-width="2"/>
<text x="562.0" y="207.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Waiting</text>
<text x="562.0" y="230.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">They have a best guess so far, from some</text>
<text x="562.0" y="248.8" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">settled neighbour. The smallest guess is next</text>
<text x="562.0" y="267.7" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">to be settled.</text>
<circle cx="540" cy="314" r="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="562.0" y="319.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Not met yet</text>
<text x="562.0" y="342.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">No route found so far. Any route to them must</text>
<text x="562.0" y="360.9" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">cross the waiting ring first.</text>
</svg>
