<text x="30.0" y="360.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">fast = one or a few steps; so-so = look through one person&#x27;s list or one row; slow = look at everything.</text>
<text x="30.0" y="380.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">CSR with sorted friend lists can check a tie by binary search; the bit row wins when you compare two people.</text>
