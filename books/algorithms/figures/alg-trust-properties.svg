<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Things that must always be true</title>
<desc>Six cards, each a property a correct graph routine must satisfy for any network.</desc>
<defs></defs>
<rect width="920" height="440" fill="#ffffff"/>
<rect x="20" y="20" width="280" height="190" rx="12" fill="#0072B214" stroke="#0072B2" stroke-width="2"/>
<text x="34.0" y="50.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#1f2937">Relabeling changes nothing</text>
<text x="34.0" y="82.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Rename everybody and every distance</text>
<text x="34.0" y="100.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">is the same, just filed under the new</text>
<text x="34.0" y="118.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">names.</text>
<text x="34.0" y="158.0" font-size="12" text-anchor="start" font-weight="700" fill="#0072B2">checked on the friendship network: 100</text>
<text x="34.0" y="175.4" font-size="12" text-anchor="start" font-weight="700" fill="#0072B2">distances, all match</text>
<rect x="320" y="20" width="280" height="190" rx="12" fill="#009E7314" stroke="#009E73" stroke-width="2"/>
<text x="334.0" y="50.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#1f2937">Distances are symmetric</text>
<text x="334.0" y="82.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">In an undirected network, the way</text>
<text x="334.0" y="100.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">from A to B is as long as from B to</text>
<text x="334.0" y="118.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">A.</text>
<text x="334.0" y="158.0" font-size="12" text-anchor="start" font-weight="700" fill="#009E73">checked: all 100 pairs</text>
<rect x="620" y="20" width="280" height="190" rx="12" fill="#E69F0014" stroke="#E69F00" stroke-width="2"/>
<text x="634.0" y="50.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#1f2937">No shortcuts through a third person</text>
<text x="634.0" y="82.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">The distance from A to C never</text>
<text x="634.0" y="100.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">exceeds the distance from A to B plus</text>
<text x="634.0" y="118.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">B to C.</text>
<text x="634.0" y="158.0" font-size="12" text-anchor="start" font-weight="700" fill="#E69F00">checked: all 1,000 triples</text>
<rect x="20" y="230" width="280" height="190" rx="12" fill="#CC79A714" stroke="#CC79A7" stroke-width="2"/>
<text x="34.0" y="260.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#1f2937">A new tie never hurts</text>
<text x="34.0" y="292.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Add one tie and no distance gets</text>
<text x="34.0" y="310.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">longer.</text>
<text x="34.0" y="368.0" font-size="12" text-anchor="start" font-weight="700" fill="#CC79A7">added Ana-Jo: 100 distances, none</text>
<text x="34.0" y="385.4" font-size="12" text-anchor="start" font-weight="700" fill="#CC79A7">longer; Ana to Jo fell from 4 to 1</text>
<rect x="320" y="230" width="280" height="190" rx="12" fill="#D55E0014" stroke="#D55E00" stroke-width="2"/>
<text x="334.0" y="260.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#1f2937">Degrees add up to twice the ties</text>
<text x="334.0" y="292.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Every tie has two ends, so the</text>
<text x="334.0" y="310.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">degrees sum to twice the number of</text>
<text x="334.0" y="328.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">ties.</text>
<text x="334.0" y="368.0" font-size="12" text-anchor="start" font-weight="700" fill="#D55E00">checked: degrees sum to 36, ties are 18</text>
<rect x="620" y="230" width="280" height="190" rx="12" fill="#56B4E914" stroke="#56B4E9" stroke-width="2"/>
<text x="634.0" y="260.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#1f2937">Same input, same output</text>
<text x="634.0" y="292.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Run it twice, or on four threads, and</text>
<text x="634.0" y="310.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">the answer is identical.</text>
<text x="634.0" y="368.0" font-size="12" text-anchor="start" font-weight="700" fill="#56B4E9">a property of the routine, not of the</text>
<text x="634.0" y="385.4" font-size="12" text-anchor="start" font-weight="700" fill="#56B4E9">data</text>
</svg>
