<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Layers of checking</title>
<desc>Five stacked bands, from hand-checked cases at the bottom to regression tests at the top, with what each one catches.</desc>
<defs></defs>
<rect width="920" height="420" fill="#ffffff"/>
<rect x="70" y="30" width="780" height="62" rx="10" fill="#CC79A718" stroke="#CC79A7" stroke-width="2"/>
<text x="90.0" y="58.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Regression tests</text>
<text x="90.0" y="80.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">catches: a past bug never comes back</text>
<rect x="94" y="104" width="732" height="62" rx="10" fill="#E69F0018" stroke="#E69F00" stroke-width="2"/>
<text x="114.0" y="132.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Fuzzing</text>
<text x="114.0" y="154.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">catches: crashes and odd inputs nobody thought of</text>
<rect x="118" y="178" width="684" height="62" rx="10" fill="#009E7318" stroke="#009E73" stroke-width="2"/>
<text x="138.0" y="206.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Reference tools</text>
<text x="138.0" y="228.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">catches: wrong answers on realistic networks</text>
<rect x="142" y="252" width="636" height="62" rx="10" fill="#0072B218" stroke="#0072B2" stroke-width="2"/>
<text x="162.0" y="280.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Property tests</text>
<text x="162.0" y="302.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">catches: broken rules, on many networks at once</text>
<rect x="166" y="326" width="588" height="62" rx="10" fill="#D55E0018" stroke="#D55E00" stroke-width="2"/>
<text x="186.0" y="354.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Hand-checked tiny cases</text>
<text x="186.0" y="376.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">catches: plain mistakes, and misunderstanding the question</text>
<text x="460.0" y="410.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Start at the bottom. Each layer is cheap to add and catches something the layer below cannot.</text>
</svg>
