<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Floating-point order</title>
<desc>The same four numbers added in three orders.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Same four numbers, three orders, three answers</text>
<text x="40.0" y="94.0" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">as listed</text>
<rect x="220" y="72" width="100" height="34" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.5"/>
<text x="270.0" y="94.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1e16</text>
<text x="334.0" y="94.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="348" y="72" width="100" height="34" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="398.0" y="94.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="462.0" y="94.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="476" y="72" width="100" height="34" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.5"/>
<text x="526.0" y="94.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">-1e16</text>
<text x="590.0" y="94.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="604" y="72" width="100" height="34" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="654.0" y="94.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="728.0" y="94.0" font-size="18" text-anchor="start" font-weight="400" fill="#6b7280">=</text>
<text x="756.0" y="96.0" font-size="22" text-anchor="start" font-weight="700" fill="#D55E00">1</text>
<text x="40.0" y="164.0" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">big ones cancel first</text>
<rect x="220" y="142" width="100" height="34" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.5"/>
<text x="270.0" y="164.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1e16</text>
<text x="334.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="348" y="142" width="100" height="34" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.5"/>
<text x="398.0" y="164.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">-1e16</text>
<text x="462.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="476" y="142" width="100" height="34" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="526.0" y="164.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="590.0" y="164.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="604" y="142" width="100" height="34" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="654.0" y="164.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="728.0" y="164.0" font-size="18" text-anchor="start" font-weight="400" fill="#6b7280">=</text>
<text x="756.0" y="166.0" font-size="22" text-anchor="start" font-weight="700" fill="#009E73">2</text>
<text x="40.0" y="234.0" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">big one, then both 1s</text>
<rect x="220" y="212" width="100" height="34" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.5"/>
<text x="270.0" y="234.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1e16</text>
<text x="334.0" y="234.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="348" y="212" width="100" height="34" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="398.0" y="234.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="462.0" y="234.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="476" y="212" width="100" height="34" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="526.0" y="234.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="590.0" y="234.0" font-size="16" text-anchor="middle" font-weight="400" fill="#6b7280">+</text>
<rect x="604" y="212" width="100" height="34" rx="4" fill="#eef6fb" stroke="#0072B2" stroke-width="1.5"/>
<text x="654.0" y="234.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">-1e16</text>
<text x="728.0" y="234.0" font-size="18" text-anchor="start" font-weight="400" fill="#6b7280">=</text>
<text x="756.0" y="236.0" font-size="22" text-anchor="start" font-weight="700" fill="#D55E00">0</text>
<text x="40.0" y="292.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">The true sum is 2. Adding 1 to ten quadrillion changes nothing the computer can store, so that 1 vanishes.</text>
<text x="40.0" y="314.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">Computers keep about 16 significant digits. Where the small numbers land in the order decides what survives.</text>
</svg>
