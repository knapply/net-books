<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Work grows in step with the network</title>
<desc>Number of friend-list entries a search reads against the number of people, with the cost of checking every pair for comparison.</desc>
<defs></defs>
<rect width="900" height="430" fill="#ffffff"/>
<line x1="110" y1="340" x2="800" y2="340" stroke="#1f2937" stroke-width="1.5"/><line x1="110" y1="50" x2="110" y2="340" stroke="#1f2937" stroke-width="1.5"/>
<line x1="110" y1="340.0" x2="800" y2="340.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="344.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">100</text>
<line x1="110" y1="298.6" x2="800" y2="298.6" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="302.6" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">1,000</text>
<line x1="110" y1="257.1" x2="800" y2="257.1" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="261.1" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">10,000</text>
<line x1="110" y1="215.7" x2="800" y2="215.7" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="219.7" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">100,000</text>
<line x1="110" y1="174.3" x2="800" y2="174.3" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="178.3" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">1 million</text>
<line x1="110" y1="132.9" x2="800" y2="132.9" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="136.9" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">10 million</text>
<line x1="110" y1="91.4" x2="800" y2="91.4" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="95.4" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">100 million</text>
<line x1="110" y1="50.0" x2="800" y2="50.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="100.0" y="54.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#1f2937">1 billion</text>
<text x="110.0" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">250</text>
<text x="208.6" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">500</text>
<text x="307.1" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1,000</text>
<text x="405.7" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">2,000</text>
<text x="504.3" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">4,000</text>
<text x="602.9" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">8,000</text>
<text x="701.4" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">16,000</text>
<text x="800.0" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">32,000</text>
<text x="455.0" y="386.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">people in the network (each has about 4 friends)</text>
<text x="110.0" y="36.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">steps of work</text>
<polyline points="110.0,236.7 208.6,211.7 307.1,186.8 405.7,161.8 504.3,136.9 602.9,111.9 701.4,87.0 800.0,62.0" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="7 5"/>
<polyline points="110.0,298.6 208.6,286.2 307.1,273.6 405.7,261.2 504.3,248.7 602.9,236.2 701.4,223.7 800.0,211.3" fill="none" stroke="#0072B2" stroke-width="3.2"/>
<circle cx="110.0" cy="298.6" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="208.6" cy="286.2" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="307.1" cy="273.6" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="405.7" cy="261.2" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="504.3" cy="248.7" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="602.9" cy="236.2" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="701.4" cy="223.7" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="800.0" cy="211.3" r="5" fill="#ffffff" stroke="#0072B2" stroke-width="2.4"/>
<text x="602.9" y="270.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0072B2">one search: friend-list entries read</text>
<text x="405.7" y="131.8" font-size="13" text-anchor="middle" font-weight="700" fill="#D55E00">checking every pair of people</text>
<text x="450.0" y="412.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">At 32,000 people one search reads about 127,960 entries. Checking every pair would take 511,984,000.</text>
</svg>
