<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>All pairs one by one versus Brandes</title>
<desc>Paired bars on a log scale: the rough time for the pair-by-pair method and for Brandes&#x27; method at four network sizes.</desc>
<defs></defs>
<rect width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Rough time at a billion steps a second, ten ties per person</text>
<line x1="150.0" y1="60" x2="150.0" y2="350" stroke="#d1d5db" stroke-width="1"/>
<text x="150.0" y="368.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 ms</text>
<line x1="270.0" y1="60" x2="270.0" y2="350" stroke="#d1d5db" stroke-width="1"/>
<text x="270.0" y="368.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 s</text>
<line x1="341.1" y1="60" x2="341.1" y2="350" stroke="#d1d5db" stroke-width="1"/>
<text x="341.1" y="368.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 min</text>
<line x1="412.3" y1="60" x2="412.3" y2="350" stroke="#d1d5db" stroke-width="1"/>
<text x="412.3" y="368.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 h</text>
<line x1="467.5" y1="60" x2="467.5" y2="350" stroke="#d1d5db" stroke-width="1"/>
<text x="467.5" y="368.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 day</text>
<line x1="570.0" y1="60" x2="570.0" y2="350" stroke="#d1d5db" stroke-width="1"/>
<text x="570.0" y="368.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 year</text>
<text x="138.0" y="92.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">1,000 people</text>
<rect x="150" y="70" width="120.0" height="18" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="276.0" y="84.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">1.0 seconds (pair by pair)</text>
<rect x="150" y="92" width="40.0" height="18" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="196.0" y="106.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">10 ms (Brandes)</text>
<text x="138.0" y="162.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">10,000 people</text>
<rect x="150" y="140" width="240.0" height="18" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="396.0" y="154.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">17 minutes (pair by pair)</text>
<rect x="150" y="162" width="120.0" height="18" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="276.0" y="176.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">1.0 seconds (Brandes)</text>
<text x="138.0" y="232.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">100,000 people</text>
<rect x="150" y="210" width="360.0" height="18" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="516.0" y="224.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">12 days (pair by pair)</text>
<rect x="150" y="232" width="200.0" height="18" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="356.0" y="246.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">1.7 minutes (Brandes)</text>
<text x="138.0" y="302.0" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">1,000,000 people</text>
<rect x="150" y="280" width="480.0" height="18" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="636.0" y="294.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">32 years (pair by pair)</text>
<rect x="150" y="302" width="280.0" height="18" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="436.0" y="316.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">2.8 hours (Brandes)</text>
<text x="360.0" y="392.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">Pair by pair: about n x n x n steps. Brandes: about n x m steps (m = arcs, here 10 per person).</text>
</svg>
