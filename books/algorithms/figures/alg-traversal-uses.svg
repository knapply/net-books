<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>What a traversal is the base for</title>
<desc>Six cards, each naming a question that a breadth-first or depth-first search answers.</desc>
<defs></defs>
<rect width="900" height="400" fill="#ffffff"/>
<rect x="40" y="40" width="265" height="145" rx="12" fill="#0072B214" stroke="#0072B2" stroke-width="2"/>
<text x="56.0" y="74.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">How far?</text>
<text x="56.0" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">distances and shortest routes</text>
<text x="56.0" y="158.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#0072B2">best fit: breadth-first</text>
<rect x="325" y="40" width="265" height="145" rx="12" fill="#009E7314" stroke="#009E73" stroke-width="2"/>
<text x="341.0" y="74.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">Who is connected?</text>
<text x="341.0" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">islands (components)</text>
<text x="341.0" y="158.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#009E73">best fit: either</text>
<rect x="610" y="40" width="265" height="145" rx="12" fill="#E69F0014" stroke="#E69F00" stroke-width="2"/>
<text x="626.0" y="74.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">Is there a loop?</text>
<text x="626.0" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">cycle detection</text>
<text x="626.0" y="158.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#E69F00">best fit: depth-first</text>
<rect x="40" y="210" width="265" height="145" rx="12" fill="#E69F0014" stroke="#E69F00" stroke-width="2"/>
<text x="56.0" y="244.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">What comes first?</text>
<text x="56.0" y="276.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">ordering tasks that depend on others</text>
<text x="56.0" y="328.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#E69F00">best fit: depth-first</text>
<rect x="325" y="210" width="265" height="145" rx="12" fill="#0072B214" stroke="#0072B2" stroke-width="2"/>
<text x="341.0" y="244.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">What is nearby?</text>
<text x="341.0" y="276.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">everyone within two steps</text>
<text x="341.0" y="328.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#0072B2">best fit: breadth-first</text>
<rect x="610" y="210" width="265" height="145" rx="12" fill="#E69F0014" stroke="#E69F00" stroke-width="2"/>
<text x="626.0" y="244.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">Where does it split?</text>
<text x="626.0" y="276.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">bridges and cut people</text>
<text x="626.0" y="328.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#E69F00">best fit: depth-first</text>
<text x="450.0" y="388.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Later chapters use these over and over: components, DAGs, connectivity and betweenness all start here.</text>
</svg>
