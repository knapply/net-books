<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Johnson&#x27;s trick: make every cost non-negative</title>
<desc>The same four-person network twice. Left: ties with one negative cost. Right: every cost shifted by the people&#x27;s scores so none is negative.</desc>
<defs><marker id="arrow-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="860" height="330" fill="#ffffff"/>
<text x="200.0" y="28.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Before: one negative cost</text>
<line x1="98.5" y1="150.0" x2="188.9" y2="101.4" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="145.0" y="111.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">4</text>
<line x1="98.5" y1="170.0" x2="188.9" y2="218.6" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="145.0" y="211.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">5</text>
<line x1="210.0" y1="111.0" x2="210.0" y2="206.0" stroke="#D55E00" stroke-width="2.6" marker-end="url(#arrow-D55E00)"/>
<text x="226.0" y="165.0" font-size="14" text-anchor="middle" font-weight="700" fill="#D55E00">-2</text>
<line x1="228.5" y1="220.0" x2="318.9" y2="171.4" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="275.0" y="211.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">3</text>
<line x1="228.5" y1="100.0" x2="318.9" y2="148.6" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="275.0" y="141.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">6</text>
<circle cx="80" cy="160" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="80.0" y="164.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<circle cx="210" cy="90" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="210.0" y="94.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<circle cx="210" cy="230" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="210.0" y="234.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Cleo</text>
<circle cx="340" cy="160" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="340.0" y="164.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<text x="630.0" y="28.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">After: costs shifted, none negative</text>
<line x1="528.5" y1="150.0" x2="618.9" y2="101.4" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="575.0" y="111.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">4</text>
<line x1="528.5" y1="170.0" x2="618.9" y2="218.6" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="575.0" y="211.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">7</text>
<line x1="640.0" y1="111.0" x2="640.0" y2="206.0" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="656.0" y="165.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">0</text>
<line x1="658.5" y1="220.0" x2="748.9" y2="171.4" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="705.0" y="211.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text>
<line x1="658.5" y1="100.0" x2="748.9" y2="148.6" stroke="#9ca3af" stroke-width="2.6" marker-end="url(#arrow-9ca3af)"/>
<text x="705.0" y="141.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">6</text>
<circle cx="510" cy="160" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="510.0" y="164.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<text x="510.0" y="198.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">score 0</text>
<circle cx="640" cy="90" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="640.0" y="94.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<text x="688.0" y="94.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">score 0</text>
<circle cx="640" cy="230" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="640.0" y="234.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Cleo</text>
<text x="640.0" y="268.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">score -2</text>
<circle cx="770" cy="160" r="20" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="770.0" y="164.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<text x="770.0" y="198.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">score 0</text>
<text x="430.0" y="316.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">new cost = old cost + score of where it starts − score of where it ends; every route between two people shifts by the same amount.</text>
</svg>
