<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Path compression: leave a shortcut behind</title>
<desc>Left: a chain of six people, each pointing to the one before. Right: the same people after one lookup from Fay that makes everyone on the walk point straight at the leader.</desc>
<defs><marker id="arrow-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="arrow-E69F00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="200.0" y="40.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Before: Fay is five hops from the leader</text>
<line x1="200.0" y1="110.0" x2="200.0" y2="93.0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-9ca3af)"/>
<line x1="200.0" y1="162.0" x2="200.0" y2="145.0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-9ca3af)"/>
<line x1="200.0" y1="214.0" x2="200.0" y2="197.0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-9ca3af)"/>
<line x1="200.0" y1="266.0" x2="200.0" y2="249.0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-9ca3af)"/>
<line x1="200.0" y1="318.0" x2="200.0" y2="301.0" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-9ca3af)"/>
<circle cx="200" cy="74" r="15" fill="#009E7388" stroke="#009E73" stroke-width="2"/>
<text x="200.0" y="77.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<circle cx="200" cy="126" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="129.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<circle cx="200" cy="178" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="181.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Cle</text>
<circle cx="200" cy="230" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="233.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<circle cx="200" cy="282" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="285.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<circle cx="200" cy="334" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="200.0" y="337.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Fay</text>
<text x="200.0" y="360.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Each lookup from Fay walks five hops.</text>
<text x="660.0" y="40.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">After one lookup from Fay</text>
<line x1="551.5" y1="178.9" x2="646.3" y2="87.2" stroke="#E69F00" stroke-width="2.2" marker-end="url(#arrow-E69F00)"/>
<line x1="607.4" y1="175.8" x2="651.3" y2="90.9" stroke="#E69F00" stroke-width="2.2" marker-end="url(#arrow-E69F00)"/>
<line x1="660.0" y1="174.0" x2="660.0" y2="93.0" stroke="#E69F00" stroke-width="2.2" marker-end="url(#arrow-E69F00)"/>
<line x1="712.6" y1="175.8" x2="668.7" y2="90.9" stroke="#E69F00" stroke-width="2.2" marker-end="url(#arrow-E69F00)"/>
<line x1="768.5" y1="178.9" x2="673.7" y2="87.2" stroke="#E69F00" stroke-width="2.2" marker-end="url(#arrow-E69F00)"/>
<circle cx="660" cy="74" r="15" fill="#009E7388" stroke="#009E73" stroke-width="2"/>
<text x="660.0" y="77.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
