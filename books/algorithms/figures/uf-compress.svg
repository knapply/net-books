<text x="540.0" y="193.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<circle cx="600" cy="190" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="600.0" y="193.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Cle</text>
<circle cx="660" cy="190" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="660.0" y="193.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<circle cx="720" cy="190" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="720.0" y="193.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<circle cx="780" cy="190" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="780.0" y="193.4" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Fay</text>
<text x="660.0" y="360.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Everyone on the walk now points at Ana: one hop.</text>
</svg>
