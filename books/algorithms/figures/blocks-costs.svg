<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Building blocks at a glance</title>
<desc>What each block costs.</desc>
<defs></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">At a glance: what each building block costs</text>
<text x="40.0" y="72.0" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">Block</text>
<text x="220.0" y="72.0" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">Add</text>
<text x="400.0" y="72.0" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">Take or find</text>
<text x="640.0" y="72.0" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">Good for</text>
<rect x="30" y="84" width="840" height="34" rx="4" fill="#eef6fb" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="106.0" font-size="13" text-anchor="start" font-weight="700" fill="#009E73">Queue</text>
<text x="220.0" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step</text>
<text x="400.0" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step (oldest)</text>
<text x="640.0" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">breadth-first search</text>
<rect x="30" y="124" width="840" height="34" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="146.0" font-size="13" text-anchor="start" font-weight="700" fill="#009E73">Stack</text>
<text x="220.0" y="146.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step</text>
<text x="400.0" y="146.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step (newest)</text>
<text x="640.0" y="146.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">depth-first search, undo</text>
<rect x="30" y="164" width="840" height="34" rx="4" fill="#eef6fb" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="186.0" font-size="13" text-anchor="start" font-weight="700" fill="#0072B2">Heap</text>
<text x="220.0" y="186.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">log n steps</text>
<text x="400.0" y="186.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step to peek, log n to take</text>
<text x="640.0" y="186.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">shortest paths, top few</text>
<rect x="30" y="204" width="840" height="34" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="226.0" font-size="13" text-anchor="start" font-weight="700" fill="#009E73">Union-find</text>
<text x="220.0" y="226.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step</text>
<text x="400.0" y="226.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">about 1 step (nearly)</text>
<text x="640.0" y="226.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">who is connected to whom</text>
<rect x="30" y="244" width="840" height="34" rx="4" fill="#eef6fb" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="266.0" font-size="13" text-anchor="start" font-weight="700" fill="#009E73">Hash map</text>
<text x="220.0" y="266.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">about 1 step</text>
<text x="400.0" y="266.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">about 1 step</text>
<text x="640.0" y="266.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">names to ids, counting</text>
<rect x="30" y="284" width="840" height="34" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="306.0" font-size="13" text-anchor="start" font-weight="700" fill="#009E73">Bitset</text>
<text x="220.0" y="306.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step</text>
<text x="400.0" y="306.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1 step; groups: n / 64 steps</text>
<text x="640.0" y="306.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">sets of people, common friends</text>
<rect x="30" y="324" width="840" height="34" rx="4" fill="#eef6fb" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="346.0" font-size="13" text-anchor="start" font-weight="700" fill="#0072B2">Sort (comparing)</text>
<text x="220.0" y="346.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">n log n steps</text>
<text x="400.0" y="346.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">all at once</text>
<text x="640.0" y="346.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">ordering anything</text>
<rect x="30" y="364" width="840" height="34" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="40.0" y="386.0" font-size="13" text-anchor="start" font-weight="700" fill="#0072B2">Radix sort</text>
<text x="220.0" y="386.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">k passes over n</text>
<text x="400.0" y="386.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">all at once</text>
<text x="640.0" y="386.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">integer ids, in bulk</text>
<text x="30.0" y="424.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">n is the number of items held. &#x27;About 1 step&#x27; means 1 on average, or nearly constant over a whole run.</text>
</svg>
