<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Speedups over one search per person</title>
<desc>Grouped bars on a log scale: how many times faster each method was than the baseline, on five test graphs.</desc>
<defs></defs>
<rect width="760" height="400" fill="#ffffff"/>
<text x="380.0" y="28.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Times faster than the baseline (A), log scale</text>
<line x1="230.0" y1="50" x2="230.0" y2="335" stroke="#d1d5db"/>
<text x="230.0" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1x</text>
<line x1="291.5" y1="50" x2="291.5" y2="335" stroke="#d1d5db"/>
<text x="291.5" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">2x</text>
<line x1="372.8" y1="50" x2="372.8" y2="335" stroke="#d1d5db"/>
<text x="372.8" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">5x</text>
<line x1="434.3" y1="50" x2="434.3" y2="335" stroke="#d1d5db"/>
<text x="434.3" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10x</text>
<line x1="495.7" y1="50" x2="495.7" y2="335" stroke="#d1d5db"/>
<text x="495.7" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">20x</text>
<line x1="577.0" y1="50" x2="577.0" y2="335" stroke="#d1d5db"/>
<text x="577.0" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">50x</text>
<line x1="638.5" y1="50" x2="638.5" y2="335" stroke="#d1d5db"/>
<text x="638.5" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">100x</text>
<line x1="700.0" y1="50" x2="700.0" y2="335" stroke="#d1d5db"/>
<text x="700.0" y="350.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">200x</text>
<text x="218.0" y="87.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">Chung-Lu n=50k</text>
<text x="218.0" y="103.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=192k</text>
<rect x="230" y="60" width="29.467971714307964" height="15" rx="0" fill="#56B4E9" stroke="#56B4E9" stroke-width="0"/>
<text x="264.5" y="72.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">1.4x (B)</text>
<rect x="230" y="78" width="294.25260822154337" height="15" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="529.3" y="90.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">28x (C)</text>
<rect x="230" y="96" width="361.65591688937116" height="15" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0"/>
<text x="596.7" y="108.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">59x (D)</text>
<text x="218.0" y="163.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">R-MAT n=2^16</text>
<text x="218.0" y="179.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=478k</text>
<rect x="230" y="136" width="50.56045676622722" height="15" rx="0" fill="#56B4E9" stroke="#56B4E9" stroke-width="0"/>
<text x="285.6" y="148.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">1.8x (B)</text>
<rect x="230" y="154" width="316.30410161846316" height="15" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="551.3" y="166.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">35x (C)</text>
<rect x="230" y="172" width="404.29547631432024" height="15" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0"/>
<text x="639.3" y="184.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">95x (D)</text>
<text x="218.0" y="221.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">Barabasi-Albert n=50k</text>
<text x="218.0" y="237.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=200k</text>
<rect x="230" y="212" width="283.5812704772991" height="15" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0"/>
<text x="518.6" y="224.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">24x (D)</text>
<text x="218.0" y="261.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">Chung-Lu n=500k</text>
<text x="218.0" y="277.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=1.95M, A estimated</text>
<rect x="230" y="252" width="360.04151281880786" height="15" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="595.0" y="264.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">58x (V)</text>
<text x="218.0" y="301.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">R-MAT n=2^19</text>
<text x="218.0" y="317.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=3.98M, A estimated</text>
<rect x="230" y="292" width="431.78636413104005" height="15" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="666.8" y="304.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2937">130x (V)</text>
<rect x="60" y="374" width="12" height="12" rx="0" fill="#56B4E9" stroke="#56B4E9" stroke-width="0"/>
<text x="78.0" y="385.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">B: shrunk graph</text>
<rect x="240" y="374" width="12" height="12" rx="0" fill="#0072B2" stroke="#0072B2" stroke-width="0"/>
<text x="258.0" y="385.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">C: 512 per pass</text>
<rect x="420" y="374" width="12" height="12" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0"/>
<text x="438.0" y="385.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">D: shrunk + shared</text>
<rect x="600" y="374" width="12" height="12" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="618.0" y="385.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">V: D, compressed lists</text>
</svg>
