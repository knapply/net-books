<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Memory by size</title>
<desc>How much memory each layout needs as the network grows.</desc>
<defs></defs>
<rect width="900" height="520" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Memory needed as the network grows (each person knows about 10 others)</text>
<line x1="110" y1="440.0" x2="710" y2="440.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="102.0" y="444.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">1.0 KB</text>
<line x1="110" y1="326.0" x2="710" y2="326.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="102.0" y="330.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">1.0 MB</text>
<line x1="110" y1="212.0" x2="710" y2="212.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="102.0" y="216.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">1.0 GB</text>
<line x1="110" y1="98.0" x2="710" y2="98.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="102.0" y="102.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">1.0 TB</text>
<text x="110.0" y="458.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">100</text>
<text x="260.0" y="458.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1,000</text>
<text x="410.0" y="458.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">10,000</text>
<text x="560.0" y="458.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">100,000</text>
<text x="710.0" y="458.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1,000,000</text>
<text x="410.0" y="480.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">number of people</text>
<polyline points="110.0,417.1 147.5,407.6 185.0,398.1 222.5,388.6 260.0,379.1 297.5,369.6 335.0,360.1 372.5,350.6 410.0,341.1 447.5,331.6 485.0,322.1 522.5,312.6 560.0,303.1 597.5,293.6 635.0,284.1 672.5,274.6 710.0,265.1" fill="none" stroke="#56B4E9" stroke-width="3"/>
<polyline points="110.0,409.4 147.5,399.9 185.0,390.4 222.5,380.9 260.0,371.4 297.5,361.9 335.0,352.4 372.5,342.9 410.0,333.4 447.5,323.9 485.0,314.4 522.5,304.9 560.0,295.4 597.5,285.9 635.0,276.4 672.5,266.9 710.0,257.4" fill="none" stroke="#009E73" stroke-width="3" stroke-dasharray="6 3"/>
<polyline points="110.0,415.5 147.5,406.0 185.0,396.5 222.5,387.0 260.0,377.5 297.5,368.0 335.0,358.5 372.5,349.0 410.0,339.5 447.5,330.0 485.0,320.5 522.5,311.0 560.0,301.5 597.5,292.0 635.0,282.5 672.5,273.0 710.0,263.5" fill="none" stroke="#0072B2" stroke-width="3"/>
<polyline points="110.0,402.0 147.5,383.0 185.0,364.0 222.5,345.0 260.0,326.0 297.5,307.0 335.0,288.0 372.5,269.0 410.0,250.0 447.5,231.0 485.0,212.0 522.5,193.0 560.0,174.0 597.5,155.0 635.0,136.0 672.5,117.0 710.0,98.0" fill="none" stroke="#D55E00" stroke-width="3"/>
<polyline points="110.0,436.3 147.5,417.3 185.0,398.3 222.5,379.3 260.0,360.3 297.5,341.3 335.0,322.3 372.5,303.3 410.0,284.3 447.5,265.3 485.0,246.3 522.5,227.3 560.0,208.3 597.5,189.3 635.0,170.3 672.5,151.3 710.0,132.3" fill="none" stroke="#E69F00" stroke-width="3" stroke-dasharray="6 3"/>
<line x1="110" y1="166.2" x2="710" y2="166.2" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="118.0" y="160.2" font-size="12" text-anchor="start" font-weight="600" fill="#1f2937">a laptop&#x27;s memory (16 GB)</text>
<text x="722.0" y="102.0" font-size="12" text-anchor="start" font-weight="700" fill="#D55E00">Matrix: 1 TB at a million people</text>
<text x="722.0" y="136.3" font-size="12" text-anchor="start" font-weight="700" fill="#E69F00">Bit rows: 125 GB</text>
<text x="722.0" y="247.4" font-size="12" text-anchor="start" font-weight="700" fill="#009E73">Adjacency list: 64 MB</text>
<text x="722.0" y="269.5" font-size="12" text-anchor="start" font-weight="700" fill="#0072B2">CSR: 44 MB</text>
<text x="722.0" y="291.1" font-size="12" text-anchor="start" font-weight="700" fill="#56B4E9">Edge list: 40 MB</text>
</svg>
