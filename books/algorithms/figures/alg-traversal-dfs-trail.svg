<text x="600.0" y="140.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Walk on to Cleo</text>
<text x="600.0" y="161.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Walk on to Fay</text>
