<text x="600.0" y="224.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#D55E00">Dead end at Eli, back to Gus</text>
<text x="600.0" y="245.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Walk on to Hana</text>
<text x="600.0" y="266.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Walk on to Ivo</text>
<text x="600.0" y="287.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">Walk on to Jo</text>
<text x="600.0" y="308.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#D55E00">Dead end at Jo, back to Ivo</text>
<text x="600.0" y="329.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#D55E00">Dead end at Ivo, back to Hana</text>
<text x="600.0" y="350.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#D55E00">Dead end at Hana, back to Gus</text>
<text x="600.0" y="377.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">...and so on until the trail is back at Ana.</text>
<text x="300.0" y="396.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Orange: ties walked along. Dashed: ties that led to someone already met.</text>
