<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Why counting routes explodes on a grid</title>
<desc>Number of routes between opposite corners of a square grid of people, shortest routes against all routes, on a log scale.</desc>
<defs></defs>
<rect width="900" height="470" fill="#ffffff"/>
<line x1="90" y1="370.0" x2="570" y2="370.0" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="374.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">1</text>
<line x1="90" y1="322.9" x2="570" y2="322.9" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="326.9" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10</text>
<line x1="90" y1="275.7" x2="570" y2="275.7" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="279.7" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10^2</text>
<line x1="90" y1="228.6" x2="570" y2="228.6" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="232.6" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10^3</text>
<line x1="90" y1="181.4" x2="570" y2="181.4" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="185.4" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10^4</text>
<line x1="90" y1="134.3" x2="570" y2="134.3" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="138.3" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10^5</text>
<line x1="90" y1="87.1" x2="570" y2="87.1" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="91.1" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10^6</text>
<line x1="90" y1="40.0" x2="570" y2="40.0" stroke="#d1d5db" stroke-width="1"/>
<text x="82.0" y="44.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">10^7</text>
<text x="90.0" y="392.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">2×2</text>
<text x="186.0" y="392.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">3×3</text>
<text x="282.0" y="392.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">4×4</text>
<text x="378.0" y="392.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">5×5</text>
<text x="474.0" y="392.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">6×6</text>
<text x="570.0" y="392.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">7×7</text>
<text x="330.0" y="416.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">grid size (people per side)</text>
<polyline points="90.0,355.8 186.0,333.3 282.0,308.7 378.0,283.0 474.0,256.8 570.0,230.2" fill="none" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="90.0" cy="355.8" r="4.5" fill="#0072B2"/>
<circle cx="186.0" cy="333.3" r="4.5" fill="#0072B2"/>
<circle cx="282.0" cy="308.7" r="4.5" fill="#0072B2"/>
<circle cx="378.0" cy="283.0" r="4.5" fill="#0072B2"/>
<circle cx="474.0" cy="256.8" r="4.5" fill="#0072B2"/>
<circle cx="570.0" cy="230.2" r="4.5" fill="#0072B2"/>
<polyline points="90.0,355.8 186.0,319.1 282.0,263.2 378.0,184.7 474.0,82.4" fill="none" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 4"/>
<rect x="85.5" y="351.3" width="9" height="9" fill="#D55E00"/>
<rect x="181.5" y="314.6" width="9" height="9" fill="#D55E00"/>
<rect x="277.5" y="258.7" width="9" height="9" fill="#D55E00"/>
<rect x="373.5" y="180.2" width="9" height="9" fill="#D55E00"/>
<rect x="469.5" y="77.9" width="9" height="9" fill="#D55E00"/>
<text x="372.0" y="172.7" font-size="13" text-anchor="end" font-weight="700" fill="#D55E00">all routes</text>
<text x="378.0" y="313.0" font-size="13" text-anchor="middle" font-weight="700" fill="#0072B2">shortest routes only</text>
<text x="600.0" y="66.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Grid</text>
<text x="665.0" y="66.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">Shortest</text>
<text x="760.0" y="66.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#1f2937">All</text>
<text x="600.0" y="96.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2×2</text>
<text x="665.0" y="96.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">2</text>
<text x="760.0" y="96.0" font-size="13" text-anchor="start" font-weight="400" fill="#D55E00">2</text>
<text x="600.0" y="126.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">3×3</text>
<text x="665.0" y="126.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">6</text>
<text x="760.0" y="126.0" font-size="13" text-anchor="start" font-weight="400" fill="#D55E00">12</text>
<text x="600.0" y="156.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">4×4</text>
<text x="665.0" y="156.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">20</text>
<text x="760.0" y="156.0" font-size="13" text-anchor="start" font-weight="400" fill="#D55E00">184</text>
<text x="600.0" y="186.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">5×5</text>
<text x="665.0" y="186.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">70</text>
<text x="760.0" y="186.0" font-size="13" text-anchor="start" font-weight="400" fill="#D55E00">8,512</text>
<text x="600.0" y="216.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">6×6</text>
<text x="665.0" y="216.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">252</text>
<text x="760.0" y="216.0" font-size="13" text-anchor="start" font-weight="400" fill="#D55E00">1,262,816</text>
<text x="600.0" y="246.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">7×7</text>
<text x="665.0" y="246.0" font-size="13" text-anchor="start" font-weight="400" fill="#0072B2">924</text>
<text x="760.0" y="246.0" font-size="11" text-anchor="start" font-weight="400" fill="#D55E00">too many to run</text>
<text x="600.0" y="300.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">Both counts come from running</text>
<text x="600.0" y="318.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">the searches. One more person</text>
<text x="600.0" y="336.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">per side multiplies all routes by</text>
<text x="600.0" y="354.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">15, 46, 148, each time.</text>
</svg>
