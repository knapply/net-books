<text x="600.0" y="170.0" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">Ben&#x27;s friends: 0, 2, 3.</text>
<text x="600.0" y="190.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Counting them means walking the list,</text>
<text x="600.0" y="210.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">unless we also keep the length.</text>
