<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Five versions of one computation</title>
<desc>Five boxes in a row, A to V, each naming what changes from the one before.</desc>
<defs><marker id="arrow-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="760" height="250" fill="#ffffff"/>
<text x="380.0" y="28.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Same answer every time; only the route to it changes</text>
<rect x="20" y="60" width="128" height="140" rx="10" fill="#9ca3af1a" stroke="#9ca3af" stroke-width="2"/>
<text x="84.0" y="96.0" font-size="28" text-anchor="middle" font-weight="800" fill="#9ca3af">A</text>
<text x="84.0" y="128.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">one search per person</text>
<text x="84.0" y="150.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">the textbook way</text>
<rect x="168" y="60" width="128" height="140" rx="10" fill="#56B4E91a" stroke="#56B4E9" stroke-width="2"/>
<text x="232.0" y="96.0" font-size="28" text-anchor="middle" font-weight="800" fill="#56B4E9">B</text>
<text x="232.0" y="128.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">shrink the graph first</text>
<text x="232.0" y="150.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">fold twins and leaves</text>
<line x1="151.0" y1="130.0" x2="162.0" y2="130.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<rect x="316" y="60" width="128" height="140" rx="10" fill="#0072B21a" stroke="#0072B2" stroke-width="2"/>
<text x="380.0" y="96.0" font-size="28" text-anchor="middle" font-weight="800" fill="#0072B2">C</text>
<text x="380.0" y="128.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">share the passes</text>
<text x="380.0" y="150.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">512 searches per pass,</text>
<text x="380.0" y="166.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">bit-plane counters</text>
<line x1="299.0" y1="130.0" x2="310.0" y2="130.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<rect x="464" y="60" width="128" height="140" rx="10" fill="#E69F001a" stroke="#E69F00" stroke-width="2"/>
<text x="528.0" y="96.0" font-size="28" text-anchor="middle" font-weight="800" fill="#E69F00">D</text>
<text x="528.0" y="128.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">both together</text>
<text x="528.0" y="150.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">weighted shared pass,</text>
<text x="528.0" y="166.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">batched in search order</text>
<line x1="447.0" y1="130.0" x2="458.0" y2="130.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<rect x="612" y="60" width="128" height="140" rx="10" fill="#D55E001a" stroke="#D55E00" stroke-width="2"/>
<text x="676.0" y="96.0" font-size="28" text-anchor="middle" font-weight="800" fill="#D55E00">V</text>
<text x="676.0" y="128.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">squeeze the lists</text>
<text x="676.0" y="150.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">gap-coded friend lists</text>
<line x1="595.0" y1="130.0" x2="606.0" y2="130.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-6b7280)"/>
<text x="380.0" y="232.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Every version must produce the same integers: distance sums, people reached, and the harmonic sum.</text>
</svg>
