<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A case you can check on paper</title>
<desc>A five-person network with its degrees and the distances from Ana worked out by hand.</desc>
<defs></defs>
<rect width="920" height="400" fill="#ffffff"/>
<line x1="78.3" y1="137.8" x2="161.7" y2="82.2" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="78.3" y1="162.2" x2="161.7" y2="217.8" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="198.7" y1="81.5" x2="291.3" y2="138.5" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="198.7" y1="218.5" x2="291.3" y2="161.5" stroke="#9ca3af" stroke-width="1.8"/>
<line x1="332.0" y1="150.0" x2="408.0" y2="150.0" stroke="#9ca3af" stroke-width="1.8"/>
<circle cx="60" cy="150" r="21" fill="#E69F0088" stroke="#1f2937" stroke-width="2"/>
<text x="60.0" y="155.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<text x="60.0" y="185.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="180" cy="70" r="21" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="180.0" y="75.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<text x="180.0" y="105.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
<circle cx="180" cy="230" r="21" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="180.0" y="235.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="180.0" y="265.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="310" cy="150" r="21" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="310.0" y="155.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">D</text>
<text x="310.0" y="185.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="430" cy="150" r="21" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="430.0" y="155.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">E</text>
<text x="430.0" y="185.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Eli</text>
<text x="250.0" y="40.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Five people, five ties</text>
<rect x="500" y="60" width="410" height="32" rx="0" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="508.0" y="81.8" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Person</text>
<text x="588.0" y="81.8" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Ties</text>
<text x="648.0" y="81.8" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Steps from Ana</text>
<text x="778.0" y="81.8" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Shortest routes</text>
<rect x="500" y="92" width="410" height="32" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="508.0" y="113.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ana</text>
<text x="588.0" y="113.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<text x="648.0" y="113.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">0</text>
<text x="778.0" y="113.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<rect x="500" y="124" width="410" height="32" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="508.0" y="145.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ben</text>
<text x="588.0" y="145.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<text x="648.0" y="145.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<text x="778.0" y="145.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<rect x="500" y="156" width="410" height="32" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="508.0" y="177.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Cleo</text>
<text x="588.0" y="177.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<text x="648.0" y="177.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<text x="778.0" y="177.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<rect x="500" y="188" width="410" height="32" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="508.0" y="209.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Dev</text>
<text x="588.0" y="209.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">3</text>
<text x="648.0" y="209.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<text x="778.0" y="209.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<rect x="500" y="220" width="410" height="32" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="508.0" y="241.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Eli</text>
<text x="588.0" y="241.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">1</text>
<text x="648.0" y="241.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">3</text>
<text x="778.0" y="241.8" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">2</text>
<text x="500.0" y="285.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">Ties add up to 10, which is 2 x 5: each tie is</text>
<text x="500.0" y="302.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">counted at both ends.</text>
<text x="500.0" y="320.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">Dev is 2 steps away by two routes (through Ben or</text>
<text x="500.0" y="337.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">Cleo), and Eli is 3 steps away by the same two.</text>
<text x="460.0" y="372.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1f2937">With five people you can check every number with a pencil. Do that once, then ask the routine for the same numbers.</text>
</svg>
