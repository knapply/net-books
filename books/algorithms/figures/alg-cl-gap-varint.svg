<text x="380.0" y="290.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Plain list: 8 x 4 = 32 bytes.  Gaps: 12 bytes.</text>
<text x="380.0" y="318.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Small gaps fit in one byte (up to 127), medium ones in two (up to 16,383), and so on.</text>
