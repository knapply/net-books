<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Why &#x27;equal&#x27; needs a tolerance</title>
<desc>A number line showing that 0.1 plus 0.2 differs from 0.3 by a tiny amount, which is far smaller than a real discrepancy.</desc>
<defs></defs>
<rect width="920" height="420" fill="#ffffff"/>
<text x="460.0" y="34.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Computers keep numbers in binary, so 0.1 + 0.2 is not exactly 0.3</text>
<text x="460.0" y="74.0" font-size="15" text-anchor="middle" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>0.1 + 0.2  prints as  0.30000000000000004</text>
<text x="460.0" y="102.0" font-size="15" text-anchor="middle" font-weight="400" fill="#1f2937" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace'>0.3        prints as  0.3</text>
<text x="460.0" y="130.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7280">difference: 5.551e-17</text>
<line x1="120" y1="230" x2="800" y2="230" stroke="#1f2937" stroke-width="2"/>
<line x1="120.0" y1="224" x2="120.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="120.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-17</text>
<line x1="200.0" y1="224" x2="200.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="200.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-15</text>
<line x1="280.0" y1="224" x2="280.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="280.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-13</text>
<line x1="360.0" y1="224" x2="360.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="360.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-11</text>
<line x1="440.0" y1="224" x2="440.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="440.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-9</text>
<line x1="520.0" y1="224" x2="520.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="520.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-7</text>
<line x1="600.0" y1="224" x2="600.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="600.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-5</text>
<line x1="680.0" y1="224" x2="680.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="680.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-3</text>
<line x1="760.0" y1="224" x2="760.0" y2="236" stroke="#1f2937" stroke-width="1.2"/>
<text x="760.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">1e-1</text>
<text x="460.0" y="286.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">size of the difference between two answers (log scale)</text>
<rect x="120" y="186" width="320.0" height="34" rx="4" fill="#009E7322" stroke="#009E73" stroke-width="1.6"/>
<text x="280.0" y="208.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#009E73">rounding noise: accept</text>
<rect x="440.0" y="186" width="360.0" height="34" rx="4" fill="#D55E0018" stroke="#D55E00" stroke-width="1.6"/>
<text x="620.0" y="208.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#D55E00">too big to be rounding: investigate</text>
<circle cx="149.8" cy="230" r="8" fill="#009E73" stroke="#1f2937" stroke-width="1.6"/>
<text x="149.8" y="300.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">0.1 + 0.2 vs 0.3</text>
<circle cx="720.0" cy="230" r="8" fill="#D55E00" stroke="#1f2937" stroke-width="1.6"/>
<text x="720.0" y="300.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">a wrong closeness</text>
<text x="460.0" y="394.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Typical rule: two answers agree if they differ by less than about a billionth of their size, relative to the larger one.</text>
</svg>
