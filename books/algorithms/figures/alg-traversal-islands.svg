<circle cx="170" cy="300" r="20" fill="#009E7355" stroke="#009E73" stroke-width="2"/>
<text x="170.0" y="305.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="170.0" y="334.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Jo</text>
<circle cx="300" cy="320" r="20" fill="#009E7355" stroke="#009E73" stroke-width="2"/>
<text x="300.0" y="325.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3</text>
<text x="300.0" y="354.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Kai</text>
<circle cx="800" cy="310" r="20" fill="#CC79A755" stroke="#CC79A7" stroke-width="2"/>
<text x="800.0" y="315.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">4</text>
<text x="800.0" y="344.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Lena</text>
<text x="450.0" y="392.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">The number in each dot is which search found that person: 4 searches, 4 islands (Lena is an island of one).</text>
