<text x="680.0" y="104.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Gus</text>
<circle cx="700" cy="180" r="20" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
