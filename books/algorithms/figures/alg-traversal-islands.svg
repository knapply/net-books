<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Finding islands with repeated searches</title>
<desc>Twelve people in four separate groups, each coloured by the search that found it.</desc>
<defs></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Start a search from the first person not yet found. Each search lights up one island.</text>
<line x1="128.8" y1="110.6" x2="191.2" y2="79.4" stroke="#0072B2" stroke-width="3.2"/>
<line x1="127.2" y1="132.0" x2="192.8" y2="178.0" stroke="#0072B2" stroke-width="3.2"/>
<line x1="210.0" y1="91.0" x2="210.0" y2="169.0" stroke="#0072B2" stroke-width="3.2"/>
<line x1="231.0" y1="190.0" x2="309.0" y2="190.0" stroke="#0072B2" stroke-width="3.2"/>
<line x1="347.2" y1="178.0" x2="412.8" y2="132.0" stroke="#0072B2" stroke-width="3.2"/>
<line x1="580.7" y1="86.5" x2="659.3" y2="73.5" stroke="#E69F00" stroke-width="3.2"/>
<line x1="683.8" y1="90.7" x2="696.2" y2="159.3" stroke="#E69F00" stroke-width="3.2"/>
<line x1="679.1" y1="181.7" x2="600.9" y2="188.3" stroke="#E69F00" stroke-width="3.2"/>
<line x1="564.1" y1="110.6" x2="575.9" y2="169.4" stroke="#E69F00" stroke-width="3.2"/>
<line x1="190.8" y1="303.2" x2="279.2" y2="316.8" stroke="#009E73" stroke-width="3.2"/>
<circle cx="110" cy="120" r="20" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="110.0" y="125.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="110.0" y="154.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ana</text>
<circle cx="210" cy="70" r="20" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="210.0" y="75.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="210.0" y="104.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Ben</text>
