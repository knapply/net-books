<text x="210.0" y="224.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Cleo</text>
<circle cx="330" cy="190" r="20" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="330.0" y="195.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">1</text>
<text x="330.0" y="224.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Dev</text>
<circle cx="430" cy="120" r="20" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
