<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>The two big graphs, in minutes</title>
<desc>Paired bars in minutes: the estimated baseline and the measured fastest method on two graphs with millions of ties.</desc>
<defs></defs>
<rect width="760" height="300" fill="#ffffff"/>
<text x="380.0" y="28.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Minutes for exact closeness of everyone (baseline estimated from sampled sources)</text>
<text x="218.0" y="86.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">Chung-Lu n=500k</text>
<text x="218.0" y="104.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=1.95M</text>
<rect x="230" y="60" width="440.0" height="26" rx="0" fill="#9ca3af" stroke="#9ca3af" stroke-width="0"/>
<text x="676.0" y="78.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">138 min (A, estimated)</text>
<rect x="230" y="94" width="7.599033816425122" height="26" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="243.6" y="112.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">2.4 min (V, measured)</text>
<text x="218.0" y="196.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#1f2937">R-MAT n=2^19</text>
<text x="218.0" y="214.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">m=3.98M</text>
<rect x="230" y="170" width="261.4492753623188" height="26" rx="0" fill="#9ca3af" stroke="#9ca3af" stroke-width="0"/>
<text x="497.4" y="188.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">82 min (A, estimated)</text>
<rect x="230" y="204" width="2.019323671497584" height="26" rx="0" fill="#D55E00" stroke="#D55E00" stroke-width="0"/>
<text x="238.0" y="222.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">0.6 min (V, measured)</text>
<text x="380.0" y="288.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">V: shrunk graph, 512 searches per pass, bit-plane counters, compressed friend lists. 2 threads.</text>
</svg>
