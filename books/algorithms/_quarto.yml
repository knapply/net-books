# Generated by tools/new_chapters.py from outline.toml. Edit the outline.
project:
  type: book

metadata-files:
  - ../../shared/quarto-common.yml

bibliography: ../../shared/bib/references.bib

format:
  html:
    css: ../../shared/css/book.css
    include-in-header:
      - text: |
          <style>
          .sidebar-title::after { content: "by Brendan Knapp"; display: block; font-size: 0.7em; font-weight: 400; opacity: 0.8; letter-spacing: 0.02em; }
          @media (max-width: 991.98px) {
            #quarto-header::before { content: "Graph and Network Algorithms \00b7  by Brendan Knapp"; display: block; padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,0.25); }
          }
          </style>
      - text: |
          <link rel="alternate" type="application/json" href="https://knapply.github.io/net-books/algorithms/machine/book.json">
          <link rel="alternate" type="text/markdown" href="https://knapply.github.io/net-books/algorithms/machine/book.md">
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Book",
            "name": "Graph and Network Algorithms",
            "alternateName": "Data structures, cost and fast implementations",
            "author": {
              "@type": "Person",
              "name": "Brendan Knapp"
            },
            "inLanguage": "en",
            "url": "https://knapply.github.io/net-books/algorithms/",
            "isAccessibleForFree": true,
            "license": "https://creativecommons.org/licenses/by-nc-nd/4.0/",
            "encoding": {
              "@type": "MediaObject",
              "encodingFormat": "application/json",
              "contentUrl": "https://knapply.github.io/net-books/algorithms/machine/book.json"
            }
          }
          </script>
          <script>document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll(".panel-tabset .nav-link").forEach(function(a){var t=a.textContent.trim().toLowerCase();if(["r","python","rust"].indexOf(t)>-1){a.setAttribute("data-lang",t);}});});</script>
  pdf:
    include-in-header: ../../shared/tex/print.tex
  epub:
    css: ../../shared/css/book.css

book:
