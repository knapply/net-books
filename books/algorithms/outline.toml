# Graph and Network Algorithms: outline. Edit here, then run
#   python3 tools/new_chapters.py books/algorithms
# Files are created only when missing, so written chapters are never touched.
# Code in this book is stubs for now: every code spot stays a TODO(code, ...) line until the
# engine functions behind it are exposed and the language plan is settled.

[book]
title = "Graph and Network Algorithms"
subtitle = "Data structures, cost and fast implementations"
author = "Brendan Knapp"

[analytics]
goatcounter = ""
plausible = ""
umami_id = ""
umami_src = ""

[[part]]
title = "Foundations"

  [[part.chapter]]
  slug = "representations"
  title = "What a graph is to a computer"
  purpose = "Edge lists, adjacency lists, compressed sparse rows, adjacency matrices and bit rows: how each stores a network, what it costs in memory, and which questions each answers quickly. Ids versus labels, directed and weighted graphs, and why the choice of layout shapes everything later."
  prerequisites = "None."
  first_section = "Five ways to store five people"
  code_note = "build the same small network in four layouts and compare their sizes"

  [[part.chapter]]
  slug = "cost"
  title = "Cost: time, memory and what really takes long"
  purpose = "Big-O in plain words, then the parts it hides: cache and memory behavior, parallel speedup, why floating-point order changes answers, and what determinism means for a graph algorithm."
  prerequisites = "What a graph is to a computer."
  first_section = "Counting steps by hand"
  code_note = "time a traversal on growing graphs and plot steps against time"

  [[part.chapter]]
  slug = "building-blocks"
  title = "Building blocks: queues, heaps, union-find and bitsets"
  purpose = "The small data structures nearly every graph algorithm leans on: queues, priority queues and heaps, union-find, hash maps, bitsets, and sorting (including radix sort), each with what it costs and when to reach for it."
  prerequisites = "Cost."
  first_section = "A queue and a stack, by hand"
  code_note = "use a heap and a union-find on a ten-person example"

  [[part.chapter]]
  slug = "trust"
  title = "Trusting an implementation"
  purpose = "How to know a graph routine is right: reference tools as oracles, property tests, fuzzing, tiny hand-checked cases, and the conventions on which careful tools still disagree."
  prerequisites = "Building blocks."
  first_section = "Checking against a tool you trust"
  code_note = "compare one routine against a reference result and report any difference"

[[part]]
title = "Traversal and paths"

  [[part.chapter]]
  slug = "traversal"
  title = "Breadth-first and depth-first search"
  purpose = "The two ways of walking a graph, what each gives you for free (distances, trees, orderings), their cost, and how they become the base of most later algorithms."
  prerequisites = "Building blocks."
  first_section = "Walking outward from one person"
  code_note = "run breadth-first and depth-first search from one node and print levels and order"

  [[part.chapter]]
  slug = "shortest-paths"
  title = "Shortest paths"
  purpose = "Dijkstra, Bellman-Ford, A* and bidirectional search: the problem each solves, the invariant that makes it correct, when each fails or wins, and negative weights."
  prerequisites = "Traversal."
  first_section = "The cheapest route, by hand"
  code_note = "find a weighted shortest path three ways and compare the work done"

  [[part.chapter]]
  slug = "all-pairs"
  title = "All pairs and distance statistics"
  purpose = "Floyd-Warshall, Johnson's method and repeated search: computing every distance at once, and the summaries built from them (diameter, radius, mean distance, eccentricity)."
  prerequisites = "Shortest paths."
  first_section = "A table of every distance"
  code_note = "compute all pairs distances and the summary statistics for a small network"

  [[part.chapter]]
  slug = "path-enumeration"
  title = "Counting and listing paths"
  purpose = "Counting shortest paths, listing every simple path, k shortest paths and ordered search: what is cheap, what blows up, and how to cap the work honestly."
  prerequisites = "Shortest paths."
  first_section = "How many ways to get there?"
  code_note = "count and list shortest and simple paths between two people"

[[part]]
title = "Structure"

  [[part.chapter]]
  slug = "components"
  title = "Components"
  purpose = "Connected components with search and with union-find (including fast parallel variants), strongly connected components (Tarjan and Kosaraju), and the condensation of a directed graph."
  prerequisites = "Traversal."
  first_section = "Who can reach whom"
  code_note = "find connected and strongly connected components of a small directed network"

  [[part.chapter]]
  slug = "connectivity-dags"
  title = "Bridges, articulation points and DAGs"
  purpose = "Single points of failure (bridges, articulation points, biconnected components) and acyclic graphs (topological order, longest paths, reachability)."
  prerequisites = "Components."
  first_section = "The tie that holds it together"
  code_note = "list bridges and articulation points, then order a small dependency graph"

  [[part.chapter]]
  slug = "cores-triangles"
  title = "Cores, triangles and clustering"
  purpose = "Peeling a graph into cores, and counting triangles fast: the algorithms behind k-cores, clustering coefficients and transitivity, and what their cost depends on."
  prerequisites = "Traversal."
  first_section = "Peeling the outer layer"
  code_note = "compute core numbers and count triangles on a small network"

  [[part.chapter]]
  slug = "cliques-subgraphs"
  title = "Cliques and subgraph counting"
  purpose = "Finding cliques (Bron-Kerbosch and its pivots) and counting small patterns, with an honest look at where counting becomes infeasible and what approximations cost."
  prerequisites = "Cores, triangles and clustering."
  first_section = "Everyone knows everyone"
  code_note = "list maximal cliques and count triangles and four-node patterns"

  [[part.chapter]]
  slug = "isomorphism"
  title = "Isomorphism and automorphisms"
  purpose = "When two networks are the same shape: refinement, canonical labeling, automorphism groups and Weisfeiler-Leman, with what is known to be easy and what is not."
  prerequisites = "Cliques and subgraph counting."
  first_section = "The same network in different clothes"
  code_note = "test two small networks for isomorphism and count one network's automorphisms"

  [[part.chapter]]
  slug = "planarity"
  title = "Planarity"
  purpose = "Which networks can be drawn without crossing ties, why it matters, and how a linear-time test works, as a showpiece of a clever algorithm."
  prerequisites = "Bridges, articulation points and DAGs."
  first_section = "Can it be drawn flat?"
  code_note = "test small networks for planarity and extract a crossing-free drawing"

[[part]]
title = "Flow, cuts, matching and trees"

  [[part.chapter]]
  slug = "flow-cuts"
  title = "Maximum flow and minimum cut"
  purpose = "Pushing as much as possible through a network: augmenting paths, push-relabel, and the theorem that ties flow to cuts, plus edge and vertex connectivity as consequences."
  prerequisites = "Shortest paths."
  first_section = "Pipes and bottlenecks"
  code_note = "find a maximum flow and the matching minimum cut in a small network"

  [[part.chapter]]
  slug = "matching"
  title = "Matching"
  purpose = "Pairing people up: bipartite matching, augmenting paths, and what changes for general graphs and for weights."
  prerequisites = "Maximum flow and minimum cut."
  first_section = "Pairing up"
  code_note = "find a maximum matching in a small bipartite network"

  [[part.chapter]]
  slug = "spanning-trees"
  title = "Spanning trees and tours"
  purpose = "Minimum spanning trees (Kruskal, Prim, Boruvka), Steiner trees and tours, and how much of each is easy."
  prerequisites = "Building blocks."
  first_section = "Connecting everyone cheaply"
  code_note = "build a minimum spanning tree two ways"

[[part]]
title = "Centrality at scale"

  [[part.chapter]]
  slug = "betweenness"
  title = "Betweenness, exactly and approximately"
  purpose = "Brandes' algorithm for counting shortest paths through every node, why it takes the time it does, and how sampling gives good answers on big graphs."
  prerequisites = "Shortest paths."
  first_section = "Counting routes through a node"
  code_note = "compute betweenness exactly and from sampled sources on one network"

  [[part.chapter]]
  slug = "closeness-at-scale"
  title = "Closeness and harmonic centrality on millions of ties"
  purpose = "How to compute every person's distances exactly on a big graph: multi-source search, bit-parallel lanes, collapsing look-alike nodes and leaves, counters kept by bit planes, and compressed adjacency."
  prerequisites = "Breadth-first and depth-first search; Cost."
  first_section = "Why one search per person is too slow"
  code_note = "compute closeness for every node with one search per node and with batched searches, and compare"

  [[part.chapter]]
  slug = "eigen-pagerank"
  title = "Eigenvector centrality, PageRank and the linear algebra underneath"
  purpose = "Power iteration, convergence, Krylov and Lanczos methods, and sparse matrix-vector products: how scores that depend on everyone else's scores get computed."
  prerequisites = "Cost."
  first_section = "Passing scores around until they settle"
  code_note = "run power iteration for eigenvector centrality and PageRank on a small network"

  [[part.chapter]]
  slug = "random-walks"
  title = "Random walks and sampling"
  purpose = "Walks as an algorithmic tool: visit counts, hitting and commute times, sampling nodes and subgraphs, and the bias each sampling scheme brings."
  prerequisites = "Eigenvector centrality, PageRank and the linear algebra underneath."
  first_section = "Wandering the network"
  code_note = "run a seeded random walk and report visit counts"

[[part]]
title = "Communities"

  [[part.chapter]]
  slug = "modularity-louvain-leiden"
  title = "Modularity, Louvain and Leiden"
  purpose = "Modularity as an objective, how Louvain greedily improves it, why it can return disconnected groups, and how Leiden repairs that, with the cost of each pass."
  prerequisites = "Components."
  first_section = "A score for a division"
  code_note = "run Louvain and Leiden on a small network and compare their levels and modularity"

  [[part.chapter]]
  slug = "spectral-label-hierarchical"
  title = "Spectral, label-propagation and hierarchical methods"
  purpose = "Splitting with eigenvectors of the Laplacian, spreading labels, and building dendrograms, with what each assumes and where each fails."
  prerequisites = "Eigenvector centrality, PageRank and the linear algebra underneath."
  first_section = "Cutting along the weakest seam"
  code_note = "split a small network three ways and compare the groups"

  [[part.chapter]]
  slug = "block-models"
  title = "Fitting block models"
  purpose = "Stochastic block models as a probabilistic way to find groups: likelihood, the degree-corrected version, and the algorithms (greedy moves, EM-like updates, MCMC) that fit them."
  prerequisites = "Modularity, Louvain and Leiden."
  first_section = "Groups as a recipe for ties"
  code_note = "fit a block model to a small network and read off the groups"

[[part]]
title = "Generating and sampling graphs"

  [[part.chapter]]
  slug = "generators"
  title = "Random graph generators"
  purpose = "Erdos-Renyi, configuration, preferential attachment, small-world, Chung-Lu and R-MAT: how each is sampled efficiently, what it preserves, and why generator choice changes conclusions."
  prerequisites = "Building blocks."
  first_section = "Rolling dice for ties"
  code_note = "sample graphs from each generator with a fixed seed and report degrees"

  [[part.chapter]]
  slug = "swap-mcmc"
  title = "Swap chains and MCMC"
  purpose = "Degree-preserving rewiring and Markov chain Monte Carlo on networks: proposals, acceptance, mixing and diagnostics, as used for null models and for fitting and simulating network models."
  prerequisites = "Random graph generators."
  first_section = "Shuffling ties while keeping degrees"
  code_note = "run a swap chain and report how many swaps it took to mix"

[[part]]
title = "Layout and embedding"

  [[part.chapter]]
  slug = "layout"
  title = "Layout algorithms"
  purpose = "Force-directed, stress-majorization, spectral and multidimensional-scaling layouts: their objectives, their costs, how to speed them up, and how to judge a layout."
  prerequisites = "Eigenvector centrality, PageRank and the linear algebra underneath."
  first_section = "Springs and stress"
  code_note = "lay out a small network three ways and score each layout"

  [[part.chapter]]
  slug = "embeddings"
  title = "Embeddings and walk-based methods"
  purpose = "Turning nodes into vectors: spectral embeddings, walk-based embeddings, and what such vectors can and cannot say about a network."
  prerequisites = "Layout algorithms; Random walks and sampling."
  first_section = "Nodes as points"
  code_note = "embed a small network and check which nodes land close together"

[[part]]
title = "Scale and engineering"

  [[part.chapter]]
  slug = "parallel-simd-memory"
  title = "Parallelism, SIMD, memory layout and compression"
  purpose = "Using many cores and wide registers on graphs: what parallelizes, what does not, how layout and relabeling change speed, and compressed adjacency that trades a little time for much less memory."
  prerequisites = "Cost."
  first_section = "Why graphs are hard to make fast"
  code_note = "time a traversal with one and with several threads"

  [[part.chapter]]
  slug = "dynamic-temporal"
  title = "Dynamic, temporal and streaming graphs"
  purpose = "Graphs that change: incremental updates, time-respecting paths, contact sequences and streaming, and what can be maintained cheaply."
  prerequisites = "Traversal."
  first_section = "A graph that will not sit still"
  code_note = "add and remove ties and keep components current"

  [[part.chapter]]
  slug = "benchmarking"
  title = "Benchmarking honestly"
  purpose = "How to measure a graph algorithm fairly: protocol, datasets, baselines, warm-up, variance, memory, and the common ways benchmarks mislead."
  prerequisites = "Cost."
  first_section = "What a fair race looks like"
  code_note = "benchmark one routine against a baseline on three graphs and report medians"

  [[part.chapter]]
  slug = "bindings"
  title = "Putting an engine behind R and Python"
  purpose = "How a fast core is exposed to other languages: a stable C interface, ownership and memory, errors, determinism and provenance, and keeping results reproducible across languages."
  prerequisites = "Parallelism, SIMD, memory layout and compression."
  first_section = "One engine, many front doors"
  code_note = "call one engine routine from R and from Python and compare results"

[[part]]
title = "Case studies"

  [[part.chapter]]
  slug = "case-closeness"
  title = "Case study: closeness on a four-million-tie graph"
  purpose = "The whole closeness-at-scale story end to end on a big real graph: baselines, each speedup, exactness checks, memory and the numbers."
  prerequisites = "Closeness and harmonic centrality on millions of ties."
  first_section = "The baseline"
  code_note = "run the baseline and the fastest method on one large graph"

  [[part.chapter]]
  slug = "case-new-kernel"
  title = "Case study: from a paper to a checked kernel"
  purpose = "Taking an algorithm from a research paper to an implementation you can trust: reading the paper, finding oracles, writing tests, handling the conventions, benchmarking."
  prerequisites = "Trusting an implementation."
  first_section = "Reading the paper for what it leaves out"
  code_note = "implement a small published measure and check it against a reference"

  [[part.chapter]]
  slug = "case-benchmark"
  title = "Case study: reproducing a published benchmark"
  purpose = "Re-running someone else's benchmark: matching their setup, finding where results differ, and writing up what you can and cannot reproduce."
  prerequisites = "Benchmarking honestly."
  first_section = "Matching the setup"
  code_note = "rerun one published comparison on a public graph"

[[appendix]]
slug = "complexity"
title = "Complexity cheat sheet"
purpose = "Time and memory for every algorithm in the book, in one table, with the assumptions behind each."
prerequisites = "None."
first_section = "The table"
code_note = "print the table"

[[appendix]]
slug = "proofs"
title = "Proof sketches"
purpose = "Short, friendly proofs of the key correctness claims, for readers who want to see why."
prerequisites = "None."
first_section = "Why breadth-first search finds shortest paths"
code_note = "check one claim on small cases"

[[appendix]]
slug = "datasets"
title = "Datasets"
purpose = "Every graph used in the book, with source and licence."
prerequisites = "None."
first_section = "Bundled graphs"
code_note = "list the bundled graphs"
