book:
  title: "Social Network Analysis"
  subtitle: "Methods in R, Python and Rust"
  author: "Brendan Knapp"
  page-footer:
    left: "Social Network Analysis by Brendan Knapp"
    right: "&copy; 2026 Brendan Knapp &middot; [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)"
  site-url: https://knapply.github.io/net-books/sna/
  repo-url: https://github.com/knapply/net-books
  repo-branch: main
  repo-subdir: books/sna
  repo-actions: [source, issue]
  search: true
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-foundations.qmd
        - chapters/03-networks-as-data.qmd
        - chapters/04-getting-started.qmd
    - part: "Describing networks"
      chapters:
        - chapters/05-visualization.qmd
        - chapters/06-centrality.qmd
        - chapters/07-paths-and-cohesion.qmd
        - chapters/08-triads-and-motifs.qmd
        - chapters/09-small-worlds.qmd
        - chapters/10-subgroups.qmd
        - chapters/11-homophily.qmd
        - chapters/12-positions-and-roles.qmd
        - chapters/13-ego-networks.qmd
    - part: "More complex networks"
      chapters:
        - chapters/14-two-mode.qmd
        - chapters/15-multilayer.qmd
        - chapters/16-signed-and-valued.qmd
        - chapters/17-time.qmd
        - chapters/18-space.qmd
    - part: "Modeling networks"
      chapters:
        - chapters/19-tests-and-null-models.qmd
        - chapters/20-network-regression.qmd
        - chapters/21-ergm.qmd
        - chapters/22-latent-space.qmd
        - chapters/23-dynamics.qmd
        - chapters/24-diffusion.qmd
        - chapters/25-prediction.qmd
    - part: "In practice"
      chapters:
        - chapters/26-collecting-data.qmd
        - chapters/27-reproducibility.qmd
        - chapters/28-reporting.qmd
    - part: "Case studies"
      chapters:
        - chapters/29-case-florentine.qmd
        - chapters/30-case-sampson.qmd
        - chapters/31-case-krackhardt.qmd
        - chapters/32-case-karate.qmd
  appendices:
    - appendices/math-review.qmd
    - appendices/datasets.qmd
    - appendices/conventions.qmd
    - references.qmd
