# Social Network Analysis: outline. Edit here, then run
#   python3 tools/new_chapters.py books/sna
# Files are created only when missing, so written chapters are never touched.
# Fields per chapter: slug (file and anchor id), title, purpose, prerequisites,
# first_section (heading of the first worked section), code_note (what the
# placeholder will call).

[book]
title = "Social Network Analysis"
subtitle = "Methods in R, Python and Rust"
author = "Brendan Knapp"

# Visit statistics. Leave a value empty to leave that tool out. All three tools
# below count visits in aggregate without cookies. See docs/ANALYTICS.md.
[analytics]
goatcounter = ""   # your GoatCounter code, the part before .goatcounter.com
plausible = ""     # the domain registered in Plausible, e.g. "knapply.github.io"
umami_id = ""      # Umami website id
umami_src = ""     # Umami script URL, e.g. "https://cloud.umami.is/script.js"

[[part]]
title = "Foundations"

  [[part.chapter]]
  slug = "introduction"
  title = "Introduction"
  purpose = "What a network is, the questions network analysis answers, what each chapter promises, how people and programs should use the book, and a first look at two networks."
  prerequisites = "None."
  first_section = "A first network"
  code_note = "build two five-person teams, count degree and density, and run a crisis test; then take a first look at the Florentine marriages"

  [[part.chapter]]
  slug = "foundations"
  title = "Foundations: graphs and the ideas behind them"
  purpose = "The vocabulary of networks (nodes, ties, direction, degree, weights, the adjacency matrix, paths, components, density), worked by hand on tiny examples, and the sociological and psychological ideas behind network analysis: structure, balance, weak ties, structural holes, social capital, homophily, and the small world."
  prerequisites = "Introduction."
  first_section = "Nodes, ties and graphs"
  code_note = "count dyads, degrees, walks, distances and components of tiny networks, and test a small signed network for balance"

  [[part.chapter]]
  slug = "networks-as-data"
  title = "Networks as data"
  purpose = "Nodes, ties, directed and valued ties, attributes, bipartite and multilayer networks, and how each is stored."
  prerequisites = "Introduction."
  first_section = "Edge lists, adjacency matrices and attribute tables"
  code_note = "create a network from an edge list and an attribute table"

  [[part.chapter]]
  slug = "getting-started"
  title = "Getting started"
  purpose = "Install knappnet, load data in each language, and read a result together with how it was computed."
  prerequisites = "Networks as data."
  first_section = "Loading and inspecting a network"
  code_note = "load a bundled dataset and inspect its provenance"

[[part]]
title = "Describing networks"

  [[part.chapter]]
  slug = "visualization"
  title = "Visualization"
  purpose = "Layouts, encodings, and when a picture misleads."
  prerequisites = "Getting started."
  first_section = "From layout to picture"
  code_note = "draw a network with a stress layout"

  [[part.chapter]]
  slug = "centrality"
  title = "Centrality and prestige"
  purpose = "Degree, closeness, betweenness, eigenvector and related measures, and which question each answers."
  prerequisites = "Networks as data."
  first_section = "Degree and its relatives"
  code_note = "compute degree, closeness and betweenness"

  [[part.chapter]]
  slug = "paths-and-cohesion"
  title = "Paths, distance and cohesion"
  purpose = "Geodesics, components, density, reciprocity, transitivity, connectivity."
  prerequisites = "Centrality."
  first_section = "Distance and reachability"
  code_note = "compute geodesic distances and components"

  [[part.chapter]]
  slug = "triads-and-motifs"
  title = "Dyads, triads and motifs"
  purpose = "The smallest building blocks of structure: the dyad and triad census, reciprocity, transitivity and intransitivity, local motifs, and what over-represented patterns do and do not say."
  prerequisites = "Paths, distance and cohesion."
  first_section = "Counting the smallest patterns"
  code_note = "count dyad and triad types"

  [[part.chapter]]
  slug = "small-worlds"
  title = "Random graphs, small worlds and degree distributions"
  purpose = "What the typical network looks like: degree distributions, Erdos-Renyi and configuration models, small-world clustering with short paths, preferential attachment, and why these are baselines rather than explanations."
  prerequisites = "Paths, distance and cohesion."
  first_section = "What counts as typical"
  code_note = "compare a network with random baselines"

  [[part.chapter]]
  slug = "subgroups"
  title = "Subgroups and communities"
  purpose = "Cliques, k-cores, community detection and their disagreements."
  prerequisites = "Paths and cohesion."
  first_section = "Cliques and cores"
  code_note = "detect communities and compare partitions"

  [[part.chapter]]
  slug = "homophily"
  title = "Homophily, mixing and assortativity"
  purpose = "Why similar people connect: mixing matrices, the E-I index, assortativity, and separating choice from opportunity, with the statistical models to come."
  prerequisites = "Centrality and prestige."
  first_section = "Who ties to whom"
  code_note = "build a mixing matrix and compute assortativity"

  [[part.chapter]]
  slug = "positions-and-roles"
  title = "Positions and roles"
  purpose = "Structural, regular and automorphic equivalence; blockmodels."
  prerequisites = "Subgroups."
  first_section = "Equivalence"
  code_note = "compute structural equivalence and fit a blockmodel"

  [[part.chapter]]
  slug = "ego-networks"
  title = "Ego networks and structural holes"
  purpose = "Ego-centered data, constraint, effective size, brokerage."
  prerequisites = "Centrality."
  first_section = "Ego network measures"
  code_note = "extract ego networks and compute constraint"

[[part]]
title = "More complex networks"

  [[part.chapter]]
  slug = "two-mode"
  title = "Two-mode networks"
  purpose = "Ties between two kinds of nodes (people and events, authors and papers): incidence matrices, one-mode projections and what they lose, weighting, two-mode centrality and cohesion."
  prerequisites = "Networks as data, and Centrality and prestige."
  first_section = "People and the events they attend"
  code_note = "project a two-mode network"

  [[part.chapter]]
  slug = "multilayer"
  title = "Multiplex and multilayer networks"
  purpose = "Several kinds of tie among the same people: layers, overlap and redundancy, aggregation, layer-aware measures, and what flattening hides."
  prerequisites = "Networks as data, and Paths, distance and cohesion."
  first_section = "More than one kind of tie"
  code_note = "compare two layers of one network"

  [[part.chapter]]
  slug = "signed-and-valued"
  title = "Signed and valued networks"
  purpose = "Ties with sign and strength: structural balance and clusterability, status theory, weighted degree and strength, thresholding, and what negative ties change."
  prerequisites = "Networks as data, and Paths, distance and cohesion."
  first_section = "Positive and negative ties"
  code_note = "test a signed network for balance and compute weighted measures"

  [[part.chapter]]
  slug = "time"
  title = "Networks in time"
  purpose = "Four ways to think about time: snapshots, cumulative and windowed aggregation, event streams, and time-respecting paths; what each lets you ask and what it throws away."
  prerequisites = "Networks as data, and Paths, distance and cohesion."
  first_section = "Four ways to hold time"
  code_note = "build a temporal network and compute time-respecting paths"

  [[part.chapter]]
  slug = "space"
  title = "Networks in space"
  purpose = "Nodes with places: coordinates and projections, edge lengths and the distance decay of ties, flows, proximity networks, and why space must be controlled for before reading structure."
  prerequisites = "Networks as data, and Visualization."
  first_section = "When nodes have places"
  code_note = "attach coordinates and compute edge lengths"

[[part]]
title = "Modeling networks"

  [[part.chapter]]
  slug = "tests-and-null-models"
  title = "Permutation tests and null models"
  purpose = "Why ordinary tests fail on network data; QAP, conditional uniform draws, configuration models."
  prerequisites = "Describing networks."
  first_section = "Why independence fails"
  code_note = "run a QAP correlation test"

  [[part.chapter]]
  slug = "network-regression"
  title = "Network regression and autocorrelation"
  purpose = "Explaining ties and outcomes with networks: dyadic regression with QAP and MRQAP, network autocorrelation models, and the dependence they must respect."
  prerequisites = "Permutation tests and null models."
  first_section = "Regression when observations are not independent"
  code_note = "fit an MRQAP regression"

  [[part.chapter]]
  slug = "ergm"
  title = "Exponential random graph models"
  purpose = "Specifying, fitting and checking ERGMs."
  prerequisites = "Permutation tests and null models."
  first_section = "From statistics to a model"
  code_note = "specify and fit an ERGM"

  [[part.chapter]]
  slug = "latent-space"
  title = "Latent space and stochastic block models"
  purpose = "Embedding and block structure as statistical models."
  prerequisites = "Permutation tests and null models."
  first_section = "Distance in a latent space"
  code_note = "fit a latent space model"

  [[part.chapter]]
  slug = "dynamics"
  title = "Longitudinal and temporal networks"
  purpose = "Panel data, stochastic actor-oriented models, event data, temporal paths."
  prerequisites = "ERGM."
  first_section = "Networks that change"
  code_note = "build a temporal network and compute temporal paths"

  [[part.chapter]]
  slug = "diffusion"
  title = "Diffusion, influence and contagion"
  purpose = "How things spread over ties: simple and complex contagion, thresholds, epidemic models on networks, selection versus influence, and the identification problem."
  prerequisites = "Networks in time, and Network regression and autocorrelation."
  first_section = "Things that travel along ties"
  code_note = "simulate a contagion on a network"

  [[part.chapter]]
  slug = "prediction"
  title = "Link prediction and embeddings"
  purpose = "Predicting ties and learning representations: similarity scores, evaluation without leakage, node embeddings, and how prediction differs from explanation."
  prerequisites = "Latent space and stochastic block models."
  first_section = "Guessing the missing tie"
  code_note = "score candidate ties and evaluate"


[[part]]
title = "In practice"

  [[part.chapter]]
  slug = "collecting-data"
  title = "Collecting network data"
  purpose = "Boundaries, sampling, survey design, missing data, and ethics."
  prerequisites = "Networks as data."
  first_section = "Where the boundary is"
  code_note = "summarize missing ties"

  [[part.chapter]]
  slug = "reproducibility"
  title = "Reproducibility and scale"
  purpose = "Conventions that differ across tools, provenance, and working with large graphs."
  prerequisites = "Getting started."
  first_section = "The same measure, different answers"
  code_note = "reproduce another tool's convention with a preset"

  [[part.chapter]]
  slug = "reporting"
  title = "Reporting a network analysis"
  purpose = "Turning results into defensible claims: choosing and stating measures, stress checks, uncertainty, figures that do not mislead, and writing what the data can and cannot show."
  prerequisites = "Reproducibility and scale."
  first_section = "From output to claim"
  code_note = "draft a short results paragraph from computed output"


[[part]]
title = "Case studies"

  [[part.chapter]]
  slug = "case-florentine"
  title = "Case study: the Medici and the Florentine marriage network"
  purpose = "One question taken from data to a defensible claim: describe the network, compare four measures, test whether the Medici's position is unusual, stress-test it, and say what can and cannot be concluded."
  prerequisites = "Centrality and prestige, and Permutation tests and null models."
  first_section = "The question"
  code_note = "describe the Florentine network and check its data"

  [[part.chapter]]
  slug = "case-sampson"
  title = "Case study: the monastery, three waves of liking"
  purpose = "A real small group followed over time: describe each wave, track change, find the factions, use the signed relations, and say what holds up."
  prerequisites = "Subgroups and communities, Signed and valued networks, and Networks in time."
  first_section = "The question"
  code_note = "describe the three waves"

  [[part.chapter]]
  slug = "case-krackhardt"
  title = "Case study: an organization seen three ways"
  purpose = "Advice, friendship and reporting among 21 managers: structure, brokerage, layer overlap and a regression, and what an organization chart hides."
  prerequisites = "Ego networks, Multiplex and multilayer networks, and Network regression."
  first_section = "The question"
  code_note = "compare the three layers of the organization"

  [[part.chapter]]
  slug = "case-karate"
  title = "Case study: the karate club that split"
  purpose = "The most famous network split: how well do communities, centrality and a model recover the factions, and where do they fail?"
  prerequisites = "Subgroups and communities, and Latent space and stochastic block models."
  first_section = "The question"
  code_note = "detect communities and compare with the real split"


