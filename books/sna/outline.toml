# Social Network Analysis: outline. Edit here, then run
#   python3 tools/new_chapters.py books/sna
# Files are created only when missing, so written chapters are never touched.
# Fields per chapter: slug (file and anchor id), title, purpose, prerequisites,
# first_section (heading of the first worked section), code_note (what the
# placeholder will call).

[book]
title = "Social Network Analysis"
subtitle = "Methods in R, Python and JavaScript"
author = "Brendan Knapp"

[[part]]
title = "Foundations"

  [[part.chapter]]
  slug = "introduction"
  title = "Introduction"
  purpose = "What a network is, what questions network analysis answers, and how this book is organized."
  prerequisites = "None."
  first_section = "A first network"
  code_note = "build and print a five-node network"

  [[part.chapter]]
  slug = "networks-as-data"
  title = "Networks as data"
  purpose = "Nodes, ties, directed and valued ties, attributes, bipartite and multilayer networks, and how each is stored."
  prerequisites = "Introduction."
  first_section = "Edge lists, adjacency matrices and attribute tables"
  code_note = "create a network from an edge list and an attribute table"

  [[part.chapter]]
  slug = "getting-started"
  title = "Getting started"
  purpose = "Install knappnet, load data in each language, and read a result together with how it was computed."
  prerequisites = "Networks as data."
  first_section = "Loading and inspecting a network"
  code_note = "load a bundled dataset and inspect its provenance"

[[part]]
title = "Describing networks"

  [[part.chapter]]
  slug = "visualization"
  title = "Visualization"
  purpose = "Layouts, encodings, and when a picture misleads."
  prerequisites = "Getting started."
  first_section = "From layout to picture"
  code_note = "draw a network with a stress layout"

  [[part.chapter]]
  slug = "centrality"
  title = "Centrality and prestige"
  purpose = "Degree, closeness, betweenness, eigenvector and related measures, and which question each answers."
  prerequisites = "Networks as data."
  first_section = "Degree and its relatives"
  code_note = "compute degree, closeness and betweenness"

  [[part.chapter]]
  slug = "paths-and-cohesion"
  title = "Paths, distance and cohesion"
  purpose = "Geodesics, components, density, reciprocity, transitivity, connectivity."
  prerequisites = "Centrality."
  first_section = "Distance and reachability"
  code_note = "compute geodesic distances and components"

  [[part.chapter]]
  slug = "subgroups"
  title = "Subgroups and communities"
  purpose = "Cliques, k-cores, community detection and their disagreements."
  prerequisites = "Paths and cohesion."
  first_section = "Cliques and cores"
  code_note = "detect communities and compare partitions"

  [[part.chapter]]
  slug = "positions-and-roles"
  title = "Positions and roles"
  purpose = "Structural, regular and automorphic equivalence; blockmodels."
  prerequisites = "Subgroups."
  first_section = "Equivalence"
  code_note = "compute structural equivalence and fit a blockmodel"

  [[part.chapter]]
  slug = "ego-networks"
  title = "Ego networks and structural holes"
  purpose = "Ego-centered data, constraint, effective size, brokerage."
  prerequisites = "Centrality."
  first_section = "Ego network measures"
  code_note = "extract ego networks and compute constraint"

[[part]]
title = "Modeling networks"

  [[part.chapter]]
  slug = "tests-and-null-models"
  title = "Permutation tests and null models"
  purpose = "Why ordinary tests fail on network data; QAP, conditional uniform draws, configuration models."
  prerequisites = "Describing networks."
  first_section = "Why independence fails"
  code_note = "run a QAP correlation test"

  [[part.chapter]]
  slug = "ergm"
  title = "Exponential random graph models"
  purpose = "Specifying, fitting and checking ERGMs."
  prerequisites = "Permutation tests and null models."
  first_section = "From statistics to a model"
  code_note = "specify and fit an ERGM"

  [[part.chapter]]
  slug = "latent-space"
  title = "Latent space and stochastic block models"
  purpose = "Embedding and block structure as statistical models."
  prerequisites = "Permutation tests and null models."
  first_section = "Distance in a latent space"
  code_note = "fit a latent space model"

  [[part.chapter]]
  slug = "dynamics"
  title = "Longitudinal and temporal networks"
  purpose = "Panel data, stochastic actor-oriented models, event data, temporal paths."
  prerequisites = "ERGM."
  first_section = "Networks that change"
  code_note = "build a temporal network and compute temporal paths"

  [[part.chapter]]
  slug = "multilayer"
  title = "Bipartite and multilayer networks"
  purpose = "Two-mode data, projections, layers and their pitfalls."
  prerequisites = "Networks as data."
  first_section = "Two-mode data"
  code_note = "project a two-mode network"

[[part]]
