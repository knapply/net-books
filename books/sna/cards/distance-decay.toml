id = "distance-decay"
title = "Distance decay of ties"
kind = "measure"
chapter = "space"
summary = "The share of all possible pairs that are tied, by band of distance between the pair."
answers = "How quickly does the chance that two nodes are tied fall as the distance between them grows?"

data_requirements = [
  "A network and a location for every node, so that the distance of every possible pair can be computed, tied or not.",
  "Enough pairs in each distance band for a share to mean something; bands with few pairs give shares that jump.",
  "A study region whose edge does not cut many ties, or else say how many it cuts.",
]

assumptions = [
  "The probability of a tie depends mostly on the distance between the pair, and not on the sizes of the two nodes.",
  "The chosen bands are wide enough to be stable and narrow enough to show the shape; 500 km on the country borders is a convenience, not a law.",
  "Pairs are not independent: the same node sits in many pairs, so counts of pairs overstate how much information the curve holds.",
]

readings = [
  { context = "Land borders between countries", high = "66% of the 149 pairs closer than 500 km share a border, against about one in a thousand beyond 3,000 km.", low = "The 3,000 km and beyond band is not zero (11 pairs), because label points of huge countries are far from their borders." },
  { context = "Marriage or alliance network in one town", high = "A steep fall says marriages were mostly between nearby families.", low = "A flat curve says distance mattered little inside the town, not that people did not care about nearness." },
  { context = "Office or building", high = "A steep fall says people talk to those who sit near them.", low = "It does not show that sitting near causes talking when seating follows teams." },
  { context = "Transport or supply network", high = "A steep fall is the cost of building and running long links.", low = "A heavy tail of long ties points to a few hubs or special links that pay for the distance." },
  { context = "Online platform", high = "A steep fall says ties are mostly local, which fits real-world contact.", low = "A flat curve may mean the platform connects people regardless of place, or that locations are poor." },
]

pitfalls = [
  "Plotting a histogram of tie lengths instead of the share of pairs: there are far more far pairs than close ones, so counts hide the decay (100 ties in 500 to 1,000 km against 98 in 0 to 500 km, with a rate half as large).",
  "Choosing bands so narrow that some hold a handful of pairs.",
  "Ignoring the study boundary: cutting the region removes ties that leave it and flattens the curve near the edge.",
  "Fitting an exponential or power-law form by eye. The two differ in the tail, and a handful of long ties can decide which fits.",
]

checks = [
  "Report the number of pairs and the number of ties in each band, not only the share.",
  "Redo the table with different band widths and with the bands shifted.",
  "Drop a random tenth of the ties and see whether the shape changes.",
  "Compare with a null that keeps the tie-length profile (see spatial-checks) before crediting structure.",
]

do_not_claim = [
  "That a steep decay shows that people prefer nearby partners.",
  "That the decay is the same for every kind of tie in the network.",
  "That a fitted exponent is a law.",
]

report_template = "Among {pairs} pairs of {node_type}, the share tied falls from {near_share} when the pair is under {near_km} to {far_share} beyond {far_km} ({band_width} bands, distance as {distance_kind}). The curve describes where ties are; it does not show whether nearness, cost or opportunity produces it."

related = ["tie-length", "gravity-model", "spatial-checks", "latent-space-model"]
sources = ["barthelemy2011spatial", "gastner2006spatial"]

[knappnet]
rust = "knappnet::spatial::find_pairs_within_distance"
r = "net_proximity(); net_distance_decay()"
python = "not in knappnet; the chapter computes pairwise distances with numpy"
