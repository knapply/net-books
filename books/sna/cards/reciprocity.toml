id = "reciprocity"
title = "Reciprocity (the share of ties that are returned)"
kind = "measure"
chapter = "foundations"
summary = "In a directed network, the share of ties that have a tie back: 2M / (2M + A), where M is the number of mutual pairs and A the number of asymmetric pairs. Other definitions are in use."
answers = "When one person directs a tie to another, how often does the other direct one back?"

data_requirements = [
  "Directed ties. In an undirected network every tie is mutual and reciprocity is not defined as a question.",
  "A tie that means the same thing in both directions. Asking for advice and giving advice are different acts, so a return tie is not necessarily 'the same' tie.",
  "A known boundary. A tie to someone outside the group studied cannot be returned within the data.",
  "A stated convention for loops and repeated ties, and for which of the several definitions of reciprocity is meant.",
]

assumptions = [
  "Missing ties are missing at random with respect to direction. If one direction was collected more carefully (for example only some people were interviewed), the share returned is biased downward.",
  "In fixed-choice designs (each person names at most k others) a low value can follow from the cap, not from the people.",
  "The share is read against the density. With a density of 0.35, about 35% of ties would be returned if ties were placed at random, so a value near 0.35 is not evidence of mutuality.",
]

readings = [
  { context = "Friendship nominations", high = "Friendship is usually mutual, so a high value is expected. It is a sign that the data are consistent, not an interesting finding.", low = "People name friends who do not name them, or the data came from separate surveys with limits on how many to name. Check the design before the social story." },
  { context = "Advice or help in an organization", high = "Advice flows both ways, as among peers. It does not show trust.", low = "Normal and often a sign of hierarchy or expertise: people go to those who know more. It does not by itself show a rigid structure." },
  { context = "Follows on an online platform", high = "Mutual follows, as among friends or a community. Could also be follow-back conventions.", low = "The normal case: following obliges nobody. Large accounts are followed by many and follow few." },
  { context = "Trade, supply or traffic flows", high = "Goods or traffic move both ways between places.", low = "One-way flows, such as raw materials toward factories. Reciprocity of presence is not reciprocity of volume." },
]

pitfalls = [
  "Reporting a value without the density. Reciprocity of 0.29 in a network of density 0.35 is not above chance.",
  "Mixing definitions. On the five-person advice network the default share of ties returned is 0.286, the ratio of mutual pairs to non-empty pairs is 0.167, the dyadic version (mutual or null pairs) is 0.500, and the correlation that corrects for density is -0.099.",
  "Comparing networks of different densities by the raw share, since a dense network returns more ties by chance.",
  "Reading reciprocity as trust or equality. It says only that the relation points back.",
  "Counting repeated ties between the same pair as extra returns.",
]

checks = [
  "Report the dyad counts (mutual, asymmetric, null) next to the share; the counts show what the share is made of.",
  "Compare with the density, or with a null model that keeps the density or the degrees (see the null-models-choice card).",
  "Check that both directions were collected in the same way.",
  "Recompute under a second definition and report whether the story changes.",
  "Drop a random tenth of the ties several times and see how much the value moves, which is a lot in a small network.",
]

do_not_claim = [
  "That a high reciprocity shows trust, friendship or equality.",
  "That a low reciprocity shows hierarchy or exploitation, without evidence about what the ties mean.",
  "That reciprocity values from networks with different densities or definitions can be compared directly.",
  "That reciprocity in a small network, such as five people, is a stable estimate of a tendency.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, {mutual} pairs are mutual, {asymmetric} are asymmetric and {null} are null; {returned} of the {m} ties are returned (reciprocity {value}, definition: {definition}). The density is {density}, so about {expected} would be returned if ties were placed at random. Reciprocity says whether ties point back, not how strong or trusted they are."

related = ["density", "degree", "triad-census", "null-models-choice", "symmetrization"]
sources = ["wasserman1994social", "holland1970method", "garlaschelli2004patterns"]

[knappnet]
rust = "compute_reciprocity(&g, ReciprocityMode::Default)  // also Ratio, Dyadic, Correlation"
r = "net_reciprocity(g, mode = \"default\")  # or \"ratio\", \"dyadic\", \"correlation\""
python = "networkx.reciprocity(G)  # the share of ties returned"
