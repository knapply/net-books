id = "visual-encoding"
title = "Encoding in a network picture"
kind = "procedure"
chapter = "visualization"
summary = "Give each visual channel (size, shape, colour, line width) one meaning, state it in a legend, scale area to the quantity, and make the picture survive greyscale."
answers = "How should degree, group and tie strength be drawn so the picture says what the data says and nothing more?"

data_requirements = [
  "A node table with the quantity to draw (such as degree) and the category to draw (such as group).",
  "A tie table with the strength to draw, if any, and a note on its unit.",
  "A decision about which node or two the argument is about, so only those are labelled.",
]

assumptions = [
  "Readers judge area, not radius, when they compare circles. Size should therefore be scaled so that area is proportional to the quantity.",
  "A reader may see the picture in greyscale or have a colour vision difference, so colour must not be the only carrier of a category.",
  "Each channel carries one idea throughout the picture and the book or report that contains it.",
]

readings = [
  { context = "Node size for degree", high = "With area proportional to degree, a node twice as large has twice the ties. In the karate club degree runs from 1 to 17, and sqrt scaling shows that 17 to 1 in area.", low = "With radius proportional to degree the same node covers 289 times the area of the smallest, which says the hub matters far more than the count of ties does." },
  { context = "Group as shape and colour", high = "Two groups drawn as blue circles and orange squares can be told apart in print and by readers with colour vision differences.", low = "Two groups drawn as two similar colours of the same shape cannot." },
  { context = "Line width for tie strength", high = "Width proportional to a count (karate contexts from 1 to 7) lets a reader see which ties are strongest, provided the legend gives the units.", low = "Width that also stands for something else (direction, type) reads as strength whether you meant it or not." },
]

pitfalls = [
  "Scaling radius by the quantity, which exaggerates large values by the square of the ratio.",
  "Using size for one idea and the same size for another in the next figure.",
  "Colour as the only cue for a category, or a rainbow for a number.",
  "Labelling every node until the picture cannot be read, or labelling no one so the reader cannot check your claim.",
  "Publishing a picture of named people without thinking about who will see it.",
]

checks = [
  "Convert the figure to greyscale and ask whether every category can still be told apart.",
  "Compute the ratio of the largest area to the smallest and compare it with the ratio of the quantity.",
  "List every channel in use and write the one idea it carries; two ideas on one channel is a defect.",
  "Show the legend to someone who has not seen the data and ask them to read one node.",
]

do_not_claim = [
  "That a big node is important in any sense other than the quantity the size encodes.",
  "That line width tells the reader about anything but the quantity it was scaled to.",
  "That colour differences are a statistical result; they only show the categories you supplied.",
]

report_template = "In the figure, node area shows {quantity} and shape and colour show {group}. Line width shows {tie_strength} ({unit}). Only {labelled} are labelled. The figure was checked in greyscale."

related = ["layout-quality", "layout-stability", "network-data-ethics"]
sources = ["okabe2008color", "moreno1934who", "freeman2004development"]

[knappnet]
rust = "Compute the degree and strength with compute_degree and compute_strength, then scale in your own drawing code (the engine places nodes; it does not draw)"
r = "net_degree(g) and net_strength(g) for the quantities; the plot method of a net_frame draws the picture"
python = "dict(G.degree()) for the quantity and matplotlib or nx.draw with node_size proportional to the quantity"
