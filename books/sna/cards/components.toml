id = "components"
title = "Components (weak and strong)"
kind = "measure"
chapter = "paths-and-cohesion"
summary = "The groups of nodes that can reach each other: connected components in an undirected network, weak and strong components in a directed one."
answers = "Is everyone in one piece, and if not, how many pieces are there and how big?"

data_requirements = [
  "The full list of nodes, including people with no ties. Isolates are components of size one and must be in the node list to be counted.",
  "A decision on direction for directed data. Weak components ignore arrowheads; strong components follow them.",
  "A known boundary. A survey or sample that stops at the edge of a team creates components that may not exist in the world.",
]

assumptions = [
  "A tie is a route that can be used in either direction (undirected) or the direction of the arrow (strong components).",
  "The recorded ties are complete enough that missing ties do not create the gaps.",
]

readings = [
  { context = "Marriage or alliance network among families", high = "Many components: separate blocs with no marriage between them. It does not show that they never dealt with each other another way.", low = "One component: every family can be reached through some chain of marriages." },
  { context = "Communication inside an organization", high = "Many components: groups that never exchange messages in the data, such as departments or a sample that missed cross-team ties.", low = "One component: no isolated groups. Whether information crosses depends on the ties' strength and use." },
  { context = "Supply or transport network", high = "Parts of the network cannot reach each other, so some demands cannot be met.", low = "Everything is reachable. Capacity and distance still matter." },
  { context = "Directed network (advice, follows, reporting lines)", high = "Many strong components: arrows lead out but not back, as in a hierarchy; Krackhardt's reporting chart has 21 strong components for 21 managers.", low = "One strong component: everyone can reach everyone by following arrows. Krackhardt's advice network is like this." },
]

pitfalls = [
  "Computing distances or averages across pieces. They are undefined, and software that averages over reachable pairs can make a network with more pieces look closer.",
  "Forgetting the isolates. A roster with 200 people nobody named has 200 extra components.",
  "Using weak components for a question about following arrows, or the reverse. In Krackhardt's friendship network the weak count is 1 and the strong count is 3.",
  "Treating a gap as a finding when it may come from how the data were collected.",
]

checks = [
  "Report the number of components, their sizes and the share of people in the largest one.",
  "For directed data report both weak and strong components.",
  "Ask where each small component came from and whether a missing tie or a boundary decision explains it.",
  "Rerun the analysis inside the largest component and say how many people were left out.",
]

do_not_claim = [
  "That separate components never interact. Only that the recorded ties do not join them.",
  "That the largest component is the whole network, when other components exist.",
  "That a strong-component split means the people are socially isolated; it says who can be reached by following arrows.",
]

report_template = "The {tie_meaning} network of {n} {node_type} has {weak} weak and {strong} strong component(s). The largest has {largest} people ({share} of the network); {isolates} person(s) have no ties. Gaps between components may come from {data_explanation}."

related = ["geodesic-distance", "connectivity", "density"]
sources = ["wasserman1994social", "harary1969graph"]

[knappnet]
rust = "find_components(&g, ComponentKind::Weak); find_components(&g, ComponentKind::Strong)"
r = "net_components(g, mode = \"weak\"); net_components(g, mode = \"strong\")"
python = "networkx.connected_components, networkx.weakly_connected_components, networkx.strongly_connected_components"
