id = "effective-size"
title = "Effective size and efficiency"
kind = "measure"
chapter = "ego-networks"
summary = "The number of a person's contacts after subtracting the redundancy among them; efficiency is that number as a share of the contacts."
answers = "How many separate sources of news or help does this person have, counting contacts who know each other as one?"

data_requirements = [
  "Ties that carry news, help or influence between people.",
  "The ties among a person's contacts must be recorded. Effective size for unweighted, undirected ties needs only the number of contacts n and the number of ties t among them, so an ego survey that asked which contacts know each other is enough.",
  "At least one contact. With none the value is undefined (NaN).",
  "In directed data, say how arcs become ties. With weights the identity n - 2t/n no longer holds and each contact's ties are read relative to that contact's strongest tie.",
]

assumptions = [
  "Every tie among contacts makes both contacts redundant to the same degree, unless strengths are given.",
  "A tie among contacts that was not recorded is read as 'they do not know each other', which raises effective size.",
  "The contacts counted are all the contacts that matter. A size limit in a survey caps effective size at that limit.",
]

readings = [
  { context = "Office, who asks whom for help", high = "Many contacts who do not know each other: several separate sources. Not a sign that the contacts are useful.", low = "Contacts form one circle, so most of what the person hears is the same news." },
  { context = "Online platform, who replies to whom", high = "Repliers from separate communities. Also true of a public account that people do not talk to each other about.", low = "Repliers who also reply to each other: a community." },
  { context = "Neighborhood, who helps whom", high = "Help and news come from groups that do not overlap.", low = "Help comes from one close set of neighbors." },
]

pitfalls = [
  "Reading effective size as degree. It equals the number of contacts only when no two contacts are tied; Dev, with six contacts, has 3.333 in the chapter's friendship network.",
  "Comparing raw effective size between people with very different numbers of contacts. Efficiency (effective size divided by contacts) removes size but then rewards having very few contacts: a person with one contact has efficiency 1.",
  "Assuming effective size and constraint rank people the same way. In the friendship network Dev has the largest effective size and Hana the lowest constraint.",
  "Using an ego survey with a name cap without saying so. With a cap of 5, nobody can score above 5, and in the managers' friendship network 15 of 21 would be truncated.",
  "Mixing conventions. Weighted and directed versions differ between programs; check a small example by hand.",
]

checks = [
  "Compute n - 2t/n by hand for two or three people and compare with the program.",
  "Recompute after dropping each contact in turn and after dropping a few percent of ties among contacts, which are the ties people are least sure about.",
  "Compare with the number of contacts and with constraint.",
  "Compare with random networks that keep every node's number of contacts.",
]

do_not_claim = [
  "That a larger effective size means better performance or more influence.",
  "That the number of non-redundant contacts is the number of different groups the person belongs to.",
  "That an effective size from a capped name generator describes the person's whole network.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, {node} has {contacts} contacts and an effective size of {value} (efficiency {efficiency}), so about {value} of the contacts bring something the others do not. This counts redundancy among recorded contacts; it does not show whether the contacts are useful. {cap_note}"

related = ["constraint", "degree", "density", "brokerage-roles"]
sources = ["burt1992structural", "borgatti1997structural", "burt2004structural", "perry2018egocentric"]

[knappnet]
rust = "compute_effective_size(&graph, StructuralHoleOptions::default())"
r = "net_effective_size(g)"
python = "networkx.effective_size(G)"
