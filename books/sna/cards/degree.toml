id = "degree"
title = "Degree centrality (in-degree and out-degree)"
kind = "measure"
chapter = "centrality"
summary = "The number of ties a node has; in a directed network, the number it sends (out) and the number it receives (in)."
answers = "Who has the most direct contacts, and in a directed network, who reaches out the most and who is sought out the most?"

data_requirements = [
  "A tie must mean the same thing for every pair. Counting ties only makes sense if they are comparable events or relationships.",
  "Say whether the network is directed. In a directed network report in-degree and out-degree separately; a single total mixes sending and receiving.",
  "If ties carry weights, say whether you are counting ties (degree) or summing weights (strength). They can order people differently.",
  "Self-loops and repeated ties must be stated: some tools count a loop as two ends, some as one, some ignore it.",
]

assumptions = [
  "Every tie counts the same. A close friend and a nodding acquaintance each add one.",
  "The boundary of the data is right. A person near the edge of what you collected has a degree that reflects the edge of the survey as much as their life.",
  "In a fixed-choice design (each person names at most three) out-degree is set by the question, and only in-degree varies.",
  "Ties are recorded about equally well for everyone. If some people were interviewed and others only named, the interviewed people have higher out-degree by design.",
]

readings = [
  { context = "Marriage or alliance network among families", high = "Many partners: wide access, and many obligations. It does not say the partners were powerful.", low = "Few partners. A family with one marriage may still depend on a very useful one." },
  { context = "Communication network inside an organization", high = "Talks to many people: well informed, or just chatty. For in-degree: sought out by many.", low = "Few contacts. Possibly a specialist, or someone whose ties were not recorded." },
  { context = "Transport, supply or infrastructure network", high = "A busy node with many connections in and out. Often a hub, and a place where disruption spreads to many.", low = "A terminal or a spur with few connections." },
  { context = "Online platform (follows, replies, mentions)", high = "A popular or very active account; with in-degree, widely followed or replied to. Could be a bot or an organization.", low = "A typical, quiet or new account." },
]

pitfalls = [
  "Comparing raw degrees across networks of different size. Divide by n - 1 or compare ranks, and say which.",
  "Reading in-degree as activity or out-degree as prestige. In a directed network they describe opposite things.",
  "Treating degree as influence. It counts contacts, not what they do or who they are.",
  "Treating tied degrees as an ordering. In small networks many people share a value.",
  "Ignoring the handshake check: in an undirected network the degrees must add up to twice the number of ties. A total that is odd means a data error.",
]

checks = [
  "Check that the degrees add up to twice the number of ties (undirected) or that in-degrees and out-degrees each add up to the number of ties (directed).",
  "Look at the distribution, not only the maximum. A few very high degrees with a long tail of low ones is a different network from an even spread (see the degree-distribution card).",
  "Compare with strength if ties have weights. A large gap between the two orders means a few heavy ties or many light ones are doing the work.",
  "Drop a random tenth of the ties several times and see whether the top people stay on top. Degree is usually the most stable of the common measures, but check.",
  "Compare with closeness and betweenness. High degree with low betweenness is a well-liked person inside one group; low degree with high betweenness is a bridge.",
]

do_not_claim = [
  "That a high-degree node is powerful, influential or well liked, without evidence about what the ties do.",
  "That a low-degree node is unimportant or isolated from the network's real structure.",
  "That raw degrees from networks of different size or density can be compared.",
  "A precise ranking among nodes whose degrees are equal or differ by one.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, {node} has {direction} degree {value} ({share} of the {n_minus_1} possible; rank {rank} of {n}). Degree counts direct contacts and says nothing about who they are. The top place is {stable_or_not} when {perturbation}."

related = ["weighted-degree", "degree-distribution", "closeness", "betweenness"]
sources = ["freeman1978centrality", "wasserman1994social", "opsahl2010node", "newman2018networks"]

[knappnet]
rust = "compute_degree(&graph, DegreeMode::All, true)  // DegreeMode::In or Out for directed networks"
r = "net_degree(g, mode = \"all\")  # or \"in\", \"out\"; net_strength(g) for weighted degree"
python = "dict(G.degree()); G.in_degree(); G.out_degree()"
