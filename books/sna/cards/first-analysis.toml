id = "first-analysis"
title = "A first analysis: load, describe, compute, stress-test, write"
kind = "procedure"
chapter = "getting-started"
summary = "A five-step routine for any new network, in which every step has a check that can fail."
answers = "How do I go from a file to a statement about a network that I can defend?"

data_requirements = [
  "A tie table and, where possible, a roster of nodes that includes people with no ties.",
  "A statement of what a tie means and whether it is directed, taken from the data's documentation.",
  "Counts you can verify elsewhere: how many nodes and ties the source reports.",
]

assumptions = [
  "The counts in the documentation are right. If they are not, the check says so and that is information too.",
  "A stress test that deletes ties at random is a useful stand-in for missing ties. Real missingness is rarely random.",
  "One or two measures with a plain-language meaning are enough for a first look.",
]

readings = [
  { context = "Advice among 21 managers (190 ties)", high = "Density 0.452 and one strong piece: a dense network in which everyone can reach everyone, so measures that need long distances will not separate people much.", low = "A sparse network with many pieces would make routes, not counts, the first thing to understand." },
  { context = "Marriage or alliance network", high = "Few ties and one piece: routes matter, and the missing records matter more than in a dense network.", low = "Several pieces: say how many people are outside the giant piece before comparing anyone." },
  { context = "Supply or transport network", high = "A directed network with one weak and many strong pieces: following the arrows strands nodes.", low = "One strong piece means every node can reach every other along directed routes." },
  { context = "Online platform", high = "Hundreds of thousands of ties: describe by distribution, not by listing nodes.", low = "A small sample of a large platform needs a statement of how it was drawn before anything is described." },
]

pitfalls = [
  "Skipping the describe step and finding out the network has 22 nodes only after interpreting the output.",
  "Reporting the top of a list with no statement of how stable it is.",
  "Computing many measures and reporting the one that tells the best story.",
  "Letting the tool's defaults decide direction, normalization and loops.",
]

checks = [
  "Compare node and tie counts with the source, and the sum of in-degrees with the sum of out-degrees.",
  "Print the description (density, returned share, pieces, loops, repeated ties) and read it before computing anything else.",
  "Compare the two or three lists a first analysis produces. In the managers' network the rank correlation between being asked and being on routes was 0.388 and between being asked and asking was -0.339, so no single number summarizes importance.",
  "Delete a tenth of the ties at random 200 times and report how often the top of each list survives (0.500 for the three most asked, 0.715 for the three on most routes).",
]

do_not_claim = [
  "That a list of the top scorers identifies the important people.",
  "That the result describes what happened, rather than what was reported.",
  "That a stable top three under random deletion is stable under the kind of missingness the survey really had.",
]

report_template = "We loaded {n} {node_type} and {m} ties from {source}, matching the documented counts. The network is {directed_or_not} with density {density} and {pieces} connected pieces. {measure} is highest for {top}; the same top is kept in {stable_share} of {draws} draws that delete {drop_share} of the ties. This describes {what_it_describes} and does not show {what_it_does_not}."

related = ["reading-a-result", "tie-deletion-stress-test", "tidy-network-data", "degree", "betweenness"]
sources = ["krackhardt1987cognitive", "wasserman1994social", "freeman1977set"]

[knappnet]
rust = "Graph::from_edges, then describe(), compute_degree and compute_betweenness; compare with the documented counts"
r = "net_frame(edges, nodes = roster, directed = TRUE), then net_density(), net_reciprocity(), net_components(), net_degree(), net_betweenness()"
python = "nx.DiGraph with all roster nodes added first, then nx.density, nx.reciprocity, nx.in_degree, nx.betweenness_centrality(normalized=False)"
