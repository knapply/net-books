id = "contagion"
title = "Simple and complex contagion (threshold models)"
kind = "model"
chapter = "diffusion"
summary = "A simulation model in which something spreads along ties either by chance per contact (simple contagion) or only once enough of a person's contacts have adopted it (complex contagion, a threshold rule)."
answers = "Given who is tied to whom, who starts it and how people respond to exposure, how far and how fast would a behavior or infection spread?"

data_requirements = [
  "A contact network whose ties mean exposure or influence opportunity.",
  "A stated rule: a chance per exposure, or a threshold on the number or share of adopting contacts.",
  "A stated seed rule and a number of simulated runs large enough to report a mean and an interval.",
]

assumptions = [
  "Everyone follows the same rule, or the differences are modeled explicitly (for example a distribution of thresholds).",
  "Ties are fixed during the spread and are the channels along which it travels.",
  "The rule parameters (transmission chance or thresholds) are assumed or taken from other evidence; this chapter's simulations do not estimate them from data.",
  "Adoption is determined by exposure to contacts, not by outside events.",
]

readings = [
  { context = "Simple contagion (one exposure can be enough), such as infection or news", high = "Fast spread on a network with shortcuts and hubs; redundant clustered ties add little.", low = "Slow or local spread on a ring-like or clustered network with few shortcuts." },
  { context = "Complex contagion (several exposures needed), such as adopting a costly or risky behavior", high = "Spread is more likely where neighborhoods overlap, so that one adopter and a shared neighbor give two exposures; clustered ties help.", low = "Random shortcuts deliver single exposures and can leave it stuck; the outcome is often all or nothing." },
  { context = "Threshold distribution", high = "A few very low thresholds and a smooth ladder of others can allow a cascade.", low = "A small change in one threshold can stop a cascade that would otherwise be complete." },
  { context = "Seed choice", high = "Seeding a well-connected person speeds simple contagion in the simulations of this chapter.", low = "Seeding a peripheral person is slower and much less predictable." },
]

pitfalls = [
  "Reading simulated outcomes as findings about real people when the rule and the parameters were chosen by the analyst.",
  "Reporting a single run, or only the mean, when outcomes can be all or nothing.",
  "Assuming the pattern (clustering helps complex contagion, shortcuts help simple) holds at every threshold and degree; the effect depends on both numbers.",
  "Treating recorded friendships as exposure ties.",
  "Comparing random numbers from different languages run for run; compare summaries over many runs.",
]

checks = [
  "Check the simulator against a case you can compute by hand, such as the expected number of new cases in one step from a known seed.",
  "Repeat with many runs and report the mean and the interval of runs, with the random seed.",
  "Vary the transmission chance or threshold, the seed rule, and drop some ties at random, to see which conclusions survive.",
  "Compare with a network that keeps the degrees but removes clustering, so that the role of clustering is isolated.",
]

do_not_claim = [
  "That a behavior in real data spreads by contagion because a contagion model can reproduce a similar curve.",
  "That the simulated outcome would occur in the real network; it follows from the assumed rule.",
  "That clustering always helps or always hurts spread without naming the type of contagion.",
  "That seeding the highest-degree person is the best strategy in general.",
]

report_template = "We simulated {rule} on a network of {n} {node_type} and {m} ties ({network_source}), seeded by {seed_rule}, for {runs} runs (random seed {random_seed}). The mean final share reached was {mean} with the middle 95 percent of runs between {low} and {high}; the mean steps to reach half were {steps_to_half}. The ties and the seeds are as stated; the spread is simulated under the stated rule and parameters, so these figures describe the rule on these ties and not an observed outbreak."

related = ["epidemic-threshold", "influence-vs-selection", "clustering", "small-world"]
sources = ["granovetter1978threshold", "watts2002simple", "centola2007complex", "centola2010spread", "kermack1927contribution"]

[knappnet]
rust = "none (knappnet has no diffusion functions; hand-written spread() in the chapter)"
r = "none (hand-written spread() in the chapter, with purrr::accumulate over steps)"
python = "none (hand-written spread() in the chapter, with numpy)"
