id = "boundary-specification"
title = "Boundary specification"
kind = "procedure"
chapter = "collecting-data"
summary = "The rule that decides who is in the data; every measure computed afterwards is a statement about the people inside that rule."
answers = "Who counts as part of this network, and what happens to the numbers for people near the edge of that rule?"

data_requirements = [
  "A written rule for membership (a list, an organization chart, a time window, a hashtag) and the date it was applied.",
  "A written rule for which ties count, with the time window and the kind of contact.",
  "If possible, the number of ties that cross the boundary (from a survey item or a wider source).",
]

assumptions = [
  "The boundary matches the question. A boundary drawn around the very groups being compared builds part of the answer into the data.",
  "Ties to people outside the boundary are not needed for the question. If they are, the data cannot answer it.",
  "The boundary was applied the same way to everyone, so that people near the edge were not treated differently.",
]

readings = [
  { context = "Organization (everyone on the payroll)", high = "A clean, well-defined list. Ties to customers, suppliers and former staff are still missing.", low = "A loose list (a mailing list, a project channel) means some real members are out and some outsiders are in." },
  { context = "Online platform (everyone who used a hashtag)", high = "A large boundary set by behavior. Members who talk but do not tag are out, so the edge is wherever the tag stops.", low = "A small boundary can hold mostly the most active users." },
  { context = "Community or family network (a survey of one neighborhood)", high = "A boundary set by geography. Ties to people who live elsewhere are cut, and they are often the bridging ones.", low = "A very local boundary can make everyone look more clustered than they are." },
  { context = "Supply or transport network (one region or one company)", high = "Flows that cross the border look like dead ends; a hub near the border looks smaller than it is.", low = "A wide boundary can include nodes that do not interact with the question at all." },
]

pitfalls = [
  "Comparing density or clustering across data sets that have different boundaries.",
  "Treating a person near the boundary as a peripheral person, when the boundary may be what made them peripheral.",
  "Cutting the network along the groups being compared and then reporting that groups are cohesive.",
  "Not recording the rule, so a later reader cannot tell who was left out.",
]

checks = [
  "Count the ties that cross the boundary and report the share of each person's ties they remove.",
  "Compute the measures for the people inside with and without the cut-off ties, and report the rank correlation.",
  "Widen the boundary by one step (the contacts of the people inside) and see which results change.",
  "Compare with a boundary drawn another reasonable way and say which findings survive both.",
]

do_not_claim = [
  "That a measure for a person at the edge describes their real position.",
  "That the network is a whole network when its edges were set by a convenience rule.",
  "That densities or centralizations are comparable across studies without comparing boundaries.",
]

report_template = "The network covers {members} {node_type}, defined as {membership_rule}, with ties meaning {tie_rule} during {window}. About {cut_share} of the ties the {node_type} named lead outside this boundary and are not in the data. Measures for {edge_group} should be read as lower bounds."

related = ["snowball-sampling", "missing-data-checks", "density"]
sources = ["marsden1990network", "wasserman1994social", "kossinets2006effects"]

[knappnet]
rust = "Graph::from_edges on the kept people; count the dropped ties from the edge list"
r = "net_subnetwork(g, ids) keeps the people inside the boundary; compare net_degree() before and after"
python = "G.subgraph(nodes), then compare dict(G.degree()) before and after"
