id = "burstiness"
title = "Burstiness and memory of waiting times"
kind = "measure"
chapter = "time"
summary = "Burstiness B compares the spread of the waiting times between events with their mean, from -1 for a perfect metronome through about 0 for random timing to near +1 for clumps with long silences; memory M is the correlation between one gap and the next."
answers = "Do events arrive evenly, randomly or in flurries separated by silences, and does a short wait tend to be followed by another short wait?"

data_requirements = [
  "A list of event times for one person, one pair or one whole stream, in order.",
  "Enough events: with few events B is noisy and cannot reach its upper limit.",
  "Times fine enough that gaps are not mostly zero.",
]

assumptions = [
  "The gaps come from one process; mixing people or pairs with different rates in one stream changes B.",
  "The record is observed from start to end without holes (a server outage looks like a long gap).",
  "Clock rhythms such as nights and weekends are either part of what you want to measure or have been removed.",
]

readings = [
  { context = "Messages in an office", high = "Work comes in flurries with long quiet stretches; speed inside a flurry and slowness across silences both follow.", low = "Steady, metronome-like sending, as with scheduled or automated messages." },
  { context = "Contacts in an outbreak study", high = "Contacts are clumped, which can change how fast something spreads compared with evenly spaced contacts.", low = "Contacts spread evenly across the study period." },
  { context = "Online posting", high = "Sessions of activity separated by long absences; a daily rhythm alone can produce this.", low = "Posting spread evenly, often a sign of scheduling or automation." },
]

pitfalls = [
  "Comparing B across people or pairs with very different numbers of events: in the chapter's log B read 0.15 on the first 5 gaps and 0.27 on all 79.",
  "Reading B near 0 as proof that events are random.",
  "Reading B as a trait of a person when everyone shares the same quiet hours.",
  "Computing B on a very short record and ranking people by it.",
  "Mixing the gaps of several pairs or people into one list.",
]

checks = [
  "Recompute B on the first and second half of the record and on subsets with equal numbers of events.",
  "Compare with a stream of the same length and mean gap that is evenly spaced (B of -1) and with a random shuffle of gap order.",
  "Remove the known daily or weekly rhythm (for example by measuring in active hours only) and recompute.",
  "Report the number of events behind every B.",
]

do_not_claim = [
  "That a person is bursty by nature, when the rhythm of the day or the number of events can explain B.",
  "That bursty contacts speed up or slow down spreading without checking it on the network.",
  "That two B values from records of different sizes are comparable.",
]

report_template = "The {n_events} {events} of {unit} had burstiness B = {b} and memory M = {m} (mean gap {mean_gap} {time_unit}, longest gap {longest_gap}). On the first {k} gaps alone B was {b_short}. This describes the timing of recorded events and does not explain it."

related = ["temporal-reach", "temporal-aggregation", "rem"]
sources = ["goh2008burstiness", "kim2016measuring", "holme2012temporal"]

[knappnet]
rust = "knappnet::temporal::events::compute_burstiness_memory(&gaps) returns (burstiness, memory)"
r = "net_burstiness(g): burstiness and memory of the contact stream"
python = "none in NetworkX; the chapter computes B and M with numpy (burstiness_memory)"
