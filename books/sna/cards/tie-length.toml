id = "tie-length"
title = "Tie length (edge length) and great-circle distance"
kind = "measure"
chapter = "space"
summary = "The distance between the two end points of each tie, using the great-circle distance when nodes are given as longitude and latitude."
answers = "How far apart are the nodes that are tied, and are ties mostly local with a thin tail of long ones?"

data_requirements = [
  "A location for every node, as longitude and latitude in degrees or as planar x and y in one unit.",
  "Say what a location stands for: a home address, a label point, a centroid. The answer depends on it.",
  "A radius or unit for the distance: the unit of the answer is the unit of the radius you supply.",
]

assumptions = [
  "A node is well described by one point. For areas such as countries or counties it is not: on the Natural Earth borders France's point is in Paris, which gave two ties over 7,000 km long to French Guiana's neighbours.",
  "Straight-line (great-circle) distance is the distance that matters. Travel time, road length or border crossings may be closer to the cost of a tie.",
  "A sphere is close enough to the Earth. Against ellipsoidal formulas the difference can reach about half a percent, small beside the uncertainty in locations.",
]

readings = [
  { context = "Land borders between countries (Natural Earth, 177 units)", high = "A few ties over 5,000 km (the longest, Brazil to France, is 8,336 km) are far longer than the median of 815 km.", low = "These long ties come from where the points sit in large units, not from distance between neighbours." },
  { context = "Marriage or alliance network in one town", high = "Many long ties suggest families who looked beyond their neighbourhood, or records that include people who had moved.", low = "Short ties alone do not show a preference for neighbours; it is also who could be met." },
  { context = "Office or building network", high = "Long ties across floors or buildings are the ones that connect teams.", low = "Desk distance may follow who works with whom, because people are often seated by team." },
  { context = "Transport or supply network", high = "A long tie is costly to build and run, so it usually marks a deliberate link.", low = "Short ties dominate because building and running them costs less, which is a cost story, not a social one." },
  { context = "Online platform", high = "A long tie between users may be a person who moved, a travel pattern, or a wrong location.", low = "Short ties are not proof of real-world contact: locations are often self-reported or guessed." },
]

pitfalls = [
  "Treating longitude and latitude as x and y: a degree of longitude is about 111.2 km on the equator and 55.6 km at 60 degrees north.",
  "Comparing lengths with nothing: a median tie of 815 km is short against an average of about 7,500 km between any two of these countries, and it would be long in a town.",
  "Reading the length of a tie between areas as the distance between neighbours.",
  "Mixing units: the unit of the result is the unit of the radius.",
]

checks = [
  "Compare the tie lengths with the distances between all pairs of nodes, not with zero.",
  "List the longest few ties by name and ask whether each is real or comes from how a unit was drawn.",
  "Change the point that stands for a unit (label point, centroid, capital) and see whether the tail changes.",
]

do_not_claim = [
  "That a longer tie is a weaker or less important tie.",
  "That a short tie shows a preference for nearness.",
  "That the straight-line distance is how far people or goods travel.",
]

report_template = "Distances between {node_type} were computed as {distance_kind} from {location_source}, in {unit}. The {m} ties have median length {median} and mean {mean}, against a median of {all_pairs_median} between all pairs. The longest ties ({longest}) {explanation}."

related = ["distance-decay", "geodesic-distance", "spatial-checks"]
sources = ["sinnott1984virtues", "moritz2000geodetic", "barthelemy2011spatial"]

[knappnet]
rust = "knappnet::spatial::{Points, Crs, compute_edge_lengths}"
r = "net_spatial(); net_edge_lengths()"
python = "not in knappnet; the chapter writes the haversine formula with numpy"
