id = "density"
title = "Density"
kind = "measure"
chapter = "paths-and-cohesion"
summary = "The share of possible ties that are present: 2m / (n(n-1)) for undirected networks, m / (n(n-1)) for directed ones; equivalently mean degree divided by n - 1."
answers = "How much of the possible tie-making has actually happened in this group?"

data_requirements = [
  "A clear definition of which pairs could have been tied. Density against everyone on a roster means little if most people could never meet.",
  "A known network boundary. Adding or removing people changes the denominator.",
  "A stated convention for loops, repeated ties and direction. igraph and NetworkX count every edge, sna and UCINET count distinct pairs of distinct nodes.",
  "For two-mode data, a density defined for two-mode networks. The one-mode formula does not apply.",
]

assumptions = [
  "Every pair counted could in principle have been tied. When the group has sub-teams that never interact, the denominator is too large.",
  "All ties count equally. Density says nothing about their strength or quality.",
  "The tie was measured the same way in the networks being compared.",
]

readings = [
  { context = "Marriage or alliance network among families", high = "Most families are linked directly to many others, so any one family is easy to bypass.", low = "Few direct links each, so a family that joins others holds a real position. It does not show whether ties were chosen." },
  { context = "Communication inside an office", high = "Many people talk to many others; information is widely shared and also redundant.", low = "Messages go through a few people or reporting lines. Density counts ties, not how useful the talk is." },
  { context = "Transport or supply network", high = "Many direct links and many alternatives, at a cost to build and maintain.", low = "Hub-and-spoke or chains: cheap and fragile. Capacity is not shown." },
  { context = "Online platform", high = "Unusual at scale; found in small groups such as a group chat.", low = "The normal case. Density falls toward zero as a platform grows, so use mean degree to compare people's activity." },
]

pitfalls = [
  "Comparing density across networks of different sizes. With a fixed number of ties per person, density is about that number divided by n - 1: 4/7 for 8 people, 4/799 for 800.",
  "Reading high density as good. A dense group can be warm and also redundant or closed.",
  "Reading low density as weak. Sparse networks can be efficient and, in covert groups, deliberate.",
  "Mixing conventions for loops and repeated ties, which can push density above 1 in some tools.",
  "Treating density as a measure of cohesion without looking at where the ties are. Two networks with the same density can be an even spread or a tight core with a thin tail.",
]

checks = [
  "Report mean degree next to density, and compare networks of different sizes by mean degree.",
  "Compare with a random network that has the same number of nodes and ties; the comparison is meaningful only for the structure beyond density.",
  "Look at the picture or the degree distribution; one number hides a shape.",
  "Recompute after dropping a random few percent of ties to see how sensitive it is to missing data.",
]

do_not_claim = [
  "That a denser group has better teamwork, trust or performance.",
  "That a difference in density between networks of different sizes reflects a difference in how sociable the people are.",
  "That a density measured on a sample is the density of the whole population.",
]

report_template = "The {tie_meaning} network of {n} {node_type} has density {density} ({m} of {possible} possible {directed_or_undirected} ties; mean degree {mean_degree}). Density falls as networks grow, so this is compared only with networks of {size_comparison}. It says how many ties exist, not how strong or useful they are."

related = ["geodesic-distance", "components", "connectivity"]
sources = ["wasserman1994social", "newman2018networks"]

[knappnet]
rust = "compute_density(&g, false)"
r = "net_density(g)"
python = "networkx.density(G)"
