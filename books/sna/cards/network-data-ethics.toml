id = "network-data-ethics"
title = "Ethics, consent and re-identification in network data"
kind = "procedure"
chapter = "collecting-data"
summary = "A checklist for the fact that network data are data about people who were named, not only about people who answered."
answers = "What am I allowed to collect, who is affected by it, and can the people in the data be picked out after the names are removed?"

data_requirements = [
  "A statement of what respondents were told, and what people who were named (alters) could expect.",
  "A plan for storing identifiers separately from the ties.",
  "Approval from the relevant ethics board or data owner where one applies.",
]

assumptions = [
  "Removing names is not anonymization. Structure alone can identify people.",
  "People named by respondents did not consent and may not know they are in the data.",
  "Rules differ between places and institutions; this card is a prompt, not legal advice.",
]

readings = [
  { context = "Workplace network (advice, communication)", high = "Results about individuals can affect careers. Report groups, not people, unless the individuals agreed.", low = "A small organization makes everyone easy to identify." },
  { context = "Health or sensitive contacts", high = "Even the existence of a tie may be sensitive. Minimize and secure.", low = "Aggregate counts may still reveal small groups." },
  { context = "Public online data", high = "Public does not mean free of harm; aggregation and linking can expose people.", low = "Check the platform's terms and your board's guidance." },
]

pitfalls = [
  "Publishing an edge list with names removed and believing it is anonymous.",
  "Publishing a figure with labels in a small network.",
  "Keeping more than the analysis needs.",
  "Treating a named alter's tie as the respondent's data alone.",
]

checks = [
  "Count how many people are unique by degree and by degree plus their contacts' degrees; any number above zero means structure can identify them.",
  "Ask whether someone who knows a person's few contacts could find them in the published data.",
  "Aggregate or perturb before release, and say that you did.",
  "Share data under conditions (access agreements) when it cannot be made safe to publish.",
]

do_not_claim = [
  "That data are anonymous because names were removed.",
  "That consent from respondents covers the people they named.",
  "That a data set is safe because it is public.",
]

report_template = "Data were collected under {approval}. Respondents were told {told}. Identifiers are stored {storage}. In the released data {unique_share} of {node_type} are unique by degree and contacts' degrees, so {release_decision}."

related = ["boundary-specification", "snowball-sampling"]
sources = ["narayanan2009deanonymizing", "backstrom2007wherefore", "sweeney2002kanonymity", "kadushin2012understanding"]

[knappnet]
rust = "Compute degrees with compute_degree and count repeated degree and neighbor-degree signatures by hand, as in the chapter"
r = "net_degree(g), then count repeated signatures built from a person's degree and their contacts' degrees"
python = "dict(G.degree()), then count repeated (degree, sorted neighbor degrees) tuples"
