id = "symmetrization-rules"
title = "Making a directed network undirected"
kind = "procedure"
chapter = "networks-as-data"
summary = "Choose and state a rule (either, both, sum or average) for turning directed ties into undirected ones, and check how much it changes."
answers = "If the measure needs undirected ties, which rule turns who named whom into who is tied to whom, and does the choice matter for this result?"

data_requirements = [
  "A directed network, with a record of which direction each tie runs.",
  "A statement of what a one-sided report means in this setting: evidence of a tie, or a different relation.",
]

assumptions = [
  "Either assumes that one report is enough to call two people tied. This suits observed events and is generous for claims of a mutual bond.",
  "Both assumes that a tie needs two reports. It suits claims of a mutual relation and throws away every one-sided report.",
  "Sum or average assumes the values are on a common scale in both directions, so that adding them means something.",
  "The same rule is applied to every pair.",
]

readings = [
  { context = "Friendship named in a survey", high = "Under both, a pair counts only when each names the other: a stricter, smaller network of mutual friendships.", low = "Under either, a pair counts when anyone names the other: a larger network that includes unreturned friendship." },
  { context = "Email or message log", high = "Either is natural: a message from A to B is a contact between A and B.", low = "Both asks for messages in both directions, which finds conversations and drops one-way broadcasts." },
  { context = "Reporting or command structure", high = "Not applicable as a symmetric tie: both leaves no ties at all, since no one reports to their own subordinate.", low = "Either keeps all ties but erases who reports to whom." },
  { context = "Flows with amounts (trade, money)", high = "Sum gives the total exchanged between two parties.", low = "Max or average describe different things (the larger flow, or the typical one); say which." },
]

pitfalls = [
  "Reporting a degree, density or ranking without saying which rule was used.",
  "Using the either rule and calling the result mutual.",
  "Symmetrizing by averaging the matrix and its transpose, then treating the half-weights as strengths of ties.",
  "Forgetting that the number of ties can change by a factor of three or more between the rules.",
  "Reading a ranking of people as stable when it changes with the rule.",
]

checks = [
  "Count the ties under each rule. In the 21 managers' advice network there were 145 under either and 45 under both.",
  "Rank the people under each rule and compute a rank correlation. For advice it was 0.298; for friendship 0.735. A low value means any named top person depends on the rule.",
  "Report the share of ties that are one-sided. If it is large, the rule is doing much of the work.",
  "Check whether a method that works directly with directed ties exists for your question, and use it if so.",
]

do_not_claim = [
  "That an undirected network is the data; it is a summary that discards direction.",
  "That the same person is central under both rules, without checking.",
  "That a rule chosen for convenience is neutral.",
]

report_template = "The {n} {node_type} named {arcs} directed ties. We made the network undirected by counting a tie when {rule}, which gives {ties} ties (mean degree {mean_degree}); the other rule gives {other_ties}. The ranking of {node_type} by degree has rank correlation {rho} between the two rules, so conclusions about individuals are {stable_or_not}."

related = ["tie-definition", "dichotomization", "degree"]
sources = ["krackhardt1987cognitive", "wasserman1994social", "kolaczyk2009statistical"]

[knappnet]
rust = "Build the undirected network from the union of the ties (either) or from the pairs with both arcs (both); compute_degree on each"
r = "net_symmetrize(g, method = \"max\") for either, \"min\" for both, \"sum\" or \"average\" for valued ties"
python = "G.to_undirected() for either; G.to_undirected(reciprocal=True) for both"
