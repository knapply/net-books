id = "snowball-sampling"
title = "Snowball sampling and what it does to degree and centrality"
kind = "procedure"
chapter = "collecting-data"
summary = "Start from a few seed people and follow the ties they name; the sample is well connected and over-represents people with many ties."
answers = "What can be learned about a network, and what is distorted, when people are found by following ties from seeds?"

data_requirements = [
  "The seeds, how they were chosen, and the number of waves followed.",
  "Who was interviewed and who was only named; ties are fully seen only for those interviewed.",
  "The name-generator question and any cap on the number of names.",
]

assumptions = [
  "The people of interest are connected to the seeds through the ties followed. Separate pieces are never reached.",
  "Respondents name their contacts honestly and completely.",
  "The result is for the people reached, not for the whole population, unless a design-based correction is used.",
]

readings = [
  { context = "Hidden or hard-to-list population", high = "A snowball may be the only way to find people. A large sample from one seed mostly describes that seed's neighborhood.", low = "A small sample describes the seeds and their closest contacts." },
  { context = "Workplace or community survey", high = "People with many ties are named often, so the sample leans toward the well connected.", low = "People with few ties may never be named." },
  { context = "Online platform (crawling follows)", high = "A crawl from an account reaches popular accounts first; mean degree of the crawled accounts is higher than for accounts in general.", low = "The last wave has only the ties back to the previous wave, so their degree is understated." },
]

pitfalls = [
  "Reporting the mean degree of the people reached as if it were the population mean; it is usually higher.",
  "Reporting degree for people in the last wave; they are named but not interviewed, so their degree is understated.",
  "Using a single seed and treating the result as stable. Different seeds reach very different numbers of people.",
  "Reading centrality from a small sample as if it were whole-network centrality; the seed tends to look central.",
]

checks = [
  "Report the number reached after each wave and the share of ties seen for each person.",
  "Compare the mean degree of the sample with an independent estimate of the population mean degree, if there is one.",
  "Repeat from other seeds and report how much the results change.",
  "Mark the people who were only named, and exclude them from degree summaries.",
]

do_not_claim = [
  "That the sample is representative of the population.",
  "That the degree of the last wave, or of the seed in a one-wave sample, is its real degree.",
  "That a sample that did not reach some people shows there are no such people.",
]

report_template = "Respondents were found by following ties from {seeds} seeds for {waves} waves, reaching {reached} people, of whom {interviewed} were interviewed. Degree is reported only for interviewed people. The sample is not a probability sample, and measures describe the people reached."

related = ["respondent-driven-sampling", "boundary-specification", "degree"]
sources = ["goodman1961snowball", "frank1978sampling", "feld1991friends", "kolaczyk2009statistical"]

[knappnet]
rust = "knappnet::metrics::descriptive::compute_distances for waves from each seed; the sampling rule is written by hand in the chapter"
r = "net_distances(g) gives the waves from each seed; the sampling rule is written by hand in the chapter"
python = "nx.single_source_shortest_path_length(G, seed, cutoff=waves)"
