id = "structural-balance"
title = "Structural balance (balanced triangle share and frustration index)"
kind = "measure"
chapter = "signed-and-valued"
summary = "How far a signed network is from splitting into two camps, with positive ties inside the camps and negative ties between them."
answers = "Can one dividing line explain every sign in this network, and if not, how many ties break it?"

data_requirements = [
  "Every tie must carry a sign that was recorded on purpose (like and dislike, trust and distrust, ally and enemy). Absence of a tie is not a negative tie.",
  "The signs must be undirected for the standard definition. If the data are directed, say how the two directions of a pair were combined and how many pairs conflicted.",
  "Negative ties must have been collected as carefully as positive ones. A network with few or no negative ties is balanced almost automatically.",
]

assumptions = [
  "Two camps is the right idea of balance. Davis's weaker condition allows any number of groups, and a network can fail the two-camp test while passing the clusterability test.",
  "The balanced triangle share looks only at triangles. A network can pass every triangle and still be unbalanced through a longer cycle, so a high share is not a test of balance.",
  "The frustration index counts the fewest ties that disagree with the best two-camp split. It is exact only when the search is exact; for large networks it is computed by heuristics or integer programming and the result may be an upper bound.",
  "Sparse networks are easy to balance. Without a comparison to shuffled signs on the same ties, a high share or a low index may only reflect sparseness.",
]

readings = [
  { context = "Alliance or marriage network among families or states", high = "Two blocs, which may be real rivals. Check that the negative ties are recorded enmities and not just missing alliances.", low = "Cross-cutting loyalties with no single dividing line." },
  { context = "Office with friend and foe, or trust and distrust, ties", high = "A divided workplace, or a survey that recorded only cliques and their opponents.", low = "Mixed loyalties. Also possible: respondents who named few or no enemies." },
  { context = "Trade, sanctions or conflict among organizations", high = "A two-sided world, which may follow a third factor such as geography or history.", low = "Shifting coalitions or a web of partners and competitors." },
  { context = "Online platform with follow and block, or upvote and downvote, ties", high = "People sorting into two sides.", low = "Blocks and flags that follow topics or moods rather than stable camps." },
]

pitfalls = [
  "Reading balanced as harmonious. A network of two warring camps is perfectly balanced.",
  "Treating the balanced triangle share as a test of balance. Longer cycles also count.",
  "Reporting one combined number. Report the triangle counts by type (+++, ++-, +--, ---) and the number of ties of each sign.",
  "Dropping conflicted pairs, or merging them by a rule, without saying so and without testing another rule.",
  "Treating a missing negative tie as no conflict. The Florentine marriage network is trivially balanced because it records no negative ties at all.",
  "Reading the two best camps as the groups people see themselves in. A split of signs is a summary of signs.",
]

checks = [
  "Shuffle the signs over the same ties many times, keeping the number of positive and negative ties, and recompute. If the real value is ordinary among the shuffles, the balance follows from sparseness and the sign proportions.",
  "Recompute under a second rule for combining directions or conflicted pairs, and report whether the frustration index and the best split change.",
  "Check whether the best split is unique. Several best splits mean the camps are weakly determined.",
  "Test clusterability: cut to the positive ties and see whether any negative tie lies inside a positive piece. If none does, a split into any number of groups works.",
  "Compare the cost of the best two-camp split with the cost of one group (every negative tie frustrated) and of everyone alone (every positive tie frustrated).",
]

do_not_claim = [
  "That the network is balanced because most triangles are balanced.",
  "That the camps caused anything, or that they match groups the people themselves would name.",
  "That the absence of negative ties means the absence of conflict.",
  "That signs are stable over time or the same for every setting, without data from more than one time.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, {pos} ties are positive and {neg} negative after {rule_for_directions}. {balanced} of {triangles} triangles are balanced (counts by type: {type_counts}). The best split into two camps leaves {frustration} of {ties} ties disagreeing ({share}). Among {reps} shuffles of the signs on the same ties, the average is {null_mean}, and {as_good} shuffles do at least as well. The network is {balanced_or_not} and {clusterable_or_not}. This describes the pattern of recorded signs, not the reasons for it."

related = ["weighted-degree", "betweenness"]
sources = ["heider1946attitudes", "cartwright1956structural", "harary1953notion", "davis1967clustering", "facchetti2011computing", "doreian1996partitioning", "traag2009community"]

