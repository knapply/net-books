id = "twomode-modularity"
title = "Two-mode (bipartite) modularity"
kind = "measure"
chapter = "two-mode"
summary = "How much more of a network's ties fall inside chosen groups than a random two-mode network with the same degrees would give, with groups drawn across both modes."
answers = "If I assign people and events to groups, do the ties stay inside the groups more than chance given each node's number of ties?"

data_requirements = [
  "A two-mode network and a grouping of nodes in both modes (events as well as people).",
  "A grouping chosen or found without peeking, if the number is to be read as evidence.",
]

assumptions = [
  "Chance means random ties with the observed degrees in each mode (Barber's null). Other nulls give other values.",
  "Groups include both modes. A person-only grouping needs a rule for the events (here, the group that supplied most attendees).",
  "The value is for this grouping of this network; its maximum depends on the sizes and degrees of both modes.",
]

readings = [
  { context = "Women and social events", high = "Attendance splits along the groups: women mostly go to their group's events.", low = "Attendance crosses groups as much as degrees predict." },
  { context = "Authors and papers", high = "Fields or labs publish mostly within themselves.", low = "Authors publish across the grouping." },
  { context = "Accounts and hashtags (online platform)", high = "Communities use their own tags.", low = "Tag use is shared across communities." },
]

pitfalls = [
  "Comparing the value with one-mode modularity or across networks. Its scale depends on both modes' sizes and degrees.",
  "Choosing the grouping by looking at the picture and then reading the value as evidence. A split chosen by eye always looks good on the data it was chosen from.",
  "Treating a modularity-maximizing grouping as the true groups. Optimizers find groups even in random networks.",
  "Forgetting to assign the second mode.",
]

checks = [
  "Compare groupings of the same network (move one node and see the value change) rather than networks with each other.",
  "Compare with a degree-preserving shuffle of the incidence matrix, with the grouping found by the same procedure on each shuffle.",
  "Check that groups do not coincide with something trivial such as event size or time of year.",
]

do_not_claim = [
  "That the groups are real, rather than a description of this split.",
  "That a high value shows preference or exclusion.",
  "That a value of 0.318 here is comparable with one-mode modularity values.",
]

report_template = "For the grouping {grouping_description} of {n} {first_mode} and {m} {second_mode}, Barber's two-mode modularity is {q}. It compares ties inside groups with what the two modes' degrees would give. The grouping was {how_chosen}, so the value describes this split and is not evidence that the groups exist; compared with {comparison} it is {higher_or_lower}."

related = ["modularity", "bipartite-clustering", "null-models-choice"]
sources = ["barber2007modularity", "newman2006modularity"]

[knappnet]
rust = "knappnet::metrics::bipartite_extra::compute_bipartite_modularity(&graph, &group, &is_first_mode, 1.0, None)"
r = "no function; written by hand from the incidence matrix: sum((B - outer(rowSums(B), colSums(B)) / m)[inside]) / m"
python = "written by hand (networkx has only one-mode modularity); same formula as the R tab"
