id = "null-models-choice"
title = "Choosing a null model"
kind = "model"
chapter = "tests-and-null-models"
summary = "A null model is a rule for drawing random networks that keep some features of the observed network fixed and scramble the rest; what is held fixed defines the question a p-value answers."
answers = "Is this pattern more than a stated baseline (the same number of ties, the same degrees, the same dyad counts, the same network with attributes shuffled) produces?"

data_requirements = [
  "A statistic you can recompute on every random network, and a rule that says what is held fixed.",
  "Knowledge of whether the network is directed, whether loops and repeated ties are possible, and how it was bounded.",
  "A sampler that is stated: exhaustive, stub matching with rejection, or tie swapping with a number of swaps.",
  "A recorded number of draws and seed.",
]

assumptions = [
  "What is held fixed is not itself the object of the claim. A degree-preserving null cannot say anything about the degree distribution, and a null that fixes the number of ties cannot say anything about density.",
  "The sampler draws evenly from the set it claims. Stub matching that discards loops and repeated ties does; a tie-swapping chain does only if it has run long enough to forget its start. For Florentine marriages the chapter found about one accepted swap per tie enough for one summary; other statistics can need more.",
  "Passing a null is not a claim that the network arose that way. It means no evidence of more than the null produces.",
]

readings = [
  { context = "Clustering or closure in a friendship or marriage network", high = "More closure than ties placed at random give is common, because degrees alone produce it. More than the same-degree null gives is a stronger finding.", low = "No more than the null gives means closure is explained by the fixed features, in small networks possibly for lack of power." },
  { context = "Reciprocity or hierarchy in a directed advice or message network", high = "Compare with the dyad-census null for triad counts and with in- and out-degree preserving nulls for hierarchy; the verdict can differ between them.", low = "Close to a null that fixes who is busy means popularity and activity account for it." },
  { context = "Alignment of ties with an attribute (department, group)", high = "Label permutation keeps the network and asks whether ties follow the attribute. Random ties keep the attribute and ask the same question with a different spread; the two can differ.", low = "Neither null gives evidence of alignment, which in small networks says little about whether it exists." },
  { context = "Supply, transport or infrastructure networks", high = "Beyond what hubs and spokes (the degrees) give, there may be planning or geography; use a space-preserving null if distance is involved.", low = "The pattern follows from the degrees." },
]

pitfalls = [
  "Reporting a p-value without naming what was held fixed.",
  "Using the easiest null (same number of ties) and presenting the result as if it held against degrees.",
  "A null that fixes the statistic of interest: its draws all agree, the standard deviation is 0 and the p-value is 1 whatever the data.",
  "A null that fixes so much that the finding is already built in, such as fixing each manager's number of advice-seekers to test whether a few managers attract advice.",
  "Stub matching in dense or hub-heavy networks where almost every pairing has a loop or a repeated tie.",
  "Too few swaps, so the draws are still close to the observed network.",
  "Reading z-scores when the null is lopsided or takes few values.",
]

checks = [
  "State the null in a sentence before running it, and check that the statistic is not a function of what was held fixed.",
  "Run a second, stronger or weaker null and see whether the verdict changes.",
  "For swap-based nulls, double the number of swaps and watch your own statistic along the chain.",
  "Rerun with another seed and more draws, and report the Monte Carlo error.",
  "Look at the skewness or a histogram of the draws before quoting a z-score.",
]

do_not_claim = [
  "That the network was generated by the null model.",
  "That a result against one null holds against another.",
  "That a result in a very small network shows the absence of structure.",
  "That a null model explains a pattern causally; it only reproduces it.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, {statistic} is {observed}. Against random networks that keep {held_fixed} ({sampler}, {draws} draws, seed {seed}) the average is {baseline} and {share} of draws are at least this {tail} (p = {p}). This compares the network with one baseline and does not say how it arose. {caveat}"

related = ["permutation-test", "configuration-model", "qap", "small-world"]
sources = ["erdos1959random", "gilbert1959random", "holland1976local", "molloy1995critical", "newman2001random", "maslov2002specificity", "fosdick2018configuring", "kolaczyk2009statistical"]

[knappnet]
rust = "knappnet::generate::{sample_gnm, sample_configuration, sample_uman}; knappnet::metrics::rewiring::run_double_edge_swap (undirected only)"
r = "net_random_gnm(), net_random_gnp(), net_random_uman(), net_random_config(), net_cug_test(x, statistic, conditioning = c(\"size\", \"edges\", \"dyad.census\")); tie swapping is written by hand in the chapter"
python = "networkx.gnm_random_graph, networkx.configuration_model, networkx.double_edge_swap and directed_edge_swap"
