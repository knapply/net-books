id = "temporal-aggregation"
title = "Choosing how to hold time (snapshots, aggregation, events, intervals)"
kind = "procedure"
chapter = "time"
summary = "A checklist for deciding whether to keep a changing network as waves, piled-up or windowed networks, an event stream or intervals, and for saying what the choice throws away."
answers = "Which representation of time matches my question, and what will the numbers I compute from it not show?"

data_requirements = [
  "A record of ties or contacts with times, or repeated surveys of the same people.",
  "Knowing whether times are exact, rounded or only ordered.",
  "A question about order, change between waves, or a state at a moment.",
]

assumptions = [
  "The representation answers the question: waves for change between surveys, event streams for order and reach, intervals for who is tied at a moment.",
  "Aggregation windows are wide enough to hold the contacts you care about and narrow enough to mean something.",
  "The edges of the record are known and stated.",
]

readings = [
  { context = "Survey waves of the same people", high = "Large changes between waves are changes in who is named, but check whether the questionnaire fixes the number of choices (Sampson's novices named about three each wave, so density barely moved).", low = "Stable summaries such as density can hide large turnover: 35 of 55 liking choices carried over in the chapter's example." },
  { context = "A timestamped log", high = "Piled together, a long log looks dense and fully connected, because every contact is kept and its order is lost.", low = "A short window looks sparse and disconnected; the same log in a wider window does not." },
]

pitfalls = [
  "Reading a piled-up network as if its ties existed together: Sampson's three waves hold about 56 choices each but 88 piled together.",
  "Quoting a density or a connectivity without the window width.",
  "Treating a snapshot as showing who can reach whom in time.",
  "Comparing the density of a year of activity with a survey wave.",
  "Using coarse timestamps and not stating how simultaneous contacts are handled.",
]

checks = [
  "Write down what each representation lets you ask and what it throws away before computing.",
  "Move the window: shift, halve and double it; report the range if the conclusion changes.",
  "Run the same result with simultaneous contacts allowed to chain and forbidden to chain.",
  "Trim the first and last tenth of the record and rerun.",
  "Compare with a version in which the timestamps are shifted or shuffled among the contacts.",
]

do_not_claim = [
  "That a statistic of the piled-up network describes any single moment.",
  "That stable density means stable structure.",
  "That a change between waves happened at a particular time between them.",
  "That what a window shows is the network rather than the network seen through that window.",
]

report_template = "We held the data as {representation}, cutting time into {windows} of width {width}. {statistic} was {value} in this cut; with the window {changed_window} it was {range}. The record starts at {start} and ends at {end}; contacts sharing a timestamp were {chaining_rule}. This shows {what_it_shows}; it does not show {what_it_does_not}."

related = ["temporal-reach", "burstiness", "density", "permutation-test"]
sources = ["holme2012temporal", "masuda2016guide", "casteigts2012time", "latapy2018stream", "kossinets2006effects", "sampson1968novitiate"]

[knappnet]
rust = "knappnet::temporal::windows::{find_contacts_in_windows, find_contacts_at, combine_contacts_by_pair}: windows, snapshots at a time and pair aggregation"
r = "net_temporal(), net_window(g, from, to), net_waves(g), net_aggregate(g, from, to), net_at(g, t)"
python = "none in NetworkX; the chapter filters and groups the contact list by hand"
