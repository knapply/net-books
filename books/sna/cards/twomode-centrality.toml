id = "twomode-centrality"
title = "Two-mode degree, closeness and betweenness centrality"
kind = "measure"
chapter = "two-mode"
summary = "Degree, closeness and betweenness computed on the two-mode network itself, normalized separately for each mode so that no projection is needed."
answers = "Which people are the best attached to the events, and which events are the hubs or bridges through which people reach one another?"

data_requirements = [
  "A connected two-mode network, or an acceptance that closeness and betweenness are computed within a component.",
  "Ties that carry some sense of access or flow between people through events.",
  "Modes kept separate: scores are ranked within a mode, not across modes.",
]

assumptions = [
  "Paths go person, event, person. Whether information, influence or contact actually flows that way is a separate claim.",
  "Normalization uses each mode's maximum possible value, which depends on the sizes of both modes.",
  "Shortest paths are the relevant routes, as in one-mode closeness and betweenness.",
]

readings = [
  { context = "Events in the southern women", high = "A high-degree event is a popular one (a big party). A high-betweenness event is a bridge: one that connects people who otherwise share little.", low = "A small, peripheral event." },
  { context = "Hospitals and patients", high = "A busy hospital is high degree. A referral centre that connects patient groups is high betweenness.", low = "A local unit with its own patients." },
  { context = "Authors and papers", high = "A prolific author is high degree. A paper or author linking subfields is high betweenness.", low = "A narrowly placed author." },
  { context = "Accounts and hashtags (online platform)", high = "A broadly used tag is high degree. A tag used across communities is high betweenness.", low = "A niche tag or an account that stays in one community." },
]

pitfalls = [
  "Comparing a person's score with an event's. The normalizations differ.",
  "Reading modest betweenness as unimportance: in the southern women the top woman has 0.11 of the maximum possible, and the events tell the story more strongly.",
  "Ties at the top of degree and closeness. Several women tie and software reports one.",
  "Reporting scores for a disconnected network without saying which component each is computed in.",
  "Reading betweenness as influence rather than position on shortest routes.",
]

checks = [
  "Rank each mode separately and look at ties at the top.",
  "Leave out the highest-degree event and recompute: how much do the other scores move?",
  "Compare with the same measure on the projection and ask whether the two agree (see projection).",
  "Compare tools: NetworkX's bipartite centralities and the engine agreed to two decimals on the southern women.",
]

do_not_claim = [
  "That a high-degree event or person has influence or status.",
  "That high betweenness means brokerage unless the events really are where people meet.",
  "That women and events can be ranked on one list.",
]

report_template = "In the two-mode network of {n_first} {first_mode} and {n_second} {second_mode}, the {second_mode} with the highest {measure} is {top} ({score}, normalized within its mode); among the {first_mode} it is {top_first} ({score_first}), with {n_tied} tied at the top. Scores are not comparable across modes. They describe position in the {first_mode}-{second_mode}-{first_mode} paths, not influence."

related = ["degree", "closeness", "betweenness", "twomode-degree-density", "projection"]
sources = ["borgatti1997network", "borgatti2011analyzing"]

[knappnet]
rust = "knappnet::metrics::bipartite::{compute_twomode_degree, compute_twomode_closeness, compute_twomode_betweenness}"
r = "net_twomode_degree(club); net_twomode_closeness(club); net_twomode_betweenness(club)"
python = "networkx.bipartite.degree_centrality, closeness_centrality, betweenness_centrality (G, nodes)"
