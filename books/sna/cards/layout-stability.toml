id = "layout-stability"
title = "Do the layout and its seed matter?"
kind = "procedure"
chapter = "visualization"
summary = "Rerun the layout from several seeds, compare the page distances, and report how far the picture changes before telling a story from it."
answers = "Would another run of the same layout tell the same story, and how much of the picture is the algorithm's choice?"

data_requirements = [
  "The network and a layout method that takes a seed, or a way to fix its starting positions.",
  "Several runs, at least ten, and the distance between each pair of nodes on the page for each run.",
]

assumptions = [
  "Two runs that differ only by rotation, reflection or translation are the same picture. Compare page distances, which these do not change, and not coordinates.",
  "A method that always starts from the same place (a circle, for instance) will look steady because it is steady, not because the story is robust.",
  "Stability is a property of one method on one network. A method that is steady on a small club can vary a great deal on a large sparse network.",
]

readings = [
  { context = "Force layout, karate club, 20 engine seeds", high = "Correlation of page distances between seed 1 and the others runs from 0.958 to 0.984, and scale-free stress from 0.087 to 0.094: the picture hardly changes.", low = "A correlation below about 0.8 would mean the seed changed which people look close, and a story from one run would be an accident." },
  { context = "Figure for a report", high = "Save the seed and the method with the picture so it can be redrawn exactly.", low = "A figure with no seed cannot be reproduced, and a reader cannot tell a stable picture from a lucky one." },
]

pitfalls = [
  "Picking the best-looking run and calling it the layout.",
  "Comparing coordinates, which differ by rotation, instead of page distances, which do not.",
  "Assuming every tool is as steady as the one you tried. NetworkX's spring layout, for instance, is not the same algorithm as the engine's.",
  "Reading a stable picture as a correct one; stability and fidelity are different properties (see the scoring card).",
]

checks = [
  "Run twenty seeds and print the minimum, median and maximum of the scale-free stress.",
  "Compute the correlation of page distances between the first run and every other and report the smallest.",
  "Redraw with the saved seed and confirm the page distances match exactly.",
]

do_not_claim = [
  "That a picture is reproducible without the seed and the method that made it.",
  "That a stable layout is the true shape of the network.",
  "That one method's stability transfers to another method or another network.",
]

report_template = "The {method} layout was run from {k} seeds. Page distances between the first run and the others correlate between {r_min} and {r_max}, and scale-free stress ranges from {s_min} to {s_max}. The figure uses seed {seed}."

related = ["layout-quality", "visual-encoding", "reproducible-run"]
sources = ["fruchterman1991graph", "gansner2005graph", "jacomy2014forceatlas2"]

[knappnet]
rust = "layout_fruchterman_reingold(&g, &FrOptions { seed, .. }) and layout_stress_majorization(&g, &StressOptions { seed, .. })"
r = "net_layout(g, method = \"fr\", seed = 1) or method = \"stress\""
python = "nx.spring_layout(G, seed=1)"
