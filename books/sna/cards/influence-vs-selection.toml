id = "influence-vs-selection"
title = "Influence versus selection (the identification problem)"
kind = "model"
chapter = "diffusion"
summary = "Connected people often resemble each other; this card says what that observation does and does not show about influence (contagion), selection (homophily) and shared environment, and which designs can separate them."
answers = "When connected people behave alike, can we say that behavior spreads along the ties?"

data_requirements = [
  "A network and an outcome or behavior for each person, ideally measured at more than one time.",
  "For any causal claim: information on timing (who changed first), on exposure assigned by design, or on the confounders you can measure.",
  "A clear statement of what the ties mean and when they were recorded relative to the behavior.",
]

assumptions = [
  "A single observed network and outcome cannot separate influence, selection and shared environment without strong additional assumptions.",
  "Dynamic models that separate selection from influence assume the right effects are in the model and the waves are close enough in time that changes can be attributed.",
  "Network-structure approaches to identification assume, among other things, that friends of friends affect you only through your friend; this fails if they share your environment.",
  "Sensitivity analysis assumes a particular form of unmeasured confounding.",
]

readings = [
  { context = "Positive similarity between tied people (assortativity or a positive network-autocorrelation coefficient)", high = "Consistent with influence, selection and shared environment alike; by itself it does not say which.", low = "Near zero is consistent with no similarity at the resolution of the data; negative similarity means tied people differ more than expected." },
  { context = "Behavior changes after a tie forms or after a friend changes (longitudinal data)", high = "Supports a time order for influence, but a changing common cause can still produce it.", low = "No change after exposure is weak evidence against influence if measurements are too far apart." },
  { context = "Randomized exposure (an experiment)", high = "An effect of the assigned exposure on those exposed, and on their contacts if measured, is attributable to the assignment.", low = "No effect is informative only for the dose and population tested." },
]

pitfalls = [
  "Calling a positive network-autocorrelation coefficient a peer effect or a contagion effect.",
  "Taking a statistically significant similarity as a causal effect size.",
  "Adjusting for covariates and treating the remainder as influence, when unmeasured confounders remain.",
  "Using present ties to explain past behavior, or ties that were formed because of the behavior.",
  "Reading a model's fit to an adoption curve as evidence for the mechanism.",
]

checks = [
  "State the three explanations (influence, selection, shared environment) and ask which the data could distinguish.",
  "Check the timing: did the behavior change after exposure, and did the tie form before or after the similarity appeared?",
  "Where repeated network and behavior data exist, fit a model that lets ties and behavior change together and report both the selection and the influence effects with their uncertainty.",
  "Run a sensitivity analysis: how strong would an unmeasured confounder have to be to explain the estimate?",
  "Simulate the competing explanations on your own network and see whether the statistic you report differs between them.",
]

do_not_claim = [
  "That a behavior spreads, or that friends cause each other's behavior, from one observed network and an outcome.",
  "An effect size of influence from a similarity coefficient.",
  "That a failure to find an effect shows no influence.",
  "That homophily explains the pattern, any more than influence does, without evidence beyond the cross-section.",
]

report_template = "In this network of {n} {node_type}, {statistic} was {value} (compared with {baseline} under {null_model}). This pattern fits peer influence, selection into ties and shared circumstances alike; these data do not separate them{design_note}. We therefore describe it as an association between tied people and do not estimate a causal effect of influence."

related = ["network-autocorrelation", "assortativity", "contagion"]
sources = ["shalizi2011homophily", "aral2009distinguishing", "manski1993identification", "bramoulle2009identification", "vanderweele2011sensitivity", "steglich2010dynamic", "christakis2007spread", "lyons2011spread"]

[knappnet]
rust = "none (a design problem, not a function; simulate competing explanations as in the chapter)"
r = "RSiena::siena07 fits a stochastic actor-oriented model with a behavior variable to dynamic data; for the cross-section use the chapter's hand-written simulation"
python = "none (use the hand-written simulation in the chapter for the cross-section; RSiena through R for dynamic data)"
