id = "sharing-network-data"
title = "Sharing a network without exposing the people in it"
kind = "procedure"
chapter = "reproducibility"
summary = "A way to estimate how easily a person could be singled out of a shared network, and a list of steps from least to most protective, none of which guarantees privacy."
answers = "If I share this network, could someone who knows a little about a person find them in it, and what can I share instead?"

data_requirements = [
  "The network and any node attributes that would be shared.",
  "A statement of what the people in the network were told and agreed to.",
  "A guess at what an outsider might already know about a person: their degree, their friends, an attribute.",
]

assumptions = [
  "Removing names does not make a network anonymous, because a node's position in the network can identify it.",
  "Counting how many nodes share a description is a measure of risk for that description only; a different description can single out more people.",
  "The rules of whoever collected the data, and the consent given, apply before any technical step.",
]

readings = [
  { context = "Counts of nodes that are the only ones with their description (k = 1)", high = "A high count means many people could be picked out by someone who knows that description.", low = "A low count for one description does not mean the network is safe; other descriptions may single people out." },
  { context = "Coarsening a description (degree bands instead of exact degree)", high = "Larger smallest group means fewer people identified by that description.", low = "Coarsening also removes detail the analysis may need, and is not a guarantee." },
  { context = "Sharing a replacement (a simulated network or fitted model) instead of the real one", high = "The recipient can repeat the analysis without the real people being present.", low = "Results on the replacement describe the model, not the real network, and must be labeled as such." },
]

pitfalls = [
  "Calling a network anonymous because names were removed.",
  "Making ids by hashing names: anyone can hash a list of candidate names and match them, so use secret random ids.",
  "Checking only degree; the degrees of a node's friends single out far more people.",
  "Leaving rare attributes (an unusual job title, an exact age, a small place) in the file.",
  "Forgetting that a second data set with overlapping people can be used to match nodes.",
]

checks = [
  "Count how many nodes are unique under several plausible descriptions (degree, degree and friends' degrees, attributes).",
  "Coarsen the descriptions and recount; look at the smallest group size.",
  "List every attribute and ask whether any value is rare enough to identify someone.",
  "Ask whether the measures and a hash of the data would be enough for the recipient.",
  "Ask the people in the network, or whoever speaks for them, whether this use is within what they agreed to.",
]

do_not_claim = [
  "That a shared network is anonymous or private.",
  "That a small count of unique nodes under one description means no one can be identified.",
  "That a plain hash of a name protects the name.",
  "That consent for one use covers sharing the data for others.",
]

report_template = "Before sharing, the {n}-node network was checked for how many nodes are unique under {descriptions}: {unique_counts}, with a smallest group of {smallest_group} after {coarsening}. Names were replaced by {id_rule}, and {removed} was removed. This reduces but does not remove the risk that a person could be identified by someone who knows {what_an_outsider_knows}. The data were collected under {consent}."

related = ["reproducible-run"]
sources = ["backstrom2007wherefore", "narayanan2009deanonymizing", "sweeney2002kanonymity"]

[knappnet]
rust = "compute_degree(&g, DegreeMode::All, true) and the neighbors' degrees, then count equal descriptions"
r = "net_degree(x) and the neighbors' degrees, then table() the descriptions"
python = "dict(G.degree()) and Counter over each node's description"
