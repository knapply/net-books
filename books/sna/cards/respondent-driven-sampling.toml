id = "respondent-driven-sampling"
title = "Respondent-driven sampling"
kind = "model"
chapter = "collecting-data"
summary = "A chain-referral design in which respondents recruit peers and each is weighted by the inverse of their reported degree to undo the lean toward well-connected people."
answers = "Can a chain-referral sample of a hidden population give estimates for the whole population, and under what conditions?"

data_requirements = [
  "For each respondent, their reported degree (how many people in the population they know) and who recruited them.",
  "The recruitment limit per respondent and the number of recruitment waves.",
  "The characteristic being estimated, recorded for every respondent.",
]

assumptions = [
  "Ties are undirected: if A can name B, B could name A.",
  "Respondents recruit at random among their contacts, and the chain has run long enough to forget the seeds.",
  "Sampling is close to with replacement, so the sample is small compared with the population.",
  "Reported degree is accurate. Estimates inherit its errors.",
  "The population is connected through the ties followed.",
]

readings = [
  { context = "Hidden population (people who inject drugs, sex workers)", high = "Estimates are only as good as the assumptions; they can be far off when recruiting is not random or when degree is misreported.", low = "A small sample gives wide intervals, and the design effect is often large." },
  { context = "Online community with no list of members", high = "A weighted estimate can correct for popular accounts being found more often, if accounts report true degree.", low = "If degree is capped or hidden by the platform the weights are wrong." },
]

pitfalls = [
  "Using unweighted sample means. In the long run a person is reached in proportion to their degree.",
  "Treating the weighted estimate as free of bias when degree is top-coded or rounded.",
  "Ignoring that the design's variance is usually much larger than that of a simple random sample of the same size.",
  "Treating the weights as correcting for seeds that were chosen by convenience when the chain is short.",
]

checks = [
  "Check whether estimates settle as recruitment waves go on; if they keep drifting, the chain has not forgotten its seeds.",
  "Compare estimates from different seeds.",
  "Rerun the estimate with degree top-coded or rounded, to see how sensitive it is to reporting errors.",
  "Compare with a sampler that does not rely on the same assumptions, if one exists.",
]

do_not_claim = [
  "That the estimate is design-unbiased when the assumptions are not checked.",
  "That a narrow interval from a naive formula reflects the real uncertainty.",
  "That a chain that stayed within one group describes the others.",
]

report_template = "Respondents were recruited by {recruiters} for {waves} waves from {seeds} seeds, with at most {coupons} recruits each. Estimates of {quantity} weight each respondent by the inverse of their reported degree ({estimate}); degree was {degree_quality}. The estimate rests on random recruitment and accurate degree, which were checked by {checks}."

related = ["snowball-sampling", "degree"]
sources = ["heckathorn1997respondent", "feld1991friends", "kolaczyk2009statistical"]

[knappnet]
rust = "The long-run chance of reaching person i is degree[i] / sum(degree); weights are written by hand in the chapter"
r = "The long-run chance of reaching person i is net_degree(g) / sum(net_degree(g)); weights are written by hand in the chapter"
python = "p = d / d.sum(); weighted = (p * y / d).sum() / (p / d).sum()"
