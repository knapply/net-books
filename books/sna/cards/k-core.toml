id = "k-core"
title = "k-core and core number"
kind = "measure"
chapter = "subgroups"
summary = "The largest set in which everyone has at least k ties to others in the set; a person's core number is the largest k for which they belong to such a set."
answers = "Who sits inside a dense inner part of the network, in the sense that everyone there has many ties to others there?"

data_requirements = [
  "Ties in which the count of ties is meaningful. For directed networks choose in-, out- or total degree and say which.",
  "A simple network (no loops, no repeated ties), or say how they were handled.",
  "Complete enough data that degrees are not capped by design. If every person named at most three others, the core numbers are capped by the questionnaire.",
]

assumptions = [
  "Having many ties to others who also have many ties is what you mean by 'inner'.",
  "Every tie counts the same. Weighted versions need a stated rule for strength.",
  "The boundary of the network is right: people near the edge of what you collected look peripheral.",
]

readings = [
  { context = "Friendship network", high = "A person in a dense cluster of mutual acquaintances. This does not mean popular or liked.", low = "A person with few ties, or whose ties go to people who have few ties themselves." },
  { context = "Communication network in an organization", high = "Someone in a densely interacting inner group. It is not the same as being a manager, a broker or influential.", low = "Someone at the edge of interaction, or in a small isolated team." },
  { context = "Follow or reply network on a platform", high = "Accounts that interact with many accounts that also interact with many. Automated accounts can sit here, so check for coordination.", low = "Accounts at the fringe: followers with few mutual connections." },
  { context = "Infrastructure or supply network", high = "Nodes in the well-connected backbone. A high core number says redundancy exists, not that the node is critical.", low = "Spur or leaf nodes." },
]

pitfalls = [
  "Calling the k-core a community. Two separate dense groups can form one core, and a core is not a partition of the people.",
  "Comparing core numbers across networks of different density or size without normalizing or comparing ranks.",
  "Treating a person with high betweenness as inner. A broker can have a low core number: in the friendship example of the cohesion chapter, the person with the highest betweenness has a core number below the densest group's.",
  "Ignoring that core numbers follow the degree sequence closely. In many networks core numbers rank people much as degree does.",
]

checks = [
  "Compare core numbers with degree. If they rank people almost the same, the core adds little beyond degree.",
  "Compare with a configuration-model null that keeps every degree and see whether the maximum core number is unusual.",
  "Drop a random 5 to 10 percent of ties several times and see who stays in the highest core.",
  "Look at the k-truss (every tie in at least k - 2 triangles) as a stricter check on cohesion.",
  "Check which sides or attributes the high core spans; a core can cut across the groups.",
]

do_not_claim = [
  "That the people in the highest core are leaders or the most influential.",
  "That the highest core is a cohesive group, since its members need not know each other.",
  "That the people outside the core are unimportant.",
  "That core structure causes an outcome, without evidence beyond the network.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, the highest core is the {k}-core with {size} members; {node} has core number {value}. Core numbers {track_degree_or_not} degree (rank correlation {rho}). The highest core is {stable_or_not} when {perturbation}. This describes a minimum number of ties inside the set, not influence or cohesion."

related = ["components", "connectivity", "modularity", "density"]
sources = ["seidman1983network", "batagelj2003algorithm", "wang2012truss"]

[knappnet]
rust = "compute_coreness(&graph, DegreeMode::All)"
r = "net_coreness(g)"
python = "networkx.core_number(G)"
