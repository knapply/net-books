id = "structural-holes"
title = "Structural holes"
kind = "measure"
chapter = "ego-networks"
summary = "The idea that a person whose contacts are not tied to each other sits across gaps in the network and is placed to carry news between them; effective size, constraint and hierarchy are its three standard measures."
answers = "Are this person's contacts one closed circle that all hear the same things, or are they separate groups, so that the person has the opportunity to link them?"

data_requirements = [
  "Ties must stand for something that can carry news, help or influence between people. If they only record similarity or shared membership, a gap between contacts has no meaning.",
  "The ties among a person's contacts must be recorded, from a whole network or from an ego survey that asked which contacts know each other. A missing tie among contacts is read as 'they do not know each other'.",
  "Every person scored needs at least one contact, and hierarchy needs at least two. With fewer the value is undefined and the functions return NaN.",
  "In directed data, say how arcs become ties (either person names the other, both do, or each direction counted). The choice changes who is scored and by how much.",
]

assumptions = [
  "Contacts who know each other bring the same news, so they count as redundant. Two contacts who know each other but live in different worlds would break this.",
  "A person's attention is divided among contacts in proportion to tie strength, equally when ties are unweighted.",
  "The boundary is right. Contacts outside the data are not seen, so they cannot add gaps or close them.",
  "The three measures agree about what a gap is only in simple cases. Effective size counts how many non-redundant contacts there are, constraint asks how boxed in the person is, and hierarchy asks whether the boxing-in comes from one contact. They can rank people differently.",
]

readings = [
  { context = "Office, who asks whom for help", high = "Low constraint or high effective size: contacts in different teams who do not talk to each other, so the person is placed to carry news between them. Or a job that requires talking to everyone.", low = "High constraint: contacts form one team. That can mean trust and quick agreement, and little news from outside." },
  { context = "Marriage or alliance network among families", high = "A family whose partners are not linked to each other, such as the Medici, who have the lowest constraint (0.210) among the Florentine families. But a family with six partners usually has a low value, so check against networks with the same degrees.", low = "A family whose partners are linked to one another, offering little that they do not already have." },
  { context = "Online platform, who replies to whom", high = "Repliers from separate communities. Also true of a public account whose repliers will never meet each other, where the value shows structure and not a relationship.", low = "Repliers who also reply to each other: a community." },
  { context = "Friendship or support network", high = "Friends from separate circles, so the person has the chance to link them. This says nothing about being liked or trusted.", low = "Friends who are all friends with each other: strong mutual support, and the same news from all of them." },
]

pitfalls = [
  "Reading an opportunity as an achievement. The measures describe a position in the pattern of ties, not what the person did with it.",
  "Ignoring that the measures follow the number of contacts. Among the 21 managers the rank correlation between constraint and number of contacts was about -0.9, so 'low constraint' can mostly mean 'many contacts'.",
  "Assuming the measures agree. In the chapter's friendship network Dev has the largest effective size (3.333) and Hana the lowest constraint.",
  "Treating a person with one contact as a broker. Their constraint is 1, the value for being entirely tied to one person.",
  "Computing from ego networks alone and comparing with whole-network values. Constraint from an ego network alone is at least as high for unweighted, undirected ties.",
  "Using a survey with a cap on named contacts without saying so. A cap of 5 limits effective size to 5.",
  "Treating the evidence as settled. Studies disagree: some found advantages of spanning holes and others found none or the opposite.",
  "Mixing conventions. Programs differ on self-loops, on people without contacts, on how arcs are combined and on weights; compare them on a small network whose values you can check by hand first.",
]

checks = [
  "Compute effective size by hand, n - 2t/n, for two or three people (n contacts, t ties among them) and compare with the program.",
  "Recompute after removing each of the person's contacts in turn. If the person stops being the best placed, the ranking depends on one contact.",
  "Recompute after removing each tie in turn, or a random 5 to 10 percent of ties several times. A stable ranking is defensible, an unstable one is not.",
  "Compare with random networks that keep every node's number of contacts. If the value is ordinary there, it follows from how many contacts the person has.",
  "Report effective size, constraint and the number of contacts together, and say whether they agree about who is best placed.",
  "If directed, run the arcs-counted-both-ways, either-names-the-other and mutual-only versions and report which one you used.",
  "If the claim is about brokering between groups, check it with brokerage roles, which use the groups of the people linked and not only the gaps.",
]

do_not_claim = [
  "That the person has power or influence, or will perform better, without evidence about outcomes.",
  "That brokers do better in your setting. Studies disagree, and many describe one firm or industry at one time, so selection is an open question.",
  "That two people differ when the gap between their scores is within what removing one contact changes.",
  "That a value computed from a sample of ego networks equals the whole-network value.",
  "That the person's contacts are in different groups. Not being tied to each other is not the same as belonging to different groups.",
]

report_template = "In this {tie_meaning} network of {n} {node_type}, {node} has {contacts} contacts, an effective size of {effective_size} and a constraint of {constraint} (rank {rank} of {n}, 1 meaning least constrained). This describes how far the person's contacts are tied to each other, an opportunity in the pattern of ties. It does not show influence, performance or what the person does with it. The ranking is {stable_or_not} when {perturbation}, and the values are {higher_or_lower} than expected in networks with the same degrees ({null_summary}). Ties were {direction_rule} and {weights_rule}."

related = ["constraint", "effective-size", "brokerage-roles", "betweenness", "degree", "density"]
sources = ["burt1992structural", "burt2004structural", "burt2005brokerage", "borgatti1997structural", "granovetter1973strength", "coleman1988social", "ahuja2000collaboration", "uzzi2005collaboration", "everett2005ego"]

[knappnet]
rust = "compute_effective_size(&graph, StructuralHoleOptions::default()); compute_constraint(&graph, StructuralHoleOptions::default()); compute_hierarchy(&graph, StructuralHoleOptions::default())"
r = "net_effective_size(g); net_constraint(g); net_hierarchy(g)"
python = "networkx.effective_size(G); networkx.constraint(G)"
