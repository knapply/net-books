id = "tie-definition"
title = "Defining a tie"
kind = "procedure"
chapter = "networks-as-data"
summary = "Write the sentence that says when there is a tie from A to B, and check that the data, the measure and the question all fit it."
answers = "What exactly does a tie in this dataset mean, and which questions can it and cannot answer?"

data_requirements = [
  "A written sentence of the form: there is a tie from A to B if ... , kept with the data.",
  "A statement of who the nodes are and where the boundary of the data lies.",
  "A note on who reported the tie (the people involved, a third party, a log) and how.",
]

assumptions = [
  "Every row of the tie table was produced by the same rule. A file stitched together from sources with different rules is several networks.",
  "The meaning of a tie is stable across the people and the period covered.",
  "Whatever the tie measures (similarity, a social relation, an interaction, a flow) matches what the measure you compute assumes.",
]

readings = [
  { context = "Marriage or alliance among families", high = "Not applicable: the sentence is a check, not a score. A clear sentence is one that a historian could apply to a new record and get the same answer.", low = "A vague sentence (linked in some way) cannot be applied the same way twice, so counts of ties are not comparable." },
  { context = "Advice or friendship reported in a survey", high = "A sentence that names the question wording and any cap on names (A names B in answer to who do you go to for advice) makes clear that ties are reports, not behavior.", low = "A sentence that hides the wording hides that a different question would have produced a different network." },
  { context = "Online platform events", high = "A sentence that says which event counts (follow, reply, mention) and over what period.", low = "Treating every event type as one tie mixes friendship, attention and conflict." },
  { context = "Transport or supply network", high = "A sentence that says what moves along the tie and whether the value is a volume (strength) or a cost (distance).", low = "A tie defined only as connected, with no statement of what flows, leaves path measures without a meaning." },
]

pitfalls = [
  "Using an interaction log as if it were a social relation: frequent contact does not mean closeness.",
  "Mixing tie types in one table without a relation column.",
  "Letting the measure define the tie after the fact, for example calling co-membership friendship because the tool wants a graph.",
  "Assuming a tie is symmetric because the file stores one row per pair.",
  "Leaving out how ties were reported, so that readers cannot tell whether a missing tie means no tie or no answer.",
]

checks = [
  "Say the sentence aloud for a tie in the data and for a pair that is not tied. If either sounds odd, the sentence needs work.",
  "Check whether the answer would change if the question had been worded another way, or if the other person had been asked (the either and both rules change the number of ties a great deal in the managers' advice data).",
  "List what the tie cannot show, and check that no conclusion in the report depends on it.",
  "Compare the number of ties with what the source could produce: a file with fewer or more ties than the source allows has a coding problem.",
]

do_not_claim = [
  "That ties of different types are interchangeable because they share a file format.",
  "That a tie reported by one person is a mutual bond.",
  "That the absence of a tie means the two never interact, unless the data collection could have recorded it.",
]

report_template = "In this dataset of {n} {node_type}, there is a tie from A to B if {tie_sentence}. Ties were {how_recorded} for {boundary}. The ties are {directed_or_not} and {valued_or_not}. They show {what_it_shows} and do not show {what_it_does_not}."

related = ["boundary-specification", "symmetrization-rules", "tidy-network-data"]
sources = ["borgatti2009network", "wasserman1994social", "marsden1990network"]

[knappnet]
rust = "Keep the tie sentence next to the file; build with Graph::from_edges and check its description (describe())."
r = "net_frame(edges, nodes, directed = ...) with a relation column when types are mixed; print the object to read its description"
python = "nx.DiGraph or nx.Graph from the edge table, and store the sentence in G.graph[\"tie\"]"
