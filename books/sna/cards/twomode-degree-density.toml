id = "twomode-degree-density"
title = "Two-mode degree and density"
kind = "measure"
chapter = "two-mode"
summary = "For two-mode data, a node's degree as a share of the other mode's size, and the density of ties out of the possible between-mode pairs."
answers = "How many of the other kind of node is each node tied to, as a fraction of how many there could be, and how filled in is the whole incidence matrix?"

data_requirements = [
  "A network whose nodes split into two modes, with ties only between modes. Record which mode each node belongs to.",
  "A complete membership or attendance list for the study period and boundary. A missing event or person changes both modes' degrees.",
  "Ties that mean the same thing for every row (attended, wrote, bought), not a mix of kinds of tie.",
]

assumptions = [
  "A tie means co-membership or participation, and a missing tie means absence, not unrecorded.",
  "The two modes are the right ones. If the events are an arbitrary sample of the occasions that matter, shares depend on that sample.",
  "Degree and density use only between-mode pairs. A one-mode formula applied to the same data answers a different question.",
]

readings = [
  { context = "Women and social events", high = "Attended many of the recorded events (a woman) or drew many of the women (an event). Says nothing about who talked to whom.", low = "Attended few events, or a small event. A small event is not a poor one." },
  { context = "Authors and papers", high = "A prolific author, or a paper with many authors. Authorship conventions differ by field, so do not compare across fields.", low = "Few papers, or a paper with one or two authors." },
  { context = "Accounts and hashtags (online platform)", high = "A heavy user of tags, or a widely used tag. Bots and campaigns can create both.", low = "A quiet account or a niche tag." },
  { context = "Directors and boards", high = "A director on many boards, or a large board.", low = "A director on one board, or a small board." },
]

pitfalls = [
  "Using the one-mode density formula. It counts pairs within each mode that can never be tied and understates density, here 0.179 against 0.353 for the southern women.",
  "Averaging degree over all nodes. The mean mixes two different quantities and describes neither mode.",
  "Comparing a person's share with an event's share as if on one scale. They are fractions of different totals.",
  "Reading the top of a ranking when several nodes tie. The software picks one name by a rule you did not choose.",
]

checks = [
  "Compute degree for each mode separately and look at the whole distribution, not only the maximum.",
  "Check for ties at the top and say how many nodes share it.",
  "Recompute without the largest event to see how much each mode's degrees depend on it.",
  "Compare the two-mode density with the one-mode density: the second is lower by construction, so a large gap is expected and is not a finding.",
]

do_not_claim = [
  "That a high degree means popularity, influence or friendliness. It means attended, wrote or bought more.",
  "That two nodes with equal share are equally active when the modes have different sizes.",
  "That density of attendance says how connected the people are to each other.",
]

report_template = "In this two-mode network of {n_first} {first_mode} and {n_second} {second_mode}, {m} ties were recorded, a two-mode density of {density} (the share of the {possible} possible between-mode pairs). {first_mode} were tied to between {first_min} and {first_max} {second_mode}; {second_mode} to between {second_min} and {second_max} {first_mode}. A tie here means {tie_meaning}; it does not show interaction between members of the same mode."

related = ["degree", "density", "projection", "twomode-centrality"]
sources = ["borgatti1997network", "borgatti2011analyzing", "davis1941deep"]

[knappnet]
rust = "knappnet::metrics::bipartite::{compute_twomode_degree(&graph, &is_event, normalized), compute_twomode_density(&graph, &is_event)}"
r = "net_twomode_degree(club, normalized = TRUE); net_twomode_density(club)"
python = "networkx.bipartite.degree_centrality(G, nodes) for shares; density written by hand as ties / (rows * columns)"
