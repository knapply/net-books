id = "brokerage-roles"
title = "Gould-Fernandez brokerage roles"
kind = "measure"
chapter = "ego-networks"
summary = "For each person, how many pairs they link i to j to k with no tie from i to k, split into five roles by the groups of the three people."
answers = "What kind of go-between is this person, given the groups of the people they connect: inside their own group, for outsiders, or between two other groups?"

data_requirements = [
  "A directed network, since a brokered pair needs an order (i to j to k).",
  "A group for every node, fixed before looking at the ties (department, team, side).",
  "Binary ties. Weights are ignored and a repeated tie counts once.",
]

assumptions = [
  "A broker is a person on a two-step route from i to k with no direct tie from i to k. Longer routes are not counted.",
  "The groups are the right ones. Different groupings give different roles for the same person.",
  "Ties mean something that can be passed along (work, information, requests), in the direction of the arrow.",
]

readings = [
  { context = "Office, who passes work to whom, groups are teams", high = "Many gatekeeper or liaison counts: a person through whom work enters a team or moves between teams. Many coordinator counts: a person who connects members of their own team.", low = "Few brokered pairs. Others pass work along other routes, or the person sits at the end of a chain." },
  { context = "Online platform, groups are communities", high = "Liaison and representative counts mark accounts that connect communities. They may be bridges, or accounts that others merely mention.", low = "Few brokered pairs." },
  { context = "Neighborhood or community organization, groups are blocks or congregations", high = "Representatives pass requests from their block outward, and gatekeepers control entry into theirs.", low = "Few brokered pairs." },
]

pitfalls = [
  "Counts grow with the number of contacts, so a well-connected person has large counts in every role. Compare against people in a similar position or against random networks with the same degrees.",
  "Reading a count as skill or intent. The roles describe a pattern in the ties, not what the person did.",
  "Assuming every tool counts the same way. The knappnet documentation says that on an undirected network each tie is read as two arrows, so a broker of two untied contacts is counted twice. Check your tool on the chapter's nine-person network, where all 11 brokered pairs can be listed by hand.",
  "Mixing up role labels. Representative and gatekeeper are mirror images (the broker shares the first or the last person's group), and some sources use other names, such as consultant for itinerant.",
  "Using groups that were found from the ties themselves (for example communities), which builds the answer into the groups.",
]

checks = [
  "List the brokered pairs for one person by hand and compare with the counts.",
  "Recompute after removing a few percent of arrows several times.",
  "Recompute with a different but defensible grouping, such as department against floor.",
  "Compare each person's total with their degree, and with the totals in random networks that keep the degrees.",
]

do_not_claim = [
  "That a person with many counts controls what flows through them.",
  "That the roles describe whole groups. They are properties of single people in one directed network.",
  "That counts from a sample of ego networks are the whole-network counts: brokered pairs involve the contacts' own ties.",
]

report_template = "In this directed {tie_meaning} network of {n} {node_type} in {k} groups, {node} brokers {total} pairs: {coordinator} as coordinator, {itinerant} as itinerant, {representative} as representative, {gatekeeper} as gatekeeper and {liaison} as liaison. These count two-step routes with no direct tie, not influence. The counts {stable_or_not} when {perturbation}, and {node} has {degree} contacts, which sets the scale."

related = ["constraint", "effective-size", "betweenness", "ei-index"]
sources = ["gould1989structures", "everton2012disrupting", "burt1992structural"]

[knappnet]
rust = "compute_brokerage(&graph, &groups, 0)"
r = "net_brokerage(g, groups)"
python = "no NetworkX function; count i -> j -> k with no i -> k by hand"
