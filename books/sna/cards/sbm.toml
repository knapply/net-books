id = "sbm"
title = "Stochastic block model (plain and degree-corrected)"
kind = "model"
chapter = "latent-space"
summary = "A model in which every node belongs to one block and the chance of a tie depends only on the two nodes' blocks, optionally corrected for each node's own popularity."
answers = "Do the ties follow a pattern of groups, and which grouping, with how many blocks, gives the most economical account of the network?"

data_requirements = [
  "One network observed once, with a clear boundary.",
  "Ties that are present or absent; there are versions for counts and weights.",
  "Enough ties that a block can pay for itself: with 34 people and 78 ties, the karate club's two sides did not.",
  "A choice between the plain and degree-corrected form, and of how the number of blocks is chosen, both reported.",
]

assumptions = [
  "Given the blocks, ties are independent with a chance that depends only on the two blocks.",
  "In the plain model, nodes in a block have the same expected degree; busy nodes then tend to form blocks of their own.",
  "The grouping searched for is the best the search found, which is not guaranteed to be the best grouping.",
  "The criterion for the number of blocks (BIC, ICL, description length) is itself a modeling choice. On the karate club they gave different verdicts on whether the two sides beat one block.",
]

readings = [
  { context = "Friendship network with two camps (the karate club)", high = "The block matrix for five hubs and everyone else reads 0.50 among hubs, 0.37 between hubs and the rest, and 0.05 among the rest: a core-periphery pattern, not two camps.", low = "A grouping with small gain over one block is a statement about degrees, not groups: in 20 degree-matched networks with no groups, the plain model found two or more groups every time in Rust and R (19 times in Python), with gains up to 16.7 nats against the club's 19.3." },
  { context = "Marriage or alliance network among families", high = "A block of families that marry mostly into each other and into one hub family suggests a core-periphery pattern.", low = "A block of one is usually the busiest family, not a group." },
  { context = "Office or communication network", high = "Blocks can be departments or roles; the block matrix says which role talks to which.", low = "A block of a few busy people may be hubs that any model with no degree term must put somewhere." },
  { context = "Online platform", high = "Blocks are audiences or interest groups, and the matrix shows which audience follows which.", low = "A few very large accounts form their own block unless degree correction is used." },
]

pitfalls = [
  "Calling a block a community. A block is a group with the same tie pattern, which can be hubs, a periphery, or one side of a bipartite-like pattern.",
  "Reading the number of blocks found as the true number. It is the shortest description under one model and one search.",
  "Using the plain model on a network with a skewed degree distribution without checking that the blocks are not just degrees.",
  "Comparing criteria across models as if they agreed: BIC does not charge for naming the members and ICL and description length do.",
  "Passing a goodness-of-fit check that the model was fitted to pass: a hubs-and-the-rest grouping reproduces degrees because it was built from them.",
  "Reporting a single run of a heuristic search. Report restarts and whether they agreed.",
]

checks = [
  "Compare the plain and degree-corrected descriptions, and report both.",
  "Fit to networks that keep each degree (or the expected degrees, as with the Chung-Lu model) and have no groups, and compare the gain over one block.",
  "Drop a few percent of ties at random, refit, and measure agreement with the full-network grouping, for example with the adjusted Rand index.",
  "Simulate networks from the fit and compare summaries you did not fit (degree spread, busiest member, triangles, pairs two steps apart).",
  "Ask how sure the grouping is: the cost in nats of moving each member to another block.",
  "Report BIC, ICL and description length together when they disagree.",
]

do_not_claim = [
  "That the blocks are the true groups or communities of the people.",
  "That the number of blocks found is the number of groups that exist.",
  "That two nodes in a block have anything in common except their tie pattern.",
  "That no structure exists beyond the blocks found, or that the sides of the karate club are not real: only that the ties alone did not pay for them.",
  "That a grouping that passes a check built from its own summaries fits the network.",
]

report_template = "A {variant} stochastic block model was fitted to {network} ({n} {node_type}, {m} ties) with {restarts} restarts of {method}. The shortest description had {k} blocks of sizes {sizes}, with a block matrix of {matrix}; it was {gain} nats shorter than one block. Against {n_null} random networks with the same degrees the gain was {null_gain}. The grouping {stability} when {share} of the ties were dropped. This describes a pattern in these ties and does not show that the blocks are groups that exist outside them."

related = ["latent-space-model", "ergm", "modularity", "partition-comparison", "configuration-model"]
sources = ["holland1983stochastic", "nowicki2001estimation", "karrer2011stochastic", "peixoto2017nonparametric", "peixoto2014efficient", "daudin2008mixture", "biernacki2000assessing", "schwarz1978estimating", "airoldi2008mixed", "decelle2011asymptotic", "abbe2018community"]

[knappnet]
rust = "knappnet::sbm::{fit, compute_description_length, move_delta, sample}"
r = "no CRAN package for the description-length fit from a plain network; the chapter writes it by hand (see also blockmodels, graph-tool through reticulate)"
python = "graph_tool.inference.minimize_blockmodel_dl, or the chapter's hand-written description length"
