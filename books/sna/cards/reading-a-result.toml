id = "reading-a-result"
title = "Reading a computed result"
kind = "procedure"
chapter = "getting-started"
summary = "Four questions to ask of any number a tool returns: what it was computed on, what choices the tool made, whether a small piece can be checked by hand, and what would change your mind."
answers = "Before I report this number, do I know what it is, how it was computed, and what would show it wrong?"

data_requirements = [
  "The network the number was computed on, with its direction, weights, loops and parallel ties stated.",
  "The tool, its version and the options or conventions used (normalization, weight meaning, loop handling).",
  "A small case, real or constructed, on which the measure can be worked by hand.",
]

assumptions = [
  "Two tools that give the same measure a name use the same convention. They often do not.",
  "A result that runs without an error is correct. Mistakes in the data usually load without an error.",
  "A tool's default is a choice, and it may not be the choice you would make.",
]

readings = [
  { context = "A raw count and a normalized score of the same measure", high = "A value between 0 and 1 is usually a share of the largest possible count; check what that count is before comparing across networks.", low = "A raw count grows with network size and cannot be compared across networks of different sizes." },
  { context = "A tool that reports a value for every node", high = "A score for every node is a ranking only if the scores are not tied; report ties as ties.", low = "A tool that orders ties by node number or by chance gives an order that is not a result." },
  { context = "A small hand-checkable network", high = "Agreement with the hand count shows that the code does what you think on this case.", low = "Disagreement means a typo in the data or a different convention, and one of the two must be found before going on." },
  { context = "A real network with thousands of nodes", high = "Check one node or one pair by hand, and the sum of the scores against a quantity you can count.", low = "Without any hand check, an error in the table can be present at every node." },
]

pitfalls = [
  "Comparing a normalized value from one tool with a raw value from another: betweenness for one person in the five-coworker network is 3 raw and 0.250 in NetworkX's default, and for manager 18 of the 21 managers it is 88.917 raw and 0.234.",
  "Treating the first run as the answer and not checking the counts of nodes and ties against the source.",
  "Reading a tied top of a list as an order.",
  "Not recording the tool and options, so that nobody, including you, can reproduce the number.",
]

checks = [
  "Reproduce the number on a network small enough to count by hand, then on the real network.",
  "Compute it with a second implementation and compare, naming any convention that differs.",
  "Change one thing that should not matter (the order of the rows in the file) and confirm that the number does not change.",
  "Ask what result would have made you change your mind about the claim. If none, the number is decoration.",
]

do_not_claim = [
  "That agreement between two tools proves the result is right for your data; it shows only that they compute the same thing.",
  "That a number from a well-known tool needs no check of its options.",
]

report_template = "The {measure} was computed on a {directed_or_not} network of {n} {node_type} and {m} ties, using {tool} with {options}. A hand check on {small_case} gave {hand_value}, which matched. The result is {value}."

related = ["first-analysis", "tie-deletion-stress-test", "cross-tool-comparison"]
sources = ["freeman1977set", "brandes2001faster", "hagberg2008exploring"]

[knappnet]
rust = "BetweennessOptions { normalized: true, ..Default::default() } and similar options; print Graph::describe() before computing"
r = "net_betweenness(g, normalized = TRUE) and the convention argument of the measure; print the net_frame to read its description"
python = "nx.betweenness_centrality(G, normalized=False) for the raw count; read the function's documented defaults"
