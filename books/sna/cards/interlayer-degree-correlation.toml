id = "interlayer-degree-correlation"
title = "Inter-layer degree correlation"
kind = "measure"
chapter = "multilayer"
summary = "The correlation, over people, between a person's number of ties in one layer and in another, usually with a rank correlation next to the ordinary one."
answers = "Are the people who are busy in one kind of tie also busy in another?"

data_requirements = [
  "Two or more layers on the same people.",
  "A stated choice of in-degree, out-degree or total degree, since they can disagree.",
  "Enough variation in degree. If a layer fixes everyone's degree (one boss each, or a top-three question), the correlation has almost nothing to work with.",
]

assumptions = [
  "Degree is a sensible summary of a person's activity in each layer. In layers with a cap, degree is set by the questionnaire.",
  "A few very high-degree people can dominate an ordinary correlation, which is why the rank version is printed too.",
  "The people are a fixed set. The correlation describes these people, not a population.",
]

readings = [
  { context = "Office: how many people seek you out for advice and how many name you a friend", high = "The people sought for advice are also named as friends, so one kind of prominence coincides with another.", low = "Prominence in advice and in friendship are different. Krackhardt's advice and friendship in-degrees have a rank correlation of 0.14." },
  { context = "Transport: connections per town in two systems", high = "The same hubs serve both systems.", low = "Each system has its own hubs." },
  { context = "Online platform: followers and replies received", high = "Accounts that attract follows also attract replies.", low = "Following and replying are produced by different accounts. A few celebrity accounts can make the ordinary correlation misleading." },
]

pitfalls = [
  "Confusing it with overlap. The degree correlation asks whether the same people are busy, overlap asks whether the same pairs are tied. Advice and friendship overlap at 1.3 times chance while their in-degree rank correlation is 0.14.",
  "Reading the out-degree correlation of a layer with fixed out-degrees, such as reporting lines.",
  "Reporting only the ordinary correlation when one or two people have extreme degrees. Here 0.31 against 0.14.",
  "Treating degree correlations as comparable across layers of very different density.",
]

checks = [
  "Print the rank correlation next to the ordinary one.",
  "Look at the degree distribution of each layer for caps and extreme values.",
  "Repeat with in-degree, out-degree and total degree.",
  "Drop the highest-degree person and recompute.",
]

do_not_claim = [
  "That busy people in one layer cause busyness in another.",
  "That the same pairs are tied in both layers.",
  "That a correlation near zero means the layers are unrelated; they may still overlap on pairs.",
]

report_template = "Among {n} {node_type}, the in-degrees in the {layer_a} and {layer_b} layers have a correlation of {r} and a rank correlation of {rho}. This says whether the same {node_type} receive many ties in both layers; it does not say that the same pairs are tied, and it describes one moment."

related = ["layer-overlap", "degree", "weighted-degree"]
sources = ["battiston2014structural", "kivela2014multilayer", "krackhardt1987cognitive"]

[knappnet]
rust = "knappnet::compute_degree(&g, DegreeMode::In, true) for each layer, then correlate the two vectors"
r = "cor(colSums(a), colSums(b), method = \"spearman\")"
python = "np.corrcoef(a.sum(axis=0), b.sum(axis=0))[0, 1]"
