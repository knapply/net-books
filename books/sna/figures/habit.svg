<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>The five-step habit</title>
<desc>Five boxes in a row: idea, data, compute, interpret, doubt, with an arrow looping from doubt back to idea.</desc>
<defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="800" height="240" fill="#ffffff"/>
<rect x="16" y="46" width="140" height="66" rx="10" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="86.0" y="76.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">1. Idea</text>
<text x="86.0" y="98.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">what social claim?</text>
<line x1="159.0" y1="79.0" x2="164.0" y2="79.0" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-0072B2)"/>
<rect x="170" y="46" width="140" height="66" rx="10" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="240.0" y="76.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">2. Data</text>
<text x="240.0" y="98.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">what is a tie?</text>
<line x1="313.0" y1="79.0" x2="318.0" y2="79.0" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-0072B2)"/>
<rect x="324" y="46" width="140" height="66" rx="10" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="394.0" y="76.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">3. Compute</text>
<text x="394.0" y="98.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">by hand, then code</text>
<line x1="467.0" y1="79.0" x2="472.0" y2="79.0" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-0072B2)"/>
<rect x="478" y="46" width="140" height="66" rx="10" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="548.0" y="76.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">4. Interpret</text>
<text x="548.0" y="98.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">tie back to the idea</text>
<line x1="621.0" y1="79.0" x2="626.0" y2="79.0" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow-0072B2)"/>
<rect x="632" y="46" width="140" height="66" rx="10" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="702.0" y="76.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">5. Doubt</text>
<text x="702.0" y="98.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">other conventions?</text>
<path d="M702,114 V170 H86 V116" fill="none" stroke="#0072B2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-0072B2)"/>
<text x="400.0" y="192.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic">revise the question, the data, or the claim, and go round again</text>
</svg>
