<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>One small network, three clustering numbers</title>
<desc>Five people: a triangle of Ana, Ben and Chloe, with Dev tied to Chloe and Eli tied to Dev. Each person is labeled with a local clustering coefficient.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<line x1="110.0" y1="115.0" x2="110.0" y2="205.0" stroke="#6b7280" stroke-width="2.6"/>
<line x1="132.4" y1="101.2" x2="227.6" y2="148.8" stroke="#6b7280" stroke-width="2.6"/>
<line x1="132.4" y1="218.8" x2="227.6" y2="171.2" stroke="#6b7280" stroke-width="2.6"/>
<line x1="275.0" y1="160.0" x2="365.0" y2="160.0" stroke="#6b7280" stroke-width="2.6"/>
<line x1="415.0" y1="160.0" x2="505.0" y2="160.0" stroke="#6b7280" stroke-width="2.6"/>
<circle cx="110" cy="90" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="110.0" y="94.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<text x="110.0" y="136.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C = 1.00</text>
<text x="110.0" y="153.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">1 of 1 pairs</text>
<circle cx="110" cy="230" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="110.0" y="234.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<text x="110.0" y="276.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C = 1.00</text>
<text x="110.0" y="293.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">1 of 1 pairs</text>
<circle cx="250" cy="160" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="250.0" y="164.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Chloe</text>
<text x="250.0" y="206.0" font-size="13" text-anchor="middle" font-weight="600" fill="#E69F00">C = 0.33</text>
<text x="250.0" y="223.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">1 of 3 pairs</text>
<circle cx="390" cy="160" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="390.0" y="164.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<text x="390.0" y="206.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C = 0.00</text>
<text x="390.0" y="223.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0 of 1 pairs</text>
<circle cx="530" cy="160" r="24" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="530.0" y="164.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<text x="530.0" y="206.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C = undefined</text>
<text x="530.0" y="223.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0 of 0 pairs</text>
<text x="610.0" y="80.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">Three summaries of the same people</text>
<text x="610.0" y="112.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Global transitivity   0.500</text>
<text x="610.0" y="134.1" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Average local, Eli left out   0.583</text>
<text x="610.0" y="156.2" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Average local, Eli counted as 0   0.467</text>
<text x="610.0" y="190.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">3 x 1 triangle over 6 connected</text>
<text x="610.0" y="208.1" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">triples, against the mean of four</text>
<text x="610.0" y="226.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">(or five) separate ratios.</text>
</svg>
