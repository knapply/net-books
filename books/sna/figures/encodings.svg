<text x="600.0" y="70.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">Size</text>
<text x="600.0" y="90.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">number of ties</text>
<text x="600.0" y="108.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">bigger node, more ties</text>
<text x="600.0" y="142.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">Shape and color</text>
<text x="600.0" y="162.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">group</text>
<text x="600.0" y="180.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">both, so it reads in greyscale</text>
<text x="600.0" y="214.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">Thickness</text>
<text x="600.0" y="234.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">tie strength</text>
<text x="600.0" y="252.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">thicker line, stronger tie</text>
<text x="600.0" y="286.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">Position</text>
<text x="600.0" y="306.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">closeness in the network</text>
<text x="600.0" y="324.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">set by the layout, not by you</text>
</svg>
