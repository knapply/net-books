<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Four ways to show what a node or tie is like</title>
<desc>A ten-node network where node size shows number of ties, shape and color show group, and line thickness shows tie strength. Callouts name each channel.</desc>
<defs></defs>
<rect width="900" height="360" fill="#ffffff"/>
<line x1="223.9" y1="200.8" x2="153.2" y2="146.2" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="221.9" y1="210.2" x2="146.2" y2="229.6" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="228.6" y1="217.8" x2="196.7" y2="299.7" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="243.3" y1="205.1" x2="327.0" y2="186.2" stroke="#9ca3af" stroke-width="3.6"/>
<line x1="134.3" y1="143.6" x2="58.6" y2="174.0" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="143.4" y1="150.4" x2="136.6" y2="221.4" stroke="#9ca3af" stroke-width="3.6"/>
<line x1="57.7" y1="183.9" x2="126.2" y2="226.5" stroke="#9ca3af" stroke-width="3.6"/>
<line x1="142.0" y1="241.2" x2="186.2" y2="301.1" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="347.4" y1="178.6" x2="420.3" y2="140.3" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="347.1" y1="189.4" x2="415.6" y2="230.7" stroke="#9ca3af" stroke-width="2.3"/>
<line x1="429.5" y1="146.2" x2="425.6" y2="225.3" stroke="#9ca3af" stroke-width="6.2"/>
<line x1="434.6" y1="125.2" x2="468.7" y2="50.0" stroke="#9ca3af" stroke-width="6.2"/>
<line x1="440.8" y1="132.9" x2="520.9" y2="115.6" stroke="#9ca3af" stroke-width="3.6"/>
<line x1="480.1" y1="48.6" x2="524.8" y2="104.6" stroke="#9ca3af" stroke-width="6.2"/>
<circle cx="232.56473711088637" cy="207.49842290874923" r="15.8" fill="#0072B233" stroke="#0072B2" stroke-width="2"/>
<circle cx="144.48388075349322" cy="139.45602057293908" r="13.600000000000001" fill="#0072B233" stroke="#0072B2" stroke-width="2"/>
<circle cx="48.39230871840229" cy="178.07532116187917" r="11.4" fill="#0072B233" stroke="#0072B2" stroke-width="2"/>
<circle cx="135.51337923361748" cy="232.3601148464616" r="15.8" fill="#0072B233" stroke="#0072B2" stroke-width="2"/>
<circle cx="192.72876148720593" cy="310.0" r="11.4" fill="#0072B233" stroke="#0072B2" stroke-width="2"/>
<rect x="324.0982626460707" y="170.1319286566213" width="27.200000000000003" height="27.200000000000003" rx="3" fill="#E69F0033" stroke="#E69F00" stroke-width="2"/>
<rect x="414.26360074592554" y="119.4229999757329" width="31.6" height="31.6" rx="3" fill="#E69F0033" stroke="#E69F00" stroke-width="2"/>
