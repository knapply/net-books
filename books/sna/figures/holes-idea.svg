<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Redundant contacts and structural holes</title>
<desc>Two ego networks with three contacts each. On the left the contacts all know each other. On the right none do.</desc>
<defs></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="230.0" y="28.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Contacts who all know each other</text>
<line x1="239.0" y1="90.6" x2="307.6" y2="209.4" stroke="#0072B2" stroke-width="2.4"/>
<line x1="298.6" y1="225.0" x2="161.4" y2="225.0" stroke="#0072B2" stroke-width="2.4"/>
<line x1="152.4" y1="209.4" x2="221.0" y2="90.6" stroke="#0072B2" stroke-width="2.4"/>
<line x1="230.0" y1="153.0" x2="230.0" y2="93.0" stroke="#b6bcc6" stroke-width="1.4"/>
<line x1="249.1" y1="186.0" x2="301.0" y2="216.0" stroke="#b6bcc6" stroke-width="1.4"/>
<line x1="210.9" y1="186.0" x2="159.0" y2="216.0" stroke="#b6bcc6" stroke-width="1.4"/>
<circle cx="230.0" cy="75.0" r="17" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<circle cx="316.6025403784439" cy="225.0" r="17" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<circle cx="143.39745962155612" cy="225.0" r="17" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<rect x="209" y="154" width="42" height="42" rx="3" fill="#E69F0033" stroke="#E69F00" stroke-width="2.6"/>
<text x="230.0" y="179.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">ego</text>
<text x="230.0" y="312.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">effective size 1</text>
<text x="230.0" y="333.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">one contact&#x27;s worth of news</text>
<text x="670.0" y="28.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Contacts who do not know each other</text>
<line x1="670.0" y1="153.0" x2="670.0" y2="93.0" stroke="#b6bcc6" stroke-width="1.4"/>
<line x1="689.1" y1="186.0" x2="741.0" y2="216.0" stroke="#b6bcc6" stroke-width="1.4"/>
<line x1="650.9" y1="186.0" x2="599.0" y2="216.0" stroke="#b6bcc6" stroke-width="1.4"/>
<circle cx="670.0" cy="75.0" r="17" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<circle cx="756.6025403784439" cy="225.0" r="17" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<circle cx="583.3974596215561" cy="225.0" r="17" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<rect x="649" y="154" width="42" height="42" rx="3" fill="#E69F0033" stroke="#E69F00" stroke-width="2.6"/>
<text x="670.0" y="179.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">ego</text>
<text x="670.0" y="312.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">effective size 3</text>
<text x="670.0" y="333.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">three separate worlds, three contacts&#x27; worth</text>
</svg>
