<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Balanced and unbalanced triangles</title>
<desc>Four triangles of three people with positive or negative ties. Triangles with all positive ties, or with exactly one positive tie, are balanced. Triangles with two positive ties and one negative, or all negative, are unbalanced.</desc>
<defs></defs>
<rect width="860" height="350" fill="#ffffff"/>
<line x1="100.1" y1="73.0" x2="61.9" y2="131.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="90.2" cy="108.1" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="90.2" y="113.1" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="70.0" y1="146.0" x2="150.0" y2="146.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="110.0" cy="135.0" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="110.0" y="140.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="119.9" y1="73.0" x2="158.1" y2="131.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="148.2" cy="95.9" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="148.2" y="100.9" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<circle cx="110" cy="58" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="110.0" y="62.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="52" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="52.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="168" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="168.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="110.0" y="206.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">(+)(+)(+) = +</text>
<text x="110.0" y="232.0" font-size="15" text-anchor="middle" font-weight="700" fill="#009E73">✓ Balanced</text>
<text x="110.0" y="254.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">everyone gets along</text>
<line x1="314.1" y1="73.0" x2="275.9" y2="131.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="304.2" cy="108.1" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="304.2" y="113.1" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="284.0" y1="146.0" x2="364.0" y2="146.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<circle cx="324.0" cy="135.0" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="324.0" y="140.0" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<line x1="333.9" y1="73.0" x2="372.1" y2="131.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<circle cx="362.2" cy="95.9" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="362.2" y="100.9" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<circle cx="324" cy="58" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="324.0" y="62.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="266" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="266.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="382" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="382.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="324.0" y="206.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">(+)(−)(−) = +</text>
<text x="324.0" y="232.0" font-size="15" text-anchor="middle" font-weight="700" fill="#009E73">✓ Balanced</text>
<text x="324.0" y="254.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">two friends, one shared enemy</text>
<line x1="528.1" y1="73.0" x2="489.9" y2="131.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="518.2" cy="108.1" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="518.2" y="113.1" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="498.0" y1="146.0" x2="578.0" y2="146.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="538.0" cy="135.0" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="538.0" y="140.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="547.9" y1="73.0" x2="586.1" y2="131.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<circle cx="576.2" cy="95.9" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="576.2" y="100.9" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<circle cx="538" cy="58" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="538.0" y="62.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="480" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="480.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="596" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="596.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="538.0" y="206.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">(+)(+)(−) = −</text>
<text x="538.0" y="232.0" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">✗ Unbalanced</text>
<text x="538.0" y="254.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">A is torn between two friends</text>
<line x1="742.1" y1="73.0" x2="703.9" y2="131.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<circle cx="732.2" cy="108.1" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="732.2" y="113.1" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<line x1="712.0" y1="146.0" x2="792.0" y2="146.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<circle cx="752.0" cy="135.0" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="752.0" y="140.0" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<line x1="761.9" y1="73.0" x2="800.1" y2="131.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<circle cx="790.2" cy="95.9" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="790.2" y="100.9" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<circle cx="752" cy="58" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="752.0" y="62.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="694" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="694.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="810" cy="146" r="17" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="810.0" y="150.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="752.0" y="206.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">(−)(−)(−) = −</text>
<text x="752.0" y="232.0" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">✗ Unbalanced</text>
<text x="752.0" y="254.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">no one likes anyone</text>
<line x1="201.0" y1="306.0" x2="239.0" y2="306.0" stroke="#0072B2" stroke-width="2.6"/>
<text x="248.0" y="311.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">positive tie (like)</text>
<line x1="431.0" y1="306.0" x2="469.0" y2="306.0" stroke="#D55E00" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="478.0" y="311.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">negative tie (dislike)</text>
<text x="430.0" y="332.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Multiply the signs: a positive product means balanced.</text>
</svg>
