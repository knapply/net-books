<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>From two people to three</title>
<desc>Three small diagrams: a pair of connected people, a triangle of three connected people, and a person in the middle linking two others who have no direct tie.</desc>
<defs></defs>
<rect width="780" height="260" fill="#ffffff"/>
<line x1="99.0" y1="110.0" x2="161.0" y2="110.0" stroke="#6b7280" stroke-width="2.5"/>
<circle cx="80" cy="110" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="80.0" y="114.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="180" cy="110" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="180.0" y="114.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<text x="130.0" y="205.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A dyad</text>
<text x="130.0" y="227.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">If either leaves, the pair is over</text>
<line x1="379.9" y1="78.1" x2="345.1" y2="133.9" stroke="#6b7280" stroke-width="2.5"/>
<line x1="354.0" y1="150.0" x2="426.0" y2="150.0" stroke="#6b7280" stroke-width="2.5"/>
<line x1="400.1" y1="78.1" x2="434.9" y2="133.9" stroke="#6b7280" stroke-width="2.5"/>
<circle cx="390" cy="62" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="390.0" y="66.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="335" cy="150" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="335.0" y="154.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="445" cy="150" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="445.0" y="154.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="390.0" y="205.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A triad</text>
<text x="390.0" y="227.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">A third person changes the structure</text>
<line x1="600.7" y1="134.3" x2="639.3" y2="77.7" stroke="#6b7280" stroke-width="2.5"/>
<line x1="660.7" y1="77.7" x2="699.3" y2="134.3" stroke="#6b7280" stroke-width="2.5"/>
<line x1="609.0" y1="150.0" x2="691.0" y2="150.0" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>
<text x="650.0" y="170.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic">no direct tie</text>
<circle cx="590" cy="150" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="590.0" y="154.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="710" cy="150" r="18" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="710.0" y="154.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<circle cx="650" cy="62" r="18" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<text x="650.0" y="66.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<text x="650.0" y="205.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A go-between</text>
<text x="650.0" y="227.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">B can mediate, or be bypassed</text>
</svg>
