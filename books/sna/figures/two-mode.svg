<text x="80.0" y="164.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">P2</text>
<circle cx="80" cy="230" r="17" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="80.0" y="234.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">P3</text>
<circle cx="80" cy="300" r="17" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
