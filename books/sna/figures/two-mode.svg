<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A two-mode network and its one-mode projection</title>
<desc>Left: four people linked to the three events they attended. Right: the four people linked to each other when they attended an event together, each tie labeled with the shared event.</desc>
