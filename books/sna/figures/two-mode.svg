<text x="290.0" y="269.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">E3</text>
<text x="80.0" y="355.0" font-size="12" text-anchor="middle" font-weight="600" fill="#0072B2">people</text>
<text x="290.0" y="355.0" font-size="12" text-anchor="middle" font-weight="600" fill="#E69F00">events</text>
