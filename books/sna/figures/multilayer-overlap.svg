<text x="658.0" y="73.0" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">122</text>
<text x="218.0" y="106.0" font-size="13" text-anchor="end" font-weight="400" fill="#1f2937">friendship</text>
