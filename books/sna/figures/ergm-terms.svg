<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Common ERGM statistics</title>
<desc>Six panels, each showing one pattern that an exponential random graph model can count.</desc>
