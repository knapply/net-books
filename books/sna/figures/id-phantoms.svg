<text x="560.0" y="318.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Compare every id with the roster.</text>
<text x="560.0" y="338.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Whatever is left over is a typo, not a person.</text>
