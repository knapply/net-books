<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>What the reciprocity coefficient does to a simulated network</title>
<desc>Bars for the average number of ties and of mutual pairs at the start of the period and after simulating it with and without a reciprocity effect.</desc>
<defs></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="260.0" y="60.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Ties</text>
<rect x="150" y="82.0" width="52" height="208.0" rx="0" fill="#9ca3af55" stroke="#9ca3af" stroke-width="2"/>
<text x="176.0" y="74.0" font-size="13" text-anchor="middle" font-weight="600" fill="#9ca3af">13</text>
<rect x="220" y="197.51999999999998" width="52" height="92.48" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="246.0" y="189.5" font-size="13" text-anchor="middle" font-weight="600" fill="#E69F00">5.78</text>
<rect x="290" y="172.72" width="52" height="117.28" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="316.0" y="164.7" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">7.33</text>
<line x1="140" y1="290" x2="370" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<text x="660.0" y="60.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Mutual pairs</text>
<rect x="550" y="178.0" width="52" height="112.0" rx="0" fill="#9ca3af55" stroke="#9ca3af" stroke-width="2"/>
<text x="576.0" y="170.0" font-size="13" text-anchor="middle" font-weight="600" fill="#9ca3af">1.00</text>
<rect x="620" y="269.84" width="52" height="20.16" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="646.0" y="261.8" font-size="13" text-anchor="middle" font-weight="600" fill="#E69F00">0.18</text>
<rect x="690" y="158.96" width="52" height="131.04" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="716.0" y="151.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">1.17</text>
<line x1="540" y1="290" x2="770" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="220" y="322" width="16" height="16" rx="0" fill="#9ca3af55" stroke="#9ca3af" stroke-width="2"/>
<text x="244.0" y="335.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">start of period</text>
<rect x="410" y="322" width="16" height="16" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="434.0" y="335.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">reciprocity 0</text>
<rect x="600" y="322" width="16" height="16" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="624.0" y="335.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">reciprocity 1.5</text>
</svg>
