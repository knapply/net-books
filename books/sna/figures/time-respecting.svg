<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Who can pass something on to whom, when contacts happen in order</title>
<desc>Two timelines of the same six contacts. The left highlights what Ana can reach, the right what Dev can reach.</desc>
