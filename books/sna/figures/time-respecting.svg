<text x="450.0" y="385.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Dev reaches Ana, but Ana cannot reach Dev: the Cleo to Dev contact (t=2) happened before Ben and Cleo met (t=3).</text>
