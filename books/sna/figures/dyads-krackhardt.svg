<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Dyads in the three Krackhardt relations</title>
