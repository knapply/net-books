<circle cx="601.9" cy="295.0" r="3.5" fill="#0072B2"/>
<circle cx="660.0" cy="299.4" r="3.5" fill="#0072B2"/>
<text x="306.3" y="208.0" font-size="13" text-anchor="start" font-weight="700" fill="#0072B2">closeness</text>
<polyline points="80.0,40.0 164.3,175.0 219.8,220.0 294.3,256.0 401.0,283.0 465.2,292.0 547.3,299.2 601.9,302.3 660.0,304.6" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="80.0" cy="40.0" r="3.5" fill="#D55E00"/>
<circle cx="164.3" cy="175.0" r="3.5" fill="#D55E00"/>
<circle cx="219.8" cy="220.0" r="3.5" fill="#D55E00"/>
<circle cx="294.3" cy="256.0" r="3.5" fill="#D55E00"/>
<circle cx="401.0" cy="283.0" r="3.5" fill="#D55E00"/>
<circle cx="465.2" cy="292.0" r="3.5" fill="#D55E00"/>
<circle cx="547.3" cy="299.2" r="3.5" fill="#D55E00"/>
<circle cx="601.9" cy="302.3" r="3.5" fill="#D55E00"/>
<circle cx="660.0" cy="304.6" r="3.5" fill="#D55E00"/>
<text x="284.3" y="278.0" font-size="13" text-anchor="end" font-weight="700" fill="#D55E00">degree share</text>
