<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>How scores change as a line of people gets longer</title>
<desc>Three curves for the middle person of a line of n people, drawn against n on a log scale.</desc>
<defs></defs>
<rect width="700" height="400" fill="#ffffff"/>
<line x1="80" y1="310" x2="660" y2="310" stroke="#1f2937" stroke-width="1.5"/>
<line x1="80" y1="40" x2="80" y2="310" stroke="#1f2937" stroke-width="1.5"/>
<line x1="75" y1="310.0" x2="80" y2="310.0" stroke="#1f2937"/>
<text x="70.0" y="314.0" font-size="12" text-anchor="end" font-weight="400" fill="#1f2937">0</text>
<line x1="75" y1="242.5" x2="80" y2="242.5" stroke="#1f2937"/>
<text x="70.0" y="246.5" font-size="12" text-anchor="end" font-weight="400" fill="#1f2937">0.25</text>
<line x1="75" y1="175.0" x2="80" y2="175.0" stroke="#1f2937"/>
<text x="70.0" y="179.0" font-size="12" text-anchor="end" font-weight="400" fill="#1f2937">0.5</text>
<line x1="75" y1="107.5" x2="80" y2="107.5" stroke="#1f2937"/>
<text x="70.0" y="111.5" font-size="12" text-anchor="end" font-weight="400" fill="#1f2937">0.75</text>
<line x1="75" y1="40.0" x2="80" y2="40.0" stroke="#1f2937"/>
<text x="70.0" y="44.0" font-size="12" text-anchor="end" font-weight="400" fill="#1f2937">1</text>
<line x1="80.0" y1="310" x2="80.0" y2="315" stroke="#1f2937"/>
<text x="80.0" y="331.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">3</text>
<line x1="294.3" y1="310" x2="294.3" y2="315" stroke="#1f2937"/>
<text x="294.3" y="331.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">11</text>
<line x1="465.2" y1="310" x2="465.2" y2="315" stroke="#1f2937"/>
<text x="465.2" y="331.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">31</text>
<line x1="660.0" y1="310" x2="660.0" y2="315" stroke="#1f2937"/>
<text x="660.0" y="331.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">101</text>
<text x="370.0" y="356.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">people in the line (log scale)</text>
<polyline points="80.0,40.0 164.3,130.0 219.8,148.0 294.3,160.0 401.0,167.9 465.2,170.3 547.3,172.2 601.9,173.0 660.0,173.6" fill="none" stroke="#E69F00" stroke-width="3"/>
<circle cx="80.0" cy="40.0" r="3.5" fill="#E69F00"/>
<circle cx="164.3" cy="130.0" r="3.5" fill="#E69F00"/>
<circle cx="219.8" cy="148.0" r="3.5" fill="#E69F00"/>
<circle cx="294.3" cy="160.0" r="3.5" fill="#E69F00"/>
<circle cx="401.0" cy="167.9" r="3.5" fill="#E69F00"/>
<circle cx="465.2" cy="170.3" r="3.5" fill="#E69F00"/>
<circle cx="547.3" cy="172.2" r="3.5" fill="#E69F00"/>
<circle cx="601.9" cy="173.0" r="3.5" fill="#E69F00"/>
<circle cx="660.0" cy="173.6" r="3.5" fill="#E69F00"/>
<text x="465.2" y="158.3" font-size="13" text-anchor="middle" font-weight="700" fill="#E69F00">betweenness share</text>
<polyline points="80.0,40.0 164.3,130.0 219.8,175.0 294.3,220.0 401.0,260.9 465.2,276.2 547.3,289.2 601.9,295.0 660.0,299.4" fill="none" stroke="#0072B2" stroke-width="3"/>
<circle cx="80.0" cy="40.0" r="3.5" fill="#0072B2"/>
<circle cx="164.3" cy="130.0" r="3.5" fill="#0072B2"/>
<circle cx="219.8" cy="175.0" r="3.5" fill="#0072B2"/>
