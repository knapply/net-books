<text x="205.0" y="274.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Gu</text>
<circle cx="320" cy="270" r="19" fill="#fff" stroke="#0072B2" stroke-width="2"/>
<text x="320.0" y="274.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ha</text>
<text x="235.0" y="322.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Same ties to the same people:</text>
<text x="235.0" y="340.1" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">both go to Cy and nobody else.</text>
<text x="685.0" y="28.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Regularly equivalent</text>
