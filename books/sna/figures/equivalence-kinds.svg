<text x="685.0" y="322.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">Different people, same kind of tie:</text>
<text x="685.0" y="340.1" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280">each goes to one manager.</text>
</svg>
