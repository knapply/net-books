<text x="150.0" y="174.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Cy</text>
<rect x="301" y="151" width="38" height="38" rx="3" fill="#fff" stroke="#E69F00" stroke-width="2.4"/>
<text x="320.0" y="174.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">De</text>
