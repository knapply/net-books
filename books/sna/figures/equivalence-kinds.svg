<circle cx="545" cy="270" r="19" fill="#cfe5f3" stroke="#0072B2" stroke-width="3"/>
<text x="545.0" y="274.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Fl</text>
<circle cx="655" cy="270" r="19" fill="#fff" stroke="#0072B2" stroke-width="2"/>
<text x="655.0" y="274.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Gu</text>
