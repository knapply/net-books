<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Two ways of being alike</title>
<desc>Two small panels. On the left, two staff members tied to the same manager are structurally equivalent. On the right, two staff members tied to different managers are only regularly equivalent.</desc>
<defs><marker id="arrow-7b8494" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8494"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="235.0" y="28.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Structurally equivalent</text>
<polygon points="235,54.0 259.0,78 235,102.0 211.0,78" fill="#fff" stroke="#CC79A7" stroke-width="2.4"/>
<text x="235.0" y="82.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ada</text>
