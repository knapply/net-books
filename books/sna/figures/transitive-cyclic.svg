<text x="670.0" y="225.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Chain (021C)</text>
<text x="670.0" y="246.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">A reaches C only through B</text>
