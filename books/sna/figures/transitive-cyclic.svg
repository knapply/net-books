<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Three kinds of three-person ranking</title>
<desc>Three small drawings: a transitive triad where A points to B and C and B points to C, a cyclic triad where each points to the next, and the same transitive triad labeled as a feed-forward loop.</desc>
<defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="820" height="280" fill="#ffffff"/>
<line x1="140.2" y1="86.3" x2="101.3" y2="151.1" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<line x1="159.8" y1="86.3" x2="198.7" y2="151.1" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<line x1="109.0" y1="170.0" x2="188.0" y2="170.0" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<circle cx="150" cy="70" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="150.0" y="74.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="90" cy="170" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="90.0" y="174.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="210" cy="170" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="210.0" y="174.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="150.0" y="225.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Transitive (030T)</text>
<text x="150.0" y="246.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">a clean pecking order</text>
<line x1="400.2" y1="86.3" x2="361.3" y2="151.1" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<line x1="369.0" y1="170.0" x2="448.0" y2="170.0" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<line x1="460.2" y1="153.7" x2="421.3" y2="88.9" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<circle cx="410" cy="70" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="410.0" y="74.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="350" cy="170" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="350.0" y="174.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="470" cy="170" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="470.0" y="174.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">C</text>
<text x="410.0" y="225.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Cyclic (030C)</text>
<text x="410.0" y="246.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">everyone is above someone and below someone</text>
<line x1="660.2" y1="86.3" x2="621.3" y2="151.1" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<line x1="629.0" y1="170.0" x2="708.0" y2="170.0" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<circle cx="670" cy="70" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="670.0" y="74.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">A</text>
<circle cx="610" cy="170" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
<text x="610.0" y="174.7" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">B</text>
<circle cx="730" cy="170" r="18" fill="#cfe5f3" stroke="#0072B2" stroke-width="2"/>
