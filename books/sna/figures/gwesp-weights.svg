<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>What a tie is worth as its shared partners pile up</title>
<desc>Lines for four decay settings of the weight a tie adds to the GWESP statistic, against its number of shared partners, with the raw count as a dashed line.</desc>
<defs></defs>
<rect width="760" height="380" fill="#ffffff"/>
<line x1="80" y1="320.0" x2="640" y2="320.0" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="324.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">0</text>
<line x1="80" y1="252.5" x2="640" y2="252.5" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="256.5" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">2</text>
<line x1="80" y1="185.0" x2="640" y2="185.0" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="189.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">4</text>
<line x1="80" y1="117.5" x2="640" y2="117.5" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="121.5" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">6</text>
<line x1="80" y1="50.0" x2="640" y2="50.0" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="54.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">8</text>
<line x1="80.0" y1="50" x2="80.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="80.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0</text>
<line x1="192.0" y1="50" x2="192.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="192.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">2</text>
<line x1="304.0" y1="50" x2="304.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="304.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">4</text>
<line x1="416.0" y1="50" x2="416.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="416.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">6</text>
<line x1="528.0" y1="50" x2="528.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="528.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">8</text>
<line x1="640.0" y1="50" x2="640.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="640.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">10</text>
<rect x="80" y="50" width="560" height="270" rx="0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="360.0" y="358.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2937">shared partners of the tie (k)</text>
<text x="34" y="185.0" font-size="12.5" text-anchor="middle" fill="#1f2937" transform="rotate(-90 34 185.0)">weight added to GWESP</text>
<path d="M80.0,320.0 L136.0,286.2 L192.0,252.5 L248.0,218.8 L304.0,185.0 L360.0,151.2 L416.0,117.5 L472.0,83.8 L528.0,50.0 L584.0,16.2 L640.0,-17.5" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="578.4" y="64.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">raw count</text>
<path d="M80.0,320.0 L136.0,286.2 L192.0,278.8 L248.0,277.1 L304.0,276.8 L360.0,276.7 L416.0,276.7 L472.0,276.7 L528.0,276.7 L584.0,276.7 L640.0,276.7" fill="none" stroke="#0072B2" stroke-width="2.2"/>
<text x="650.0" y="280.7" font-size="12" text-anchor="start" font-weight="400" fill="#0072B2">decay 0.25</text>
