<text x="650.0" y="268.4" font-size="12" text-anchor="start" font-weight="400" fill="#009E73">decay 0.5</text>
<path d="M80.0,320.0 L136.0,286.2 L192.0,264.9 L248.0,251.4 L304.0,242.9 L360.0,237.5 L416.0,234.1 L472.0,232.0 L528.0,230.6 L584.0,229.7 L640.0,229.2" fill="none" stroke="#E69F00" stroke-width="2.2"/>
<text x="650.0" y="233.2" font-size="12" text-anchor="start" font-weight="400" fill="#E69F00">decay 1</text>
<path d="M80.0,320.0 L136.0,286.2 L192.0,257.1 L248.0,231.8 L304.0,210.0 L360.0,191.2 L416.0,174.8 L472.0,160.7 L528.0,148.5 L584.0,138.0 L640.0,128.9" fill="none" stroke="#D55E00" stroke-width="2.2"/>
<text x="650.0" y="132.9" font-size="12" text-anchor="start" font-weight="400" fill="#D55E00">decay 2</text>
<text x="380.0" y="28.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Each extra shared partner counts for less</text>
</svg>
