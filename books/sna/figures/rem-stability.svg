<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>How the event-model coefficients move with the data and the model</title>
<desc>Two panels of estimates with two standard errors either side, one row per variant: all eighty messages, each half of the log, and the model with sender activity and receiver popularity added.</desc>
<defs></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="400.0" y="30.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Repeating a pair (inertia)</text>
<line x1="400.0" y1="50" x2="400.0" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="337.5" y="228.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">-1</text>
<text x="400.0" y="228.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0</text>
<text x="462.5" y="228.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">1</text>
<text x="280.0" y="74.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">all 80 messages</text>
<line x1="327.2" y1="70" x2="378.5" y2="70" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="352.9" cy="70" r="5.5" fill="#0072B2"/>
<text x="280.0" y="114.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">first 40</text>
<line x1="308.4" y1="110" x2="403.4" y2="110" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="355.9" cy="110" r="5.5" fill="#0072B2"/>
<text x="280.0" y="154.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">last 40</text>
<line x1="312.1" y1="150" x2="403.2" y2="150" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="357.7" cy="150" r="5.5" fill="#0072B2"/>
<text x="280.0" y="194.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">all 80, plus activity and popularity</text>
<line x1="328.6" y1="190" x2="387.0" y2="190" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="357.8" cy="190" r="5.5" fill="#0072B2"/>
<text x="750.0" y="30.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Replying to a pair (reciprocity)</text>
<line x1="750.0" y1="50" x2="750.0" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="687.5" y="228.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">-1</text>
<text x="750.0" y="228.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0</text>
<text x="812.5" y="228.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">1</text>
<line x1="777.3" y1="70" x2="817.4" y2="70" stroke="#E69F00" stroke-width="2.4"/>
<circle cx="797.3" cy="70" r="5.5" fill="#E69F00"/>
<line x1="758.5" y1="110" x2="832.6" y2="110" stroke="#E69F00" stroke-width="2.4"/>
<circle cx="795.6" cy="110" r="5.5" fill="#E69F00"/>
<line x1="754.0" y1="150" x2="824.4" y2="150" stroke="#E69F00" stroke-width="2.4"/>
<circle cx="789.2" cy="150" r="5.5" fill="#E69F00"/>
<line x1="775.1" y1="190" x2="816.1" y2="190" stroke="#E69F00" stroke-width="2.4"/>
<circle cx="795.6" cy="190" r="5.5" fill="#E69F00"/>
<text x="450.0" y="290.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">coefficient (log multiplier of the rate); dashed line is no effect</text>
</svg>
