<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Redundant contacts and a structural hole</title>
<desc>Left: a person with four contacts who all know each other. Right: the same person with four contacts split into two pairs, the pairs not connected to each other.</desc>
<defs></defs>
<rect width="800" height="360" fill="#ffffff"/>
<line x1="152.0" y1="105.0" x2="268.0" y2="105.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="135.0" y1="122.0" x2="135.0" y2="238.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="147.0" y1="117.0" x2="273.0" y2="243.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="273.0" y1="117.0" x2="147.0" y2="243.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="285.0" y1="122.0" x2="285.0" y2="238.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="152.0" y1="255.0" x2="268.0" y2="255.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="195.2" y1="165.2" x2="147.0" y2="117.0" stroke="#1f2937" stroke-width="2.4"/>
<line x1="224.8" y1="165.2" x2="273.0" y2="117.0" stroke="#1f2937" stroke-width="2.4"/>
<line x1="195.2" y1="194.8" x2="147.0" y2="243.0" stroke="#1f2937" stroke-width="2.4"/>
<line x1="224.8" y1="194.8" x2="273.0" y2="243.0" stroke="#1f2937" stroke-width="2.4"/>
<circle cx="135" cy="105" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="285" cy="105" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="135" cy="255" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="285" cy="255" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="210" cy="180" r="22" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<text x="210.0" y="184.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ego</text>
<line x1="515.0" y1="122.0" x2="515.0" y2="238.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="665.0" y1="122.0" x2="665.0" y2="238.0" stroke="#56B4E9" stroke-width="1.8"/>
<line x1="532.0" y1="105.0" x2="648.0" y2="105.0" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="532.0" y1="255.0" x2="648.0" y2="255.0" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="590.0" y="96.0" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic">no ties</text>
<line x1="575.2" y1="165.2" x2="527.0" y2="117.0" stroke="#1f2937" stroke-width="2.4"/>
<line x1="604.8" y1="165.2" x2="653.0" y2="117.0" stroke="#1f2937" stroke-width="2.4"/>
<line x1="575.2" y1="194.8" x2="527.0" y2="243.0" stroke="#1f2937" stroke-width="2.4"/>
<line x1="604.8" y1="194.8" x2="653.0" y2="243.0" stroke="#1f2937" stroke-width="2.4"/>
<circle cx="515" cy="105" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="665" cy="105" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="515" cy="255" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="665" cy="255" r="16" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="590" cy="180" r="22" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<text x="590.0" y="184.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Ego</text>
<text x="210.0" y="36.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Closed: the contacts all know each other</text>
<text x="590.0" y="36.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">Open: two groups that don&#x27;t know each other</text>
<text x="210.0" y="318.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Redundant: everyone hears the same things.</text>
<text x="210.0" y="338.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Good for trust and enforcement (Coleman).</text>
<text x="590.0" y="318.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Ego spans a structural hole: new, non-redundant</text>
<text x="590.0" y="338.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">information and control (Burt).</text>
</svg>
