<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A weak tie as a bridge</title>
<desc>Two tightly connected circles of four people each. One dashed weak tie joins one person in each circle and is the only connection between the circles.</desc>
<defs></defs>
<rect width="780" height="330" fill="#ffffff"/>
<rect x="50" y="40" width="180" height="195" rx="69.23076923076923" fill="#0072B214" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="140.0" y="33.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">Circle 1</text>
<rect x="550" y="40" width="180" height="195" rx="69.23076923076923" fill="#0072B214" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="640.0" y="33.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">Circle 2</text>
<line x1="104.9" y1="104.1" x2="175.1" y2="75.9" stroke="#6b7280" stroke-width="3"/>
<line x1="101.9" y1="120.7" x2="178.1" y2="189.3" stroke="#6b7280" stroke-width="3"/>
<line x1="90.0" y1="126.0" x2="90.0" y2="184.0" stroke="#6b7280" stroke-width="3"/>
<line x1="190.0" y1="86.0" x2="190.0" y2="184.0" stroke="#6b7280" stroke-width="3"/>
<line x1="180.2" y1="82.7" x2="99.8" y2="187.3" stroke="#6b7280" stroke-width="3"/>
<line x1="174.0" y1="200.0" x2="106.0" y2="200.0" stroke="#6b7280" stroke-width="3"/>
<line x1="604.9" y1="75.9" x2="675.1" y2="104.1" stroke="#6b7280" stroke-width="3"/>
<line x1="599.8" y1="82.7" x2="680.2" y2="187.3" stroke="#6b7280" stroke-width="3"/>
<line x1="590.0" y1="86.0" x2="590.0" y2="184.0" stroke="#6b7280" stroke-width="3"/>
<line x1="690.0" y1="126.0" x2="690.0" y2="184.0" stroke="#6b7280" stroke-width="3"/>
<line x1="678.1" y1="120.7" x2="601.9" y2="189.3" stroke="#6b7280" stroke-width="3"/>
<line x1="674.0" y1="200.0" x2="606.0" y2="200.0" stroke="#6b7280" stroke-width="3"/>
<line x1="206.0" y1="70.0" x2="574.0" y2="70.0" stroke="#E69F00" stroke-width="3" stroke-dasharray="9 6"/>
<text x="390.0" y="56.0" font-size="14" text-anchor="middle" font-weight="600" fill="#E69F00">weak tie: the only bridge</text>
<circle cx="90" cy="110" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="190" cy="70" r="15" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<circle cx="190" cy="200" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="90" cy="200" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="590" cy="70" r="15" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<circle cx="690" cy="110" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="690" cy="200" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="590" cy="200" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<text x="390.0" y="282.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Close friends know each other, so they tend to know the same things.</text>
<text x="390.0" y="303.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">The weak tie is how news gets from one circle to the other.</text>
</svg>
