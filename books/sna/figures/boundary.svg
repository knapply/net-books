<text x="600.0" y="90.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">not in the data</text>
<text x="450.0" y="330.0" font-size="13" text-anchor="middle" font-weight="600" fill="#D55E00">Ties that cross the line are lost</text>
<text x="390.0" y="358.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">The orange nodes look less connected than they are, and every measure of them inherits that.</text>
