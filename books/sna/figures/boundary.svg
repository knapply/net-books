<line x1="234.5" y1="193.3" x2="335.5" y2="146.7" stroke="#6b7280" stroke-width="2.4"/>
<line x1="235.4" y1="204.2" x2="334.6" y2="230.8" stroke="#6b7280" stroke-width="2.4"/>
<line x1="350.0" y1="156.0" x2="350.0" y2="219.0" stroke="#6b7280" stroke-width="2.4"/>
<line x1="552.0" y1="120.6" x2="618.0" y2="179.4" stroke="#d1d5db" stroke-width="2"/>
<line x1="618.0" y1="200.6" x2="552.0" y2="259.4" stroke="#d1d5db" stroke-width="2"/>
<line x1="540.0" y1="126.0" x2="540.0" y2="254.0" stroke="#d1d5db" stroke-width="2"/>
<line x1="365.8" y1="137.5" x2="524.2" y2="112.5" stroke="#D55E00" stroke-width="2.2" stroke-dasharray="6 5"/>
<line x1="365.7" y1="237.9" x2="524.3" y2="267.1" stroke="#D55E00" stroke-width="2.2" stroke-dasharray="6 5"/>
