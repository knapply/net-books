<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Where we draw the boundary</title>
<desc>A network with a dashed rectangle around most of it. Two nodes just inside the boundary have ties that cross it to nodes outside, which are not in the data.</desc>
<defs></defs>
<rect width="780" height="380" fill="#ffffff"/>
<rect x="60" y="60" width="340" height="245" rx="94.23076923076923" fill="#0072B214" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="230.0" y="53.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">What we collected</text>
<line x1="145.3" y1="125.4" x2="214.7" y2="104.6" stroke="#6b7280" stroke-width="2.4"/>
<line x1="142.6" y1="139.8" x2="207.4" y2="190.2" stroke="#6b7280" stroke-width="2.4"/>
<line x1="228.4" y1="115.9" x2="221.6" y2="184.1" stroke="#6b7280" stroke-width="2.4"/>
