<circle cx="230" cy="100" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="220" cy="200" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="120" cy="235" r="15" fill="#eef6fb" stroke="#0072B2" stroke-width="2"/>
<circle cx="350" cy="140" r="15" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<circle cx="350" cy="235" r="15" fill="#E69F00" stroke="#E69F00" stroke-width="2"/>
<circle cx="540" cy="110" r="15" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
