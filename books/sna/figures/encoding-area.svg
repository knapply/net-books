<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Radius or area for degree</title>
<desc>Circles for degrees 1, 4, 9 and 17, drawn once with radius proportional to degree and once with radius proportional to its square root.</desc>
<defs></defs>
<rect width="700" height="330" fill="#ffffff"/>
<text x="350.0" y="26.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">Node size for degree: which scale says what the data says?</text>
<text x="20.0" y="62.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">radius = 2 x degree</text>
<circle cx="92.0" cy="130" r="2.0" fill="#0072B2" opacity="0.85"/>
<text x="92.0" y="160.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 1</text>
<circle cx="162.0" cy="130" r="8.0" fill="#0072B2" opacity="0.85"/>
<text x="162.0" y="160.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 4</text>
<circle cx="248.0" cy="130" r="18.0" fill="#0072B2" opacity="0.85"/>
<text x="248.0" y="164.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 9</text>
<circle cx="360.0" cy="130" r="34.0" fill="#0072B2" opacity="0.85"/>
<text x="360.0" y="180.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 17</text>
<text x="20.0" y="212.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">radius = 2 x sqrt(degree)</text>
<circle cx="92.0" cy="262" r="2.0" fill="#0072B2" opacity="0.85"/>
<text x="92.0" y="292.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 1</text>
<circle cx="158.0" cy="262" r="4.0" fill="#0072B2" opacity="0.85"/>
<text x="158.0" y="292.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 4</text>
<circle cx="228.0" cy="262" r="6.0" fill="#0072B2" opacity="0.85"/>
<text x="228.0" y="292.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 9</text>
<circle cx="302.2" cy="262" r="8.2" fill="#0072B2" opacity="0.85"/>
<text x="302.2" y="292.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">degree 17</text>
<text x="680.0" y="150.0" font-size="13" text-anchor="end" font-weight="600" fill="#D55E00">areas differ 289 to 1</text>
<text x="680.0" y="270.0" font-size="13" text-anchor="end" font-weight="600" fill="#0072B2">areas differ 17 to 1</text>
</svg>
