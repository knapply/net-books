<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Three states of a pair</title>
<desc>The five-person advice network drawn with arrows, with the mutual pair in orange, asymmetric pairs in blue and null pairs as faint dotted lines, next to a tally.</desc>
