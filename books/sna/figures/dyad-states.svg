<text x="120.0" y="144.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<circle cx="260" cy="50" r="22" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="260.0" y="54.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<circle cx="300" cy="200" r="22" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="300.0" y="204.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Chloe</text>
<circle cx="60" cy="290" r="22" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="60.0" y="294.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<circle cx="200" cy="350" r="22" fill="#eef6fb" stroke="#1f2937" stroke-width="2"/>
<text x="200.0" y="354.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<text x="630.0" y="62.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">Ten pairs of people</text>
<line x1="501.0" y1="120.0" x2="566.0" y2="120.0" stroke="#E69F00" stroke-width="2.6" marker-end="url(#arrow-E69F00)"/>
<line x1="569.0" y1="130.0" x2="504.0" y2="130.0" stroke="#E69F00" stroke-width="2.6" marker-end="url(#arrow-E69F00)"/>
<text x="592.0" y="122.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Mutual: 1</text>
<text x="592.0" y="144.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">both ways</text>
<line x1="501.0" y1="200.0" x2="566.0" y2="200.0" stroke="#0072B2" stroke-width="2.6" marker-end="url(#arrow-0072B2)"/>
<text x="592.0" y="202.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Asymmetric: 5</text>
<text x="592.0" y="224.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">one way</text>
<line x1="501.0" y1="280.0" x2="569.0" y2="280.0" stroke="#9ca3af" stroke-width="2.6" stroke-dasharray="2 5"/>
<text x="592.0" y="282.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Null: 4</text>
<text x="592.0" y="304.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">no tie</text>
<text x="630.0" y="372.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">1 + 5 + 4 = 10 pairs;  2 x 1 + 5 = 7 ties</text>
