<line x1="212.8" y1="330.9" x2="285.6" y2="221.6" stroke="#0072B2" stroke-width="2.4" marker-end="url(#arrow-0072B2)"/>
<line x1="68.5" y1="268.6" x2="110.3" y2="164.1" stroke="#0072B2" stroke-width="2.4" marker-end="url(#arrow-0072B2)"/>
<line x1="81.5" y1="281.9" x2="275.7" y2="209.1" stroke="#0072B2" stroke-width="2.4" marker-end="url(#arrow-0072B2)"/>
<path d="M278.2,192.7 Q215.9,157.2 144.7,148.2" fill="none" stroke="#E69F00" stroke-width="2.6" marker-end="url(#arrow-E69F00)"/>
