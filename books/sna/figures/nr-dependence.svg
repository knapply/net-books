<text x="244.0" y="28.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">Row: who names. Column: who is named.</text>
<text x="470.0" y="110.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">The blue square is one ordered pair: Cleo names Eli.</text>
<text x="470.0" y="131.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">The 21 orange squares share Cleo or Eli with it:</text>
<text x="470.0" y="152.1" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">every pair in Cleo&#x27;s row or column, and in Eli&#x27;s.</text>
<text x="470.0" y="173.1" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937"></text>
<text x="470.0" y="194.1" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">With 7 people, 21 of the other 41 pairs</text>
<text x="470.0" y="215.1" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">are tied to the blue one through a person.</text>
<text x="470.0" y="236.1" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937"></text>
<text x="470.0" y="257.2" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">With the 21 Krackhardt managers it is 77 of the</text>
<text x="470.0" y="278.2" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">other 419 pairs, for every single pair.</text>
<text x="470.0" y="299.2" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937"></text>
<text x="470.0" y="320.2" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">A test that counts each square as a separate,</text>
<text x="470.0" y="341.3" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">independent observation counts the same few</text>
<text x="470.0" y="362.3" font-size="14.5" text-anchor="start" font-weight="400" fill="#1f2937">people&#x27;s habits over and over.</text>
