<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>The first-analysis loop</title>
<desc>Five steps, each with a question: load, describe, compute, stress-test, write.</desc>
<defs><marker id="arrow-1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-E69F00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs>
<rect width="820" height="250" fill="#ffffff"/>
<rect x="22" y="70" width="128" height="64" rx="8" fill="#0072B222" stroke="#0072B2" stroke-width="1.8"/>
<text x="86.0" y="98.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">1. Load</text>
<text x="86.0" y="162.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Is every person</text>
<text x="86.0" y="180.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">and tie in?</text>
<line x1="153" y1="102" x2="175" y2="102" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow-1f2937)"/>
<rect x="178" y="70" width="128" height="64" rx="8" fill="#0072B222" stroke="#0072B2" stroke-width="1.8"/>
<text x="242.0" y="98.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">2. Describe</text>
<text x="242.0" y="162.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Do the counts match</text>
<text x="242.0" y="180.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">what I know?</text>
<line x1="309" y1="102" x2="331" y2="102" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow-1f2937)"/>
<rect x="334" y="70" width="128" height="64" rx="8" fill="#0072B222" stroke="#0072B2" stroke-width="1.8"/>
<text x="398.0" y="98.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">3. Compute</text>
<text x="398.0" y="162.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Can I say what it</text>
<text x="398.0" y="180.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">means in a sentence?</text>
<line x1="465" y1="102" x2="487" y2="102" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow-1f2937)"/>
<rect x="490" y="70" width="128" height="64" rx="8" fill="#0072B222" stroke="#0072B2" stroke-width="1.8"/>
<text x="554.0" y="98.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">4. Stress-test</text>
<text x="554.0" y="162.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Does it survive</text>
<text x="554.0" y="180.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">losing some ties?</text>
<line x1="621" y1="102" x2="643" y2="102" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow-1f2937)"/>
<rect x="646" y="70" width="128" height="64" rx="8" fill="#0072B222" stroke="#0072B2" stroke-width="1.8"/>
<text x="710.0" y="98.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">5. Write</text>
<text x="710.0" y="162.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">What does it</text>
<text x="710.0" y="180.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">not show?</text>
<path d="M710,196 C710,246 86,246 86,196" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-E69F00)"/>
<text x="410.0" y="26.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">A first analysis, and every one after it</text>
</svg>
