<polygon points="869,103.2 885.8,120 869,136.8 852.2,120" fill="#ffffff" stroke="#CC79A7" stroke-width="2"/>
<text x="869.0" y="124.3" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">k</text>
<text x="807.0" y="60.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">liaison</text>
<text x="807.0" y="180.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">links three</text>
<text x="807.0" y="196.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">different groups</text>
<text x="450.0" y="255.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">In every drawing j brokers: i goes to j, j goes to k, and i does not go to k directly.</text>
