<text x="70.0" y="44.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">12</text>
<rect x="94.0" y="223.33333333333334" width="52" height="36.666666666666664" rx="0" fill="#0072B299" stroke="#0072B2" stroke-width="1.8"/>
<text x="120.0" y="215.3" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">2</text>
<text x="120.0" y="282.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">resolution 0.5</text>
<text x="120.0" y="302.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Q = 0.372</text>
<rect x="229.0" y="186.66666666666669" width="52" height="73.33333333333333" rx="0" fill="#E69F0099" stroke="#E69F00" stroke-width="1.8"/>
