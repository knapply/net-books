<text x="70.0" y="154.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">6</text>
<line x1="81.0" y1="95.0" x2="699.0" y2="95.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="70.0" y="99.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">9</text>
