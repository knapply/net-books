<text x="255.0" y="302.0" font-size="12" text-anchor="middle" font-weight="600" fill="#E69F00">Q = 0.419</text>
<rect x="364.0" y="168.33333333333331" width="52" height="91.66666666666667" rx="0" fill="#0072B299" stroke="#0072B2" stroke-width="1.8"/>
<text x="390.0" y="160.3" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">5</text>
<text x="390.0" y="282.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">resolution 1.5</text>
<text x="390.0" y="302.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">Q = 0.381</text>
<rect x="499.0" y="113.33333333333334" width="52" height="146.66666666666666" rx="0" fill="#0072B299" stroke="#0072B2" stroke-width="1.8"/>
