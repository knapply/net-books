<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>More communities is not better communities</title>
<desc>A chart of how many communities Louvain finds, and the modularity of the result, as the resolution setting rises from 0.5 to 3.</desc>
<defs></defs>
