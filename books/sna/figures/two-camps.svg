<text x="170.4" y="202.5" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="132.3" y1="132.9" x2="217.7" y2="172.1" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="179.6" cy="142.5" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="179.6" y="147.5" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="445.0" y1="144.0" x2="445.0" y2="216.0" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="456.0" cy="180.0" r="9" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="456.0" y="185.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0072B2">+</text>
<line x1="134.0" y1="125.0" x2="426.0" y2="125.0" stroke="#D55E00" stroke-width="2.4" stroke-dasharray="7 5"/>
