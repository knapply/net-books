<text x="445.0" y="81.0" font-size="13" text-anchor="middle" font-weight="600" fill="#E69F00">Camp 2</text>
<line x1="115.0" y1="144.0" x2="115.0" y2="216.0" stroke="#0072B2" stroke-width="2.6"/>
