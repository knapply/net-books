<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>A balanced network splits into two camps</title>
<desc>Five people in two groups. Inside each group all ties are positive; between the groups all ties are negative.</desc>
