<text x="280.0" y="119.0" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<line x1="253.4" y1="175.2" x2="426.6" y2="129.8" stroke="#D55E00" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="337.2" cy="141.9" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="337.2" y="146.9" font-size="15" text-anchor="middle" font-weight="700" fill="#D55E00">−</text>
<line x1="134.0" y1="235.0" x2="426.0" y2="235.0" stroke="#D55E00" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="280.0" cy="224.0" r="9" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
