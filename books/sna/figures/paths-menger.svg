<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Two routes from s to t that share no one in between</title>
<desc>Six people in a ring with one extra tie. Two routes from s to t share no person other than s and t.</desc>
<defs></defs>
<rect width="740" height="380" fill="#ffffff"/>
<line x1="240.5" y1="151.8" x2="289.5" y2="66.9" stroke="#0072B2" stroke-width="4.5"/>
<line x1="321.0" y1="48.8" x2="419.0" y2="48.8" stroke="#0072B2" stroke-width="4.5"/>
<line x1="450.5" y1="66.9" x2="499.5" y2="151.8" stroke="#0072B2" stroke-width="4.5"/>
<line x1="499.5" y1="188.2" x2="450.5" y2="273.1" stroke="#E69F00" stroke-width="4.5"/>
<line x1="419.0" y1="291.2" x2="321.0" y2="291.2" stroke="#E69F00" stroke-width="4.5"/>
<line x1="289.5" y1="273.1" x2="240.5" y2="188.2" stroke="#E69F00" stroke-width="4.5"/>
<line x1="310.5" y1="66.9" x2="429.5" y2="273.1" stroke="#9ca3af" stroke-width="1.8"/>
<circle cx="230.0" cy="170.00000000000003" r="20" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
<text x="230.0" y="175.4" font-size="15" text-anchor="middle" font-weight="600" fill="#ffffff">s</text>
<circle cx="299.99999999999994" cy="48.756443470178624" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="300.0" y="54.2" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">a</text>
<circle cx="440.0" cy="48.756443470178596" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="440.0" y="54.2" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">b</text>
<circle cx="510.0" cy="170.0" r="20" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
<text x="510.0" y="175.4" font-size="15" text-anchor="middle" font-weight="600" fill="#ffffff">t</text>
<circle cx="440.0" cy="291.2435565298214" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="440.0" y="296.6" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">c</text>
<circle cx="300.0" cy="291.24355652982143" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="300.0" y="296.6" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2937">d</text>
<circle cx="300.0" cy="48.8" r="29" fill="none" stroke="#D55E00" stroke-width="2.2" stroke-dasharray="5 4"/>
<circle cx="300.0" cy="291.2" r="29" fill="none" stroke="#D55E00" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="370.0" y="356.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Blue and orange routes share no one but s and t. Remove the two dashed people (a and d) and s is cut off.</text>
</svg>
