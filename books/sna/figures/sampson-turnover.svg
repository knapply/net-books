<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>How much of Sampson&#x27;s liking network changed between waves</title>
<desc>Left: ties kept, dropped and new between waves. Right: the share of novice pairs with a tie at the next wave, by whether a tie existed and was returned.</desc>
<defs></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="225.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Ties between consecutive waves</text>
<text x="725.0" y="30.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">Share with a tie at the next wave</text>
<rect x="70" y="96.0" width="48" height="224.0" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="94.0" y="88.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">35</text>
<text x="94.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">kept</text>
<rect x="128" y="192.0" width="48" height="128.0" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="152.0" y="184.0" font-size="13" text-anchor="middle" font-weight="600" fill="#E69F00">20</text>
<text x="152.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">dropped</text>
<rect x="186" y="179.2" width="48" height="140.8" rx="0" fill="#009E7355" stroke="#009E73" stroke-width="2"/>
<text x="210.0" y="171.2" font-size="13" text-anchor="middle" font-weight="600" fill="#009E73">22</text>
<text x="210.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">new</text>
<text x="152.0" y="364.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">wave 1 to 2</text>
<rect x="270" y="64.0" width="48" height="256.0" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="294.0" y="56.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0072B2">40</text>
<text x="294.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">kept</text>
<rect x="328" y="211.2" width="48" height="108.80000000000001" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="352.0" y="203.2" font-size="13" text-anchor="middle" font-weight="600" fill="#E69F00">17</text>
<text x="352.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">dropped</text>
<rect x="386" y="217.6" width="48" height="102.4" rx="0" fill="#009E7355" stroke="#009E73" stroke-width="2"/>
<text x="410.0" y="209.6" font-size="13" text-anchor="middle" font-weight="600" fill="#009E73">16</text>
<text x="410.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">new</text>
<text x="352.0" y="364.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">wave 2 to 3</text>
<line x1="55" y1="320" x2="425" y2="320" stroke="#6b7280" stroke-width="1.5"/>
<text x="600.0" y="92.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">tie, returned</text>
<rect x="610" y="70" width="170.51724137931035" height="32" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="788.5" y="92.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">0.74 (43 of 58)</text>
<text x="600.0" y="154.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">tie, not returned</text>
<rect x="610" y="132" width="136.29629629629628" height="32" rx="0" fill="#56B4E955" stroke="#56B4E9" stroke-width="2"/>
<text x="754.3" y="154.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">0.59 (32 of 54)</text>
<text x="600.0" y="216.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#1f2937">no tie, reverse tie</text>
