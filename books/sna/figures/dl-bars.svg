<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>What each grouping costs to describe</title>
<desc>A stacked bar for each of three groupings of the karate club showing the description length split into the network given the groups, the groups themselves, and the block-to-block ties.</desc>
<defs></defs>
<rect width="900" height="310" fill="#ffffff"/>
<text x="256.0" y="90.0" font-size="14" text-anchor="end" font-weight="400" fill="#1f2937">One group</text>
<rect x="270" y="69" width="485.3625" height="32" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="1.5"/>
<rect x="755.3625" y="69" width="7.4046" height="32" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="1.5"/>
<text x="772.8" y="90.0" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">234.7</text>
<text x="256.0" y="148.0" font-size="14" text-anchor="end" font-weight="400" fill="#1f2937">The club&#x27;s two sides</text>
<rect x="270" y="127" width="429.1224" height="32" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="1.5"/>
<rect x="699.1224" y="127" width="60.0474" height="32" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="1.5"/>
<rect x="759.1698" y="127" width="16.9218" height="32" rx="0" fill="#CC79A755" stroke="#CC79A7" stroke-width="1.5"/>
<text x="786.1" y="148.0" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">241.0</text>
<text x="256.0" y="206.0" font-size="14" text-anchor="end" font-weight="400" fill="#1f2937">Hubs and the rest (found)</text>
<rect x="270" y="185" width="394.1952" height="32" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="1.5"/>
<rect x="664.1952" y="185" width="41.0739" height="32" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="1.5"/>
<rect x="705.2691" y="185" width="16.9218" height="32" rx="0" fill="#CC79A755" stroke="#CC79A7" stroke-width="1.5"/>
<text x="732.2" y="206.0" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">215.3</text>
<rect x="270" y="262" width="16" height="16" rx="0" fill="#0072B255" stroke="#0072B2" stroke-width="1.5"/>
<text x="294.0" y="275.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">network given the groups</text>
<rect x="485" y="262" width="16" height="16" rx="0" fill="#E69F0055" stroke="#E69F00" stroke-width="1.5"/>
<text x="509.0" y="275.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">the groups</text>
<rect x="700" y="262" width="16" height="16" rx="0" fill="#CC79A755" stroke="#CC79A7" stroke-width="1.5"/>
<text x="724.0" y="275.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">block-to-block ties</text>
<text x="270.0" y="50.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280">total description length in nats; shorter is better</text>
</svg>
