<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Rewiring a ring lattice</title>
<desc>Clustering and mean distance, each relative to the ring with no rewiring, against the rewiring probability.</desc>
<defs></defs>
<rect width="640" height="400" fill="#ffffff"/>
<line x1="80" y1="320.0" x2="600" y2="320.0" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="324.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">0</text>
<line x1="80" y1="253.3" x2="600" y2="253.3" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="257.3" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">0.25</text>
<line x1="80" y1="186.7" x2="600" y2="186.7" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="190.7" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">0.5</text>
<line x1="80" y1="120.0" x2="600" y2="120.0" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="124.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">0.75</text>
<line x1="80" y1="53.3" x2="600" y2="53.3" stroke="#d1d5db" stroke-width="1"/>
<text x="72.0" y="57.3" font-size="11.5" text-anchor="end" font-weight="400" fill="#6b7280">1</text>
<line x1="80.0" y1="40" x2="80.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="80.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0.0001</text>
<line x1="210.0" y1="40" x2="210.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="210.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0.001</text>
<line x1="340.0" y1="40" x2="340.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="340.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0.01</text>
<line x1="470.0" y1="40" x2="470.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="470.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">0.1</text>
<line x1="600.0" y1="40" x2="600.0" y2="320" stroke="#d1d5db" stroke-width="1"/>
<text x="600.0" y="338.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6b7280">1</text>
<rect x="80" y="40" width="520" height="280" rx="0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="340.0" y="358.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2937">share of ties rewired, p (log scale)</text>
<text x="34" y="180.0" font-size="12.5" text-anchor="middle" fill="#1f2937" transform="rotate(-90 34 180.0)">relative to the ring (p = 0)</text>
<path d="M80.0,53.3 L142.0,53.6 L210.0,54.1 L272.0,56.0 L340.0,60.8 L402.0,75.7 L470.0,124.0 L532.0,225.1 L600.0,316.3" fill="none" stroke="#0072B2" stroke-width="2.2"/>
<circle cx="80.0" cy="53.3" r="3.6" fill="#0072B2"/>
<circle cx="142.0" cy="53.6" r="3.6" fill="#0072B2"/>
<circle cx="210.0" cy="54.1" r="3.6" fill="#0072B2"/>
<circle cx="272.0" cy="56.0" r="3.6" fill="#0072B2"/>
<circle cx="340.0" cy="60.8" r="3.6" fill="#0072B2"/>
<circle cx="402.0" cy="75.7" r="3.6" fill="#0072B2"/>
<circle cx="470.0" cy="124.0" r="3.6" fill="#0072B2"/>
<circle cx="532.0" cy="225.1" r="3.6" fill="#0072B2"/>
<circle cx="600.0" cy="316.3" r="3.6" fill="#0072B2"/>
<path d="M80.0,74.9 L142.0,115.5 L210.0,181.9 L272.0,240.5 L340.0,272.3 L402.0,288.0 L470.0,296.5 L532.0,300.8 L600.0,302.7" fill="none" stroke="#E69F00" stroke-width="2.2" stroke-dasharray="7 4"/>
<rect x="76.6" y="71.5" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="138.6" y="112.1" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="206.6" y="178.5" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="268.6" y="237.1" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="336.6" y="268.9" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="398.6" y="284.6" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="466.6" y="293.1" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="528.6" y="297.4" width="6.8" height="6.8" fill="#E69F00"/>
<rect x="596.6" y="299.3" width="6.8" height="6.8" fill="#E69F00"/>
<line x1="215" y1="140" x2="245" y2="140" stroke="#0072B2" stroke-width="2.2"/>
<text x="251.0" y="144.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">clustering, C(p) / C(0)</text>
<line x1="215" y1="161" x2="245" y2="161" stroke="#E69F00" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="251.0" y="165.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">mean distance, L(p) / L(0)</text>
<text x="320.0" y="24.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1,000 people, each tied to the 10 nearest on a ring</text>
</svg>
