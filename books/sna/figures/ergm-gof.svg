<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Does the model reproduce the karate club?</title>
<desc>A dot chart of simulated averages as a percent of the real counts for triangles, two-stars and three-stars, under two models.</desc>
<defs></defs>
<rect width="900" height="330" fill="#ffffff"/>
<line x1="170.0" y1="70" x2="170.0" y2="250" stroke="#e5e7eb" stroke-width="1"/>
<text x="170.0" y="272.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">0%</text>
<line x1="303.33333333333337" y1="70" x2="303.33333333333337" y2="250" stroke="#e5e7eb" stroke-width="1"/>
<text x="303.3" y="272.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">25%</text>
<line x1="436.6666666666667" y1="70" x2="436.6666666666667" y2="250" stroke="#e5e7eb" stroke-width="1"/>
<text x="436.7" y="272.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">50%</text>
<line x1="570.0" y1="70" x2="570.0" y2="250" stroke="#e5e7eb" stroke-width="1"/>
<text x="570.0" y="272.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">75%</text>
<line x1="703.3333333333334" y1="70" x2="703.3333333333334" y2="250" stroke="#9ca3af" stroke-width="2"/>
<text x="703.3" y="272.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">100%</text>
<text x="703.3" y="60.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2937">real network</text>
<text x="156.0" y="110.0" font-size="14" text-anchor="end" font-weight="400" fill="#1f2937">Triangles</text>
<rect x="420.3703703703704" y="88" width="16" height="16" rx="3" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="444.4" y="100.0" font-size="12" text-anchor="start" font-weight="400" fill="#E69F00">48%</text>
<circle cx="668.9629629629629" cy="114" r="8" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="685.0" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#0072B2">94%</text>
<text x="156.0" y="170.0" font-size="14" text-anchor="end" font-weight="400" fill="#1f2937">Two-stars</text>
<rect x="506.1414141414141" y="148" width="16" height="16" rx="3" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="530.1" y="160.0" font-size="12" text-anchor="start" font-weight="400" fill="#E69F00">65%</text>
<circle cx="563.2323232323233" cy="174" r="8" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="579.2" y="178.0" font-size="12" text-anchor="start" font-weight="400" fill="#0072B2">74%</text>
<text x="156.0" y="230.0" font-size="14" text-anchor="end" font-weight="400" fill="#1f2937">Three-stars</text>
<rect x="304.88737717309147" y="208" width="16" height="16" rx="3" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="328.9" y="220.0" font-size="12" text-anchor="start" font-weight="400" fill="#E69F00">27%</text>
<circle cx="372.2071050642479" cy="234" r="8" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="388.2" y="238.0" font-size="12" text-anchor="start" font-weight="400" fill="#0072B2">38%</text>
<rect x="183" y="298" width="14" height="14" rx="3" fill="#E69F0055" stroke="#E69F00" stroke-width="2"/>
<text x="206.0" y="309.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">edges + same side</text>
<circle cx="400" cy="305" r="7" fill="#0072B255" stroke="#0072B2" stroke-width="2"/>
<text x="416.0" y="309.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2937">edges + same side + shared partners</text>
</svg>
