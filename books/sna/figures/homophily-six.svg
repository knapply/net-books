<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img" font-family='system-ui, "Helvetica Neue", Arial, sans-serif'>
<title>Six people on two floors</title>
<desc>Six people, four on floor 1 drawn as blue circles and two on floor 2 drawn as orange squares, with seven ties, five of them between people on the same floor.</desc>
<defs></defs>
<rect width="560" height="290" fill="#ffffff"/>
<line x1="153.0" y1="90.0" x2="237.0" y2="90.0" stroke="#9ca3af" stroke-width="2.4"/>
<line x1="143.5" y1="108.6" x2="181.5" y2="161.4" stroke="#9ca3af" stroke-width="2.4"/>
<line x1="246.5" y1="108.6" x2="208.5" y2="161.4" stroke="#9ca3af" stroke-width="2.4"/>
<line x1="217.5" y1="185.0" x2="307.5" y2="205.0" stroke="#9ca3af" stroke-width="2.4"/>
<line x1="352.0" y1="203.2" x2="438.0" y2="176.8" stroke="#D55E00" stroke-width="2.4" stroke-dasharray="7 5"/>
<line x1="448.8" y1="149.9" x2="421.2" y2="100.1" stroke="#9ca3af" stroke-width="2.4"/>
<line x1="282.9" y1="88.5" x2="387.1" y2="81.5" stroke="#D55E00" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="130" cy="90" r="22" fill="#c7e0ee" stroke="#0072B2" stroke-width="2.4"/>
<text x="130.0" y="95.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ana</text>
<circle cx="260" cy="90" r="22" fill="#c7e0ee" stroke="#0072B2" stroke-width="2.4"/>
<text x="260.0" y="95.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Ben</text>
<circle cx="195" cy="180" r="22" fill="#c7e0ee" stroke="#0072B2" stroke-width="2.4"/>
<text x="195.0" y="185.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Chloe</text>
<circle cx="330" cy="210" r="22" fill="#c7e0ee" stroke="#0072B2" stroke-width="2.4"/>
<text x="330.0" y="215.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Dev</text>
<rect x="438" y="148" width="44" height="44" rx="3" fill="#f8e2b2" stroke="#E69F00" stroke-width="2.4"/>
<text x="460.0" y="175.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Eli</text>
<rect x="388" y="58" width="44" height="44" rx="3" fill="#f8e2b2" stroke="#E69F00" stroke-width="2.4"/>
<text x="410.0" y="85.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Fay</text>
<text x="280.0" y="268.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">Dashed red: ties between floors (2). Grey: ties within a floor (5).</text>
</svg>
