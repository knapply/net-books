<text x="416.7" y="294.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2937">Jo</text>
<text x="600.0" y="90.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">Jo can reach everyone,</text>
<text x="600.0" y="112.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">but every route starts</text>
<text x="600.0" y="134.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">with Ivo and then Hana.</text>
<text x="600.0" y="175.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">Remove Ivo or Hana and Jo</text>
<text x="600.0" y="193.8" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">is cut off from the rest.</text>
<text x="600.0" y="212.7" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280"></text>
<text x="600.0" y="231.6" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">That is what high betweenness</text>
<text x="600.0" y="250.4" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">means: not many friends, but a</text>
<text x="600.0" y="269.2" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">position everyone else&#x27;s routes</text>
<text x="600.0" y="288.1" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280">depend on.</text>
